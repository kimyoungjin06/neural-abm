name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install development environment
        run: uv sync --all-extras --dev

      - name: Run lint
        run: uv run ruff check src tests scripts

      - name: Run tests
        run: uv run pytest -q

      - name: Check whitespace
        run: git diff --check

  package-boundary:
    name: Package boundary
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Smoke clone-first default environment
        shell: bash
        run: |
          set -euo pipefail
          export UV_PROJECT_ENVIRONMENT=.venv-clone-smoke
          uv run --no-dev python examples/toy_catalog.py
          uv run --no-dev python - <<'PY'
          import importlib.metadata
          import json
          import sys

          import neural_abm
          import neural_abm.api_lite as api_lite

          payload = {
              "dist_version": importlib.metadata.version("neural-abm"),
              "requires_python": importlib.metadata.metadata("neural-abm").get(
                  "Requires-Python"
              ),
              "torch_loaded": "torch" in sys.modules,
              "toy_count": len(api_lite.toy_catalog()),
              "version": neural_abm.__version__,
          }
          print(json.dumps(payload, sort_keys=True))
          assert payload["dist_version"] == payload["version"]
          assert payload["requires_python"] == ">=3.11"
          assert payload["torch_loaded"] is False
          assert payload["toy_count"] == 10
          PY

      - name: Inspect wheel and sdist
        run: uv run python scripts/inspect_release_artifacts.py --build --ephemeral

      - name: Smoke default package profile
        run: uv run python scripts/smoke_package_profiles.py --profiles default

      - name: Run no-torch catalog example
        run: uv run --no-dev python examples/toy_catalog.py

  python-floor:
    name: Python floor
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Build wheel
        run: uv build --out-dir dist

      - name: Smoke default wheel on supported Python versions
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(ls dist/neural_abm-*.whl | head -n 1)"
          for python_version in 3.11 3.12 3.13 3.14; do
            uv run --quiet --isolated --no-project \
              --python "${python_version}" \
              --with "${wheel}" \
              python - <<'PY'
          import importlib.metadata
          import json
          import sys

          import neural_abm
          import neural_abm.api_lite as api_lite

          installed = sorted(
              dist.metadata["Name"].lower()
              for dist in importlib.metadata.distributions()
          )
          payload = {
              "dist_version": importlib.metadata.version("neural-abm"),
              "installed": installed,
              "python": sys.version.split()[0],
              "requires_python": importlib.metadata.metadata("neural-abm").get(
                  "Requires-Python"
              ),
              "torch_installed": "torch" in installed,
              "torch_loaded": "torch" in sys.modules,
              "toy_count": len(api_lite.toy_catalog()),
              "version": neural_abm.__version__,
          }
          print(json.dumps(payload, sort_keys=True))
          assert payload["requires_python"] == ">=3.11"
          assert payload["torch_installed"] is False
          assert payload["torch_loaded"] is False
          assert payload["toy_count"] == 10
          assert payload["version"] == payload["dist_version"]
          PY
          done

  release-profiles:
    name: Full release profile smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Build release artifacts
        run: uv run python scripts/inspect_release_artifacts.py --build

      - name: Smoke all package profiles
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(ls dist/neural_abm-*.whl | head -n 1)"
          uv run python scripts/smoke_package_profiles.py --wheel "${wheel}"
