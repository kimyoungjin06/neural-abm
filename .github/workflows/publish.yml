name: Publish Python package

on:
  workflow_dispatch:
    inputs:
      target:
        description: Package index to publish to
        required: true
        type: choice
        options:
          - testpypi
          - pypi
      version:
        description: Expected package version
        required: true
        default: 0.1.0a3
      confirm_pypi:
        description: For PyPI only, enter "publish neural-abm <version> to pypi"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.package-version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Validate publish inputs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          expected = os.environ["EXPECTED_VERSION"]
          pyproject = tomllib.loads(Path("pyproject.toml").read_text())
          actual = pyproject["project"]["version"]
          if actual != expected:
              raise SystemExit(
                  f"workflow input version {expected!r} != pyproject version {actual!r}"
              )
          PY

          if [[ "${TARGET}" == "pypi" ]]; then
            expected_ref="refs/tags/v${EXPECTED_VERSION}"
            if [[ "${GITHUB_REF}" != "${expected_ref}" ]]; then
              echo "PyPI publishing must run from ${expected_ref}; got ${GITHUB_REF}" >&2
              exit 1
            fi
            expected_confirmation="publish neural-abm ${EXPECTED_VERSION} to pypi"
            if [[ "${CONFIRM_PYPI}" != "${expected_confirmation}" ]]; then
              echo "PyPI confirmation must be: ${expected_confirmation}" >&2
              exit 1
            fi
          fi
        env:
          CONFIRM_PYPI: ${{ inputs.confirm_pypi }}
          EXPECTED_VERSION: ${{ inputs.version }}
          TARGET: ${{ inputs.target }}

      - name: Inspect wheel and sdist
        run: uv run python scripts/inspect_release_artifacts.py --build

      - name: Smoke default wheel profile
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(ls dist/neural_abm-*.whl | head -n 1)"
          uv run python scripts/smoke_package_profiles.py \
            --wheel "${wheel}" \
            --profiles default

      - name: Record package version
        id: package-version
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "${GITHUB_OUTPUT}"
          import tomllib
          from pathlib import Path

          pyproject = tomllib.loads(Path("pyproject.toml").read_text())
          print(f"version={pyproject['project']['version']}")
          PY

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-testpypi:
    name: Publish to TestPyPI
    if: inputs.target == 'testpypi'
    needs:
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: testpypi
      url: https://test.pypi.org/project/neural-abm/
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  smoke-testpypi:
    name: Smoke TestPyPI install
    if: inputs.target == 'testpypi'
    needs:
      - build
      - publish-testpypi
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Smoke install from TestPyPI
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if uv run --quiet --isolated --no-project \
              --python 3.11 \
              --default-index https://test.pypi.org/simple/ \
              --index https://pypi.org/simple/ \
              --index-strategy unsafe-best-match \
              --prerelease allow \
              --with "neural-abm==${VERSION}" \
              python - <<'PY'
          import importlib.metadata
          import json
          import sys

          import neural_abm
          import neural_abm.api_lite as api_lite

          installed = sorted(
              dist.metadata["Name"].lower()
              for dist in importlib.metadata.distributions()
          )
          payload = {
              "dist_version": importlib.metadata.version("neural-abm"),
              "installed": installed,
              "requires_python": importlib.metadata.metadata("neural-abm").get(
                  "Requires-Python"
              ),
              "torch_installed": "torch" in installed,
              "torch_loaded": "torch" in sys.modules,
              "toy_count": len(api_lite.toy_catalog()),
              "version": neural_abm.__version__,
          }
          print(json.dumps(payload, sort_keys=True))
          assert payload["dist_version"] == payload["version"]
          assert payload["requires_python"] == ">=3.11"
          assert payload["torch_installed"] is False
          assert payload["torch_loaded"] is False
          assert payload["toy_count"] == 10
          PY
            then
              exit 0
            fi
            sleep 10
          done
          exit 1
        env:
          VERSION: ${{ needs.build.outputs.version }}

  publish-pypi:
    name: Publish to PyPI
    if: inputs.target == 'pypi'
    needs:
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/neural-abm/
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  smoke-pypi:
    name: Smoke PyPI install
    if: inputs.target == 'pypi'
    needs:
      - build
      - publish-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Smoke install from PyPI
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if uv run --quiet --isolated --no-project \
              --python 3.11 \
              --prerelease allow \
              --with "neural-abm==${VERSION}" \
              python - <<'PY'
          import importlib.metadata
          import json
          import sys

          import neural_abm
          import neural_abm.api_lite as api_lite

          installed = sorted(
              dist.metadata["Name"].lower()
              for dist in importlib.metadata.distributions()
          )
          payload = {
              "dist_version": importlib.metadata.version("neural-abm"),
              "installed": installed,
              "requires_python": importlib.metadata.metadata("neural-abm").get(
                  "Requires-Python"
              ),
              "torch_installed": "torch" in installed,
              "torch_loaded": "torch" in sys.modules,
              "toy_count": len(api_lite.toy_catalog()),
              "version": neural_abm.__version__,
          }
          print(json.dumps(payload, sort_keys=True))
          assert payload["dist_version"] == payload["version"]
          assert payload["requires_python"] == ">=3.11"
          assert payload["torch_installed"] is False
          assert payload["torch_loaded"] is False
          assert payload["toy_count"] == 10
          PY
            then
              exit 0
            fi
            sleep 10
          done
          exit 1
        env:
          VERSION: ${{ needs.build.outputs.version }}
