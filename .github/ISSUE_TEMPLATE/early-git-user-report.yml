name: Early Git user report
description: Report a clone-first or Git tag install problem.
title: "[early-git] "
labels:
  - early-git
body:
  - type: markdown
    attributes:
      value: |
        Use this form for the current repository-first alpha path. The default
        profile should run `examples/first_run.py` and `examples/toy_catalog.py`
        without installing or loading torch.

        Reproduce the current verified alpha tag first:

        ```bash
        git clone --depth 1 --branch v0.1.0a4 https://github.com/kimyoungjin06/neural-abm.git neural-abm
        cd neural-abm
        uv run --no-dev python examples/first_run.py
        uv run --no-dev python examples/toy_catalog.py
        ```

        Handoff: docs/early-git-user-handoff.md
  - type: dropdown
    id: path
    attributes:
      label: Path used
      description: Which entry path failed?
      options:
        - Fresh clone with uv run --no-dev
        - Direct Git tag install
        - Torch extra install
        - Research or full extra install
        - Other
    validations:
      required: true
  - type: input
    id: ref
    attributes:
      label: Git ref or package version
      description: Use the tag, commit, or package version you attempted.
      placeholder: v0.1.0a4 or aca71d8
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command that failed
      description: Paste the exact command, including flags and extras.
      render: bash
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic output
      description: Paste the full output from the relevant diagnostic commands.
      value: |
        uv --version
        python --version
        git rev-parse --short HEAD
        uv run --no-dev python examples/first_run.py
        uv run --no-dev python examples/toy_catalog.py
      render: text
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, shell, Python version, and uv version.
      placeholder: "Ubuntu 24.04, zsh, Python 3.12.4, uv 0.x.y"
    validations:
      required: true
  - type: dropdown
    id: torch_expected
    attributes:
      label: Did you expect torch-backed behavior?
      description: Default clone-first usage should not install or load torch.
      options:
        - "No, this was the default torch-free path"
        - "Yes, I installed the torch extra"
        - "Yes, I installed the research or full extra"
        - "Not sure"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: What happened instead?
    validations:
      required: true
