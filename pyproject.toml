[project]
name = "neural-abm"
version = "0.1.0a4"
description = "Neural agent-based modeling prototypes with explicit social mixing"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "kimyoungjin06", email = "kimyoungjin06@gmail.com" },
]
keywords = [
    "agent-based modeling",
    "neural agents",
    "simulation",
    "social mixing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=2.4.4",
    "pyyaml>=6.0.3",
]

[project.urls]
Homepage = "https://github.com/kimyoungjin06/neural-abm"
Repository = "https://github.com/kimyoungjin06/neural-abm"
Issues = "https://github.com/kimyoungjin06/neural-abm/issues"

[project.optional-dependencies]
cli = [
    "tqdm>=4.67.3",
]
config = [
    "pydantic>=2.13.3",
]
full = [
    "matplotlib>=3.10.9",
    "networkx>=3.6.1",
    "pandas>=3.0.2",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.3",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "torch>=2.11.0",
    "tqdm>=4.67.3",
]
plot = [
    "matplotlib>=3.10.9",
]
research = [
    "networkx>=3.6.1",
    "pandas>=3.0.2",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.3",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "torch>=2.11.0",
    "tqdm>=4.67.3",
]
torch = [
    "torch>=2.11.0",
]

[dependency-groups]
dev = [
    "matplotlib>=3.10.9",
    "networkx>=3.6.1",
    "pandas>=3.0.2",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.3",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "torch>=2.11.0",
    "tqdm>=4.67.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neural_abm"]

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/pyproject.toml",
    "/docs/api-surface-audit.md",
    "/docs/git-distribution-flow.md",
    "/docs/early-git-user-handoff.md",
    "/docs/package-release-boundary.md",
    "/docs/pre-release-artifact-flow.md",
    "/docs/toy-models/README.md",
    "/docs/toy-models/capability-matrix.md",
    "/docs/decisions/0013-public-api-v0-contract.md",
    "/docs/decisions/0014-package-dependency-policy.md",
    "/examples/README.md",
    "/examples/first_run.py",
    "/examples/minimal_api_nabm.py",
    "/examples/toy_catalog.py",
    "/scripts/inspect_release_artifacts.py",
    "/scripts/smoke_package_profiles.py",
    "/src/neural_abm",
]
exclude = [
    "/src/neural_abm/README.md",
]

[tool.ruff]
line-length = 88
target-version = "py311"
