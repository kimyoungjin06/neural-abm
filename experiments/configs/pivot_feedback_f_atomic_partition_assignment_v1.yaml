claim_boundary: >-
  This outcome-blind component assigns the 65 verified final-panel shock
  episodes and their field-subfield families atomically by registered event
  year, preserving every response cohort with its episode even when cohort
  years cross an entry-calendar boundary. It records the empty discovery and
  model-selection episode cells instead of fabricating episodes, and binds the
  future five-fold component recipe without reading author tokens or assigning
  row-level folds. It does not materialize private G4 rows, enforce author-cold
  membership at row level, enumerate or hash holdout files, read entry,
  persistence, realized citation, model score, or G4 outcomes, fit a model,
  pass F or G0, or establish an association, null, prediction, transport,
  causality, or scientific effect.
