claim_boundary: >-
  This zero-cost audit expands the 70,277 frozen field-topic-entry-year
  candidates into their six pre-entry window cells and measures work
  membership and four-card router coverage from already frozen aggregate
  artifacts. It does not materialize titles or work IDs and does not read the
  raw OpenAlex main table. Counts are workload and coverage facts, not content
  validity or accuracy. Four cards cannot screen 994 topics. Paid API work,
  production dispositions, reselection, author-panel rebuilding, pivot
  classification, outcomes, model fitting, G4, and scientific effects remain
  unopened, unauthorized, not run, or not established.
