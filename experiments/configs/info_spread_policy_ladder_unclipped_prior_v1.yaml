stage: O24 (N17, third of four follow-ups the user chose to run in order on 2026-10-21)
purpose: 'D5 distilled the once-elicited prior after clipping each answer to a probability in [1e-4, 1 - 1e-4], and in
  Regime A 99% of answers fell below the clip, so P0/A was nearly constant. This study rebuilds the prior from the same
  registered elicitation without the clip (P0u) and runs it, and the learner started from it (L1u), in the study v2
  cells. It asks whether the model''s answers carry usable information once the readout does not saturate, and whether
  such a prior helps the learner.'
