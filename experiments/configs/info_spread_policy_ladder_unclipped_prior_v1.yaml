  elicitation: D5'S FIRST REGISTERED ELICITATION, WHOSE SHA256 THE D5 RECORD NAMES; ITS PROMPTS ARE CHECKED AGAINST D3B
parity: L0 RECOMPUTED AT REPLICATE 0 OF EVERY L1U TASK MUST EQUAL STUDY V2'S VALUE EXACTLY; ANY FAILURE BLOCKS READING
prior:
  readout: THE RAW LOG-ODDS (LOGIT OF YES MINUS LOGIT OF NO), WITH NO PROBABILITY CLIP
  distillation: D3B'S RIDGE ON THE SAME COHORT AND FEATURES, LAMBDA 0.001 PER PROFILE, INTERCEPT UNPENALIZED
  calibration: D3B'S SINGLE INTERCEPT SHIFT TO THE STATED BASE RATE 0.4 OVER THE COHORT
  inspected_before_the_freeze: NOTHING ABOUT THE UNCLIPPED PRIOR; ITS WEIGHTS AND FIT ARE FIRST READ IN THE RECORD
  llm_calls: 0
arms:
- P0u
- L1u
comparisons:
  unclipped_prior_vs_hand: [P0u, F1]
  unclipped_prior_in_learner: [L1u, L0]
  closed_loop_on_unclipped_prior: [L1u, P0u]
descriptive:
  readout_effect_on_the_prior: [P0u, P0]
  readout_effect_on_the_learner: [L1u, L1]
measures:
  primary: unverified_share_precision (study v2's)
  recorded: share_precision
seeds:
  learner_seeds: STUDY V2'S, AS FOR L0 AND L1
  rule_tag: 12
rule:
  comparison: paired difference in the primary measure
  minimum_effect: 0.01
  bootstrap_resamples: 2000
  interval: 0.95
  resampling: cells, with replacement
  material: interval excludes zero and |mean cell delta| >= minimum_effect
dispositions:
  per_regime: MOSTLY_POSITIVE if POSITIVE in at least 4 of the 6 study groups, MOSTLY_NEGATIVE if NEGATIVE in at least
    4 of 6, otherwise MIXED_OR_NONE, for each comparison
  mostly_at_least: 4
  null_check: L1u - P0u material and positive in any null group is DESIGN_DEFECT_IN_NULL_WORLD and blocks reading the
    study groups
  expected_before_the_run: 'Not predicted. If the unclipped Regime A answers carry information, P0u - F1 rises from
    D5''s P0 - F1; whether the learner gains from it is the open question.'
precommit:
