claims:
  confirmed:
  - id: C63_for_d5s_prior_the_utility_cost_inside_the_learner_comes_from_its_calibration
    statement: Crossing D5's prior P0 with the hand rule F1 in direction and calibration, giving the learner P0's
      calibration lowers utility along both routes, in 6 and 6 of 6 Regime A groups and 4 and 4 of 6 Regime B groups,
      while P0's answers do so along one route only (CALIBRATION in both regimes). At P0's own calibration its answers
      make no material difference in Regime A, where its logit sd over the cohort is 0.06.
    evidence:
    - source: o28_calibration
      pointer: dispositions/by_case/P0~1A/attribution
      equals: CALIBRATION
    - source: o28_calibration
      pointer: dispositions/by_case/P0~1B/attribution
      equals: CALIBRATION
    - source: o28_calibration
      pointer: dispositions/by_case/P0~1A/counts/calibration_given_llm_answers/NEGATIVE
      equals: 6
    - source: o28_calibration
      pointer: dispositions/by_case/P0~1A/counts/calibration_given_hand_answers/NEGATIVE
      equals: 6
    - source: o28_calibration
      pointer: dispositions/by_case/P0~1B/counts/calibration_given_llm_answers/NEGATIVE
      equals: 4
    - source: o28_calibration
      pointer: dispositions/by_case/P0~1B/counts/calibration_given_hand_answers/NEGATIVE
      equals: 4
    - source: o28_calibration
      pointer: dispositions/by_case/P0~1A/counts/answers_given_llm_calibration/INDISTINGUISHABLE
      equals: 6
    - source: o28_calibration
      pointer: priors/A/P0/logit_sd
      less_than: 0.1
  - id: C64_for_the_unclipped_prior_its_answers_and_calibration_interact
    statement: For the unclipped prior P0u in Regime B, neither factor alone carries the cost (NEITHER_CONSISTENTLY).
      Its answers lower utility at F1's calibration in 6 of 6 groups and raise it at their own calibration in 4 of 6,
      as they do in Regime A (4 of 6). Its calibration lowers utility given F1's answers (4 of 6) and is mixed given
      its own.
    evidence:
    - source: o28_calibration
      pointer: dispositions/by_case/P0u~1B/attribution
      equals: NEITHER_CONSISTENTLY
    - source: o28_calibration
      pointer: dispositions/by_case/P0u~1B/counts/answers_given_hand_calibration/NEGATIVE
      equals: 6
    - source: o28_calibration
      pointer: dispositions/by_case/P0u~1B/counts/answers_given_llm_calibration/POSITIVE
      equals: 4
    - source: o28_calibration
      pointer: dispositions/by_case/P0u~1A/counts/answers_given_llm_calibration/POSITIVE
      equals: 4
    - source: o28_calibration
      pointer: dispositions/by_case/P0u~1B/by_comparison/calibration_given_hand_answers
      equals: MOSTLY_NEGATIVE
    - source: o28_calibration
      pointer: dispositions/by_case/P0u~1B/by_comparison/calibration_given_llm_answers
      equals: MIXED_OR_NONE
  - id: C65_no_llm_informed_start_in_o28_beats_the_hand_rules_start_under_utility
    statement: Against the learner started from F1 (L0), each LLM-informed start in O28 (F1's answers at an LLM
      calibration, or an LLM's answers at F1's calibration) is MOSTLY_NEGATIVE under utility in 7 of the 8 prior and
      regime cases and MIXED_OR_NONE in the eighth. None is MOSTLY_POSITIVE.
    evidence:
    - source: o28_calibration
      pointer: dispositions/by_case/P0~1A/by_comparison/calibration_given_hand_answers
      equals: MOSTLY_NEGATIVE
    - source: o28_calibration
      pointer: dispositions/by_case/P0~1A/by_comparison/answers_given_hand_calibration
      equals: MOSTLY_NEGATIVE
    - source: o28_calibration
      pointer: dispositions/by_case/P0~1B/by_comparison/calibration_given_hand_answers
      equals: MOSTLY_NEGATIVE
    - source: o28_calibration
      pointer: dispositions/by_case/P0~1B/by_comparison/answers_given_hand_calibration
      equals: MOSTLY_NEGATIVE
    - source: o28_calibration
      pointer: dispositions/by_case/P0u~1A/by_comparison/calibration_given_hand_answers
      equals: MOSTLY_NEGATIVE
    - source: o28_calibration
      pointer: dispositions/by_case/P0u~1A/by_comparison/answers_given_hand_calibration
      equals: MIXED_OR_NONE
    - source: o28_calibration
      pointer: dispositions/by_case/P0u~1B/by_comparison/calibration_given_hand_answers
      equals: MOSTLY_NEGATIVE
    - source: o28_calibration
      pointer: dispositions/by_case/P0u~1B/by_comparison/answers_given_hand_calibration
      equals: MOSTLY_NEGATIVE
  - id: C66_a_prior_recalibrated_on_the_cohort_does_not_share_like_its_source_in_the_world
    statement: Each recalibrated fixed prior moved toward its calibration source, as registered, but overshot it in
      the world. LLM directions at F1's calibration share 1.35 to 1.48 times as much as F1. F1's direction at an LLM
      calibration shares 20 to 46% as much as the LLM prior, or in Regime A with P0's calibration, as little.
    evidence:
    - source: o28_calibration
      pointer: calibration_check/P0_hcal~1B/moves_to_its_calibration_source
      equals: true
    - source: o28_calibration
      pointer: calibration_check/F1_ucal~1A/moves_to_its_calibration_source
      equals: true
    - source: o28_calibration
      pointer: calibration_check/P0u_hcal~1B/mean_unverified_shares
      greater_than: 550000
    - source: o28_calibration
      pointer: calibration_check/P0u_hcal~1B/calibration_source
      less_than: 400000
    - source: o28_calibration
      pointer: calibration_check/F1_ucal~1A/mean_unverified_shares
      less_than: 50000
    - source: o28_calibration
      pointer: calibration_check/F1_ucal~1A/calibration_source
      greater_than: 200000
  - id: C67_o28_reproduced_byte_for_byte_with_parity_and_consistency
    statement: O28 reproduced its cells and summary byte for byte in a second run on GPU-Server. L0 recomputed in all
      240 learner tasks equalled its record, utility included, and every group's L1 - L0 and L1u - L0 equalled O25's
      recorded value.
    evidence:
    - source: o28_calibration
      pointer: reproduction/byte_identical/cells.jsonl
      equals: true
    - source: o28_calibration
      pointer: reproduction/byte_identical/summary.json
      equals: true
    - source: o28_calibration
      pointer: parity_failures
      equals: []
    - source: o28_calibration
      pointer: consistency_failures
      equals: []
  rejected:
  - id: R20_calibration_carries_the_cost_in_every_costed_case
    statement: The O28 expectation stated before the run, CALIBRATION in every costed case (P0/A, P0/B, P0u/B).
    reason: It holds for D5's prior in both regimes, but the unclipped prior in Regime B is NEITHER_CONSISTENTLY.
    evidence:
    - source: o28_calibration
      pointer: dispositions/overall
      equals: O28_ATTRIBUTION_DIFFERS_ACROSS_COSTED_CASES
  open:
  - id: O32_location_or_steepness
    question: Which part of the calibration carries the cost of D5's prior, its location (the base-rate shift) or its
      steepness?
    kind: SYNTHETIC
    priority: 2
    motivation: O28 moved both together.
  - id: O33_calibration_matched_in_the_world
    question: Do C63 and C64 hold when a prior is recalibrated to match its source's share rate in the world rather
      than its calibration on the design cohort?
    kind: SYNTHETIC
    priority: 1
    motivation: C66. The cohort-matched recalibration overshot in the world, so the answers comparisons at F1's
      calibration also carry a difference in how much the starting prior shares.
