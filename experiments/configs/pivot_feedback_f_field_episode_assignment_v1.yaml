selection_algorithm:
  primary_rule: LEXICOGRAPHIC_MAXIMIN_STRUCTURAL_COVERAGE
  metric_order:
    - eligible_author_count
    - matured_entry_opportunity_count
    - pre_cutoff_work_count
    - publication_date_completeness
    - fixed_horizon_outcome_coverage
    - pre_entry_t_minus_1_edge_coverage
    - orcid_linked_author_rate
    - independent_attention_shock_count
  metric_percentile: COUNT_OF_26_FIELDS_WITH_VALUE_LESS_THAN_OR_EQUAL_TO_CURRENT_DIVIDED_BY_26
  minimum_structural_coverage: MINIMUM_OF_EIGHT_EXACT_METRIC_PERCENTILES
  field_tie_breakers:
    - minimum_structural_coverage_desc
    - eligible_author_count_desc
    - fixed_horizon_outcome_coverage_desc
    - numeric_field_id_asc
  reserves_per_domain: 2
  reserve_rule: NEXT_RANKED_BY_IDENTICAL_FROZEN_RULE
  reserve_set: DOMAIN_RANKS_TWO_AND_THREE_IN_FIXED_ORDER
  domain_score: PRIMARY_FIELD_FULL_FROZEN_FIELD_RANKING_KEY
  domain_tie_break: CROSS_FIELD_MATRIX_RNG_CODE_ASC
  assignment: TOP_THREE_DOMAINS_TO_G1_REMAINDER_TO_G4
  one_slot_per_domain_without_replacement: true
  g4_domain_disjoint_from_g1: true
  g4_author_cold: true
  outcome_metrics_allowed: false

episode_assignment:
  selected_field_period: SLOT_REGISTERED_TEMPORAL_PARTITION_ONLY
  retain_all_primary_threshold_attention_Candidates: true
  atomic_family: CURRENT_SNAPSHOT_SUBFIELD
  minimum_independent_families_per_selected_field: 3
  outcome_based_candidate_or_field_substitution: false
  reserve_activation_before_panel_completion: ONLY_IF_PRIMARY_FIELD_FAILS_REGISTERED_STRUCTURAL_CONFORMANCE
  reserve_activation_order: NOMINAL_PRIMARY_THEN_DOMAIN_RANK_TWO_THEN_DOMAIN_RANK_THREE
  reserve_activation_criterion: AT_LEAST_THREE_INDEPENDENT_SUBFIELD_FAMILIES_IN_ASSIGNED_SLOT_PERIOD
  reserve_activation_after_outcome_read: false

