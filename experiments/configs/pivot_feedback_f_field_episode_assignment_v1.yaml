claim_boundary: >-
  This F-phase component freezes and executes an outcome-blind structural field,
  domain, slot, and attention-shock-family assignment. It may read only bound
  bibliographic and author-token metadata needed to construct predecision
  coverage; it may not compute entry or persistence labels, inspect an effect,
  fit a model, or open G4. Aggregate shock candidates are a structural screen
  and do not replace the registered focal-author and preexisting-peer leave-out
  replay required in the final panel. Passing this component does not pass F or
  G0, complete final-panel conformance, create the private holdout seal,
  establish transport or causality, or establish a scientific effect.
