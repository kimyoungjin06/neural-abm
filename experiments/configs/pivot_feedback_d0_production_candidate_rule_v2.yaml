claim_boundary: >-
  This contract freezes the disclosed post-diagnostic candidate rule v2 and
  five production candidate dispositions. It regenerates adaptive frontier v3
  and preserves only the Computer Science field certificate. Medicine rank 3
  T10543 entry 1986 becomes the next required candidate, so no global
  certificate is issued. Only a versioned v19 gate may authorize its exact
  targeted sample. No general raw scan, API request, deterministic reselection,
  outcomes, fitting, G4, out-of-sample validation claim, semantic truth, or
  scientific effect is authorized.
