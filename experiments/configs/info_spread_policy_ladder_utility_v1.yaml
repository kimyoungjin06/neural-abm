  llm_arms:
    contract: experiments/configs/info_spread_policy_ladder_llm_arms_v1.yaml
    record: experiments/evidence/results/info_spread_policy_ladder_llm_arms_d5_20261019.summary.json
    arms: [P0, X0, L1]
  unclipped_prior:
    contract: experiments/configs/info_spread_policy_ladder_unclipped_prior_v1.yaml
    record: experiments/evidence/results/info_spread_policy_ladder_unclipped_prior_v1_20261021.summary.json
    arms: [P0u, L1u]
  elicitation: D5'S FIRST REGISTERED ELICITATION (FOR THE REGIME B RERUN OF P0, X0, P0u, L1, AND L1u)
profile_for_counts: development
measure:
  name: unverified_utility_per_agent
  definition: (TRUE SHARES - SUM OF THE SHARERS' COSTS OF FALSE SHARES) / AGENTS, OVER DECIDED SHARES (POLICY AND
    EXPLORATION FLOOR) OF ITEMS WHOSE FACT-CHECK IS NOT PUBLIC AT THE DECISION
  regime_a: COMPUTED FROM THE RECORDED COUNTS, BECAUSE EVERY COST IS 1; NO RUN
  regime_b: EVERY ARM RERUN WITH scripts/info_spread_utility_measure_v1.py, WITH STUDY V2'S SEEDS, DONORS, AND STREAMS
  parity: EVERY REGIME B RERUN ROW MUST REPRODUCE ITS RECORDED PRECISIONS, FALSE REACH, DECISIONS, AND COUNTS BY STATE
    EXACTLY; ANY FAILURE BLOCKS READING
arms: [F1, T0_1, T0_4, L0, P0, X0, L1, P0u, L1u]
comparisons:
  closed_loop: [L0, T0_1]
  best_table: [L0, T0_4]
  hand_rule: [L0, F1]
  llm_prior_in_learner: [L1, L0]
  nabm_vs_archetypes: [L0, X0]
  closed_loop_on_llm_prior: [L1, P0]
  llm_prior_vs_hand: [P0, F1]
  unclipped_prior_vs_hand: [P0u, F1]
  unclipped_prior_in_learner: [L1u, L0]
  closed_loop_on_unclipped_prior: [L1u, P0u]
seeds:
  rule_tag: 13
rule:
  comparison: paired difference in utility per agent per run
  bootstrap_resamples: 2000
  interval: 0.95
  resampling: cells, with replacement
  minimum_effect_fraction_of_hand_rule: 0.01
  minimum_effect: 1% OF THE MEAN ABSOLUTE UTILITY OF F1 OVER THE REGIME'S STUDY GROUPS, ONE SCALE PER REGIME
  material: interval excludes zero and |mean cell delta| >= the regime's minimum effect
dispositions:
  per_comparison_and_regime: MOSTLY_POSITIVE if POSITIVE in at least 4 of the 6 study groups, MOSTLY_NEGATIVE if NEGATIVE
    in at least 4 of 6, otherwise MIXED_OR_NONE; computed under utility and, from the records, under precision
  mostly_at_least: 4
  agreement: THE TWO SUMMARIES AGREE OR NOT, FOR EACH COMPARISON AND REGIME
  overall: CONCLUSIONS_HOLD_UNDER_UTILITY if every summary agrees, otherwise SOME_CONCLUSIONS_CHANGE_UNDER_UTILITY
  null_groups: REPORTED, NOT JUDGED. In the null world every share has negative expected utility, so a learner that
    learns the base rate rightly gains utility by sharing less; reruns are validated by parity instead
  expected_before_the_run: 'Not predicted. Precision rewards selectivity, so comparisons that turn on how much an arm
    shares (P0 and X0 in particular) are the likeliest to change.'
precommit:
  precommit_paths:
  - docs/research/info-spread-policy-ladder-utility-v1.md
  - experiments/configs/info_spread_policy_ladder_utility_v1.yaml
  - scripts/run_info_spread_policy_ladder_utility_v1.py
  - tests/test_info_spread_policy_ladder_utility_v1.py
  - scripts/info_spread_utility_measure_v1.py
  - tests/test_info_spread_utility_measure_v1.py
runs:
  pilot: --pilot-cells 2 under full load, for the time estimate only
  development: --profile development --precommit-sha <HEAD> --elicitation-dir <D5 first elicitation> --v2-cells --d5-cells
    --o24-cells <the three development cells.jsonl> on GPU-Server, CUDA_VISIBLE_DEVICES=2, 24 workers
  reproduction: the same command into a second output directory; cells.jsonl and summary.json must be byte identical
outputs: [cells.jsonl, summary.json, progress.jsonl, receipt.json]
boundaries:
  empirical_rows_read: 0
  llm_calls: 0
  generic_nabm_api_changed: false
  synthetic_only: true
