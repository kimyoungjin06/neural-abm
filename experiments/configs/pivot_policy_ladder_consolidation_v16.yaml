claims:
  confirmed:
  - id: C107_the_rule_passed_its_generator_check_at_the_empirical_shape
    statement: Before any label was read, the whole pipeline ran on synthetic labels at the discovery episodes' shape,
      with episode heterogeneity tau of 0, 0.25, 0.5, and 1 and 40 replicates each. The rule's predicted gap had the
      sign of 92% to 99.6% of the determined groups, and it put at most 2.9% of them on the wrong side, so the
      registered check passed and the labels were read.
    evidence:
    - source: crossover_openalex
      pointer: generator_check/passes
      equals: true
    - source: crossover_openalex
      pointer: generator_check/taus/tau=0.25/agreement_share
      greater_than: 0.919
    - source: crossover_openalex
      pointer: generator_check/taus/tau=0.25/reversal_share
      less_than: 0.03
    - source: crossover_openalex
      pointer: expectations/X1/held
      equals: true
  - id: C108_in_the_discovery_episodes_the_learner_wins_where_determined_and_the_rule_agrees
    statement: With an entrant's chance of a follow-up topic work as the policy, an episode's own visible follow-up
      share beat a table of other discovery episodes' shares in all 7 determined groups, every table size at 150 or
      more visible labels and the one-episode table from 15. The rule agreed with all 7 and put none on the wrong
      side. No group was determined for the table, so the baseline that the learner always wins agrees as well, and
      the data test the rule on the learner's side only.
    evidence:
    - source: crossover_openalex
      pointer: status
      equals: E3S2_THE_LEARNER_WINS_WHERE_DETERMINED_AND_THE_RULE_AGREES
    - source: crossover_openalex
      pointer: score/agreements
      equals: 7
    - source: crossover_openalex
      pointer: score/reversals
      equals: 0
    - source: crossover_openalex
      pointer: score/negative
      equals: 0
    - source: crossover_openalex
      pointer: score/baseline_learner_always_wins_agreements
      equals: 7
    - source: crossover_openalex
      pointer: groups/k=16~1bin=3/label
      equals: POSITIVE
    - source: crossover_openalex
      pointer: groups/k=16~1bin=3/low
      greater_than: 0.0026
    - source: crossover_openalex
      pointer: groups/k=1~1bin=1/label
      equals: POSITIVE
  - id: C109_the_rule_places_the_crossing_at_7_to_14_visible_outcomes_which_most_forecasts_reach
    statement: From all 24 episodes, the within-episode variance per label was 0.068 and the between-episode standard
      deviation of follow-up shares 0.065, corrected for sampling, around an unweighted mean share of 0.079. The rule
      puts the crossing at 6.8 visible labels for a one-episode table and 14.1 for a 16-episode table; 93.5% to
      97.9% of the forecasts had at least that many. For a large table the crossing approaches V over the
      between-episode variance, which is Bühlmann's credibility constant.
    evidence:
    - source: crossover_openalex
      pointer: described/tables/k=1/crossing_labels
      greater_than: 6.77
    - source: crossover_openalex
      pointer: described/tables/k=16/crossing_labels
      less_than: 14.08
    - source: crossover_openalex
      pointer: described/tables/k=16/share_of_forecasts_beyond_the_crossing
      greater_than: 0.935
    - source: crossover_openalex
      pointer: described/between_episode_sd_of_shares
      greater_than: 0.065
    - source: crossover_openalex
      pointer: described/V
      less_than: 0.0683
  - id: C110_post_hoc_the_observed_gap_rises_more_steeply_with_evidence_than_the_rule
    statement: 'Post hoc and descriptive. Below 50 visible labels the observed gap lay below the rule''s prediction;
      from 50 on, above it. At 150 or more it was +0.0163 to +0.0211 against the rule''s +0.0041 to +0.0090, though
      every predicted mean lay inside its observed interval, which rests on 7 episodes. The unweighted mean share,
      0.079, is about half the pooled share, 0.146, so larger episodes follow up more often; an equally weighted
      table then misses a large episode by more than the average heterogeneity. That is not tested.'
    evidence:
    - source: crossover_openalex
      pointer: groups/k=16~1bin=3/mean
      greater_than: 0.0162
    - source: crossover_openalex
      pointer: groups/k=16~1bin=3/predicted
      less_than: 0.0042
    - source: crossover_openalex
      pointer: score/coverage
      equals: 1.0
    - source: crossover_openalex
      pointer: described/mean_episode_share
      less_than: 0.0788
    - source: peer_outcome_contrast
      pointer: data/counts/labelled_precise_entrants
      equals: 920
  - id: C111_the_study_reproduced_byte_for_byte_and_read_the_discovery_partition_only
    statement: The development and reproduction runs on the workstation (42 and 44 s) wrote byte-identical summary,
      receipt, and episode-quarter files. They read the 6,291 discovery precise entrants and their topic works, and
      their counts equal experiment 4's record; no confirmatory or G4 outcome was read.
    evidence:
    - source: crossover_openalex
      pointer: execution/byte_identical/summary.json
      equals: true
    - source: crossover_openalex
      pointer: execution/byte_identical/private~1episode_quarters.parquet
      equals: true
    - source: crossover_openalex
      pointer: checks/after_the_labels/labelled_precise_entrants
      equals: true
    - source: crossover_openalex
      pointer: data_access/confirmatory_outcome_rows_read
      equals: 0
    - source: crossover_openalex
      pointer: data_access/g4_outcome_rows_read
      equals: 0
  rejected:
  - id: R28_x3_no_table_win_is_determined_at_the_least_evidence
    statement: X3 failed. Below 15 visible labels the observed gap favoured every table (-0.0095 to -0.0041), but
      every interval covered zero, so no table win was determined.
    evidence:
    - source: crossover_openalex
      pointer: expectations/X3/held
      equals: false
    - source: crossover_openalex
      pointer: groups/k=16~1bin=0/label
      equals: INDISTINGUISHABLE
    - source: crossover_openalex
      pointer: groups/k=16~1bin=0/mean
      less_than: 0
  open:
  - id: O43_a_credibility_weighted_policy
    question: Does a policy that starts from the table and weights the episode's visible share by n / (n + V/H_k), a
      table as prior with a closed-loop update, beat both the table and the episode's own share?
    kind: EMPIRICAL_DISCOVERY_PARTITION_AFTER_A_SYNTHETIC_CHECK
    priority: 2
    motivation: The crossing is Bühlmann's credibility constant (C109), and NABM's prior-plus-learner arms are this
      policy. Neither the table nor the episode's share alone is the textbook optimum.
    evidence:
    - source: crossover_openalex
      pointer: described/tables/k=16/H
      greater_than: 0.0048
  - id: O44_the_crossover_rule_on_the_confirmatory_partition
    question: Does the ordering replicate on the sealed confirmatory episodes, and do they decide a comparison for the
      table?
    kind: EMPIRICAL_CONFIRMATORY_PARTITION_SEALED
    priority: 3
    motivation: The discovery episodes decided only the learner's side (C108), and their labels have now been read
      twice. A confirmatory reading needs its own precommit and the user's authorization.
    evidence:
    - source: crossover_openalex
      pointer: score/negative
      equals: 0
