framework_decisions:
  rule: >-
    Generalize a Pivot capability into the generic NABM API only when a second
    model family needs the same semantics; otherwise record an explicit
    domain-owned decision.
  decisions:
    - id: F01_delayed_selective_outcome_queue
      decision: DOMAIN_OWNED
      second_consumer: NONE
    - id: F02_persistence_exit_state_machine
      decision: DOMAIN_OWNED
      second_consumer: NONE
    - id: F03_out_of_sample_agent_policy_scoring
      decision: EXTRACTION_CANDIDATE_DESIGN_BEFORE_API
      second_consumer: TOY_CLASSIFICATION_EVALUATE_AGENTS_ON_A_HELD_OUT_TEST_SPLIT
      next_action: >-
        DESIGN_ONE_SHARED_SCORING_CONTRACT_FOR_BOTH_CONSUMERS_BEFORE_ANY_API_CHANGE
    - id: F04_cross_fitted_shared_evidence_record
      decision: DOMAIN_OWNED
      second_consumer: NONE
      lesson: IN_SITU_POLICY_SCORING_LEAKS_WHEN_THE_LEARNER_HOLDS_THE_SCORED_AGENTS_OWN_OUTCOME
    - id: F05_rank_matched_fit_worlds_and_matched_marginal_generators
      decision: CASE_OWNED_RESEARCH_INSTRUMENTS
      second_consumer: NONE
    - id: F06_batch_policy_families
      decision: CASE_OWNED
      second_consumer: NONE
    - id: F07_deterministic_parallel_task_runner
      decision: ENGINEERING_PATTERN_NOT_EXTRACTED
      second_consumer: NONE_THE_GENERIC_SWEEP_RUNNER_HAS_NO_PARALLEL_NEED_YET
    - id: F08_fair_model_ladder_practices
      decision: RECORD_AS_METHOD_GUIDANCE
      practices:
        - MATCH_OPTIMIZER_AND_INITIALIZATION_ACROSS_COMPARED_FAMILIES
        - SUBTRACT_THE_SAME_GAP_IN_A_WORLD_WHERE_THE_CLAIMED_STRUCTURE_IS_ABSENT
        - TUNE_EVERY_FAMILY_ON_TRAINING_DATA_ONLY
        - SCORE_POLICIES_OUT_OF_SAMPLE
        - DECIDE_PER_REGIME_AND_REPORT_SATURATION_AS_AN_OUTCOME
        - EXACTLY_NEST_THE_PREDECESSOR_BEFORE_INTERPRETING_A_NEW_ARM

