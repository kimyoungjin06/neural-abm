claims:
  confirmed:
    - id: C01_failure_delay_amplifies_imitative_entry
      statement: Delaying failure visibility raises imitative entry and failed pivots.
      evidence:
        - {source: delayed_feedback, pointer: registered_result_disposition/DELAY_AMPLIFIES_IMITATIVE_LOCK_IN, equals: OBSERVED_IN_SYNTHETIC_PHASE_MAP}
    - id: C02_cautionary_learning_trades_exploration_for_correction
      statement: Failure-only learning cuts failed pivots at a productive-exploration cost, and a scalar rule reproduces the trade-off.
      evidence:
        - {source: delayed_feedback, pointer: registered_result_disposition/CAUTIONARY_CORRECTION_WITH_PRODUCTIVE_EXPLORATION_COST, equals: OBSERVED_IN_SYNTHETIC_PHASE_MAP}
        - {source: adaptive_ladder, pointer: registered_result_disposition/CAUTIONARY_TRADEOFF_DOES_NOT_REQUIRE_NEURAL_WEIGHTS, equals: OBSERVED}
    - id: C03_overshoot_purge_and_missingness_residue
      statement: Complete delay gives overshoot then purge; permanently missing failures leave a persistent failed stock.
      evidence:
        - {source: persistence_exit, pointer: registered_result_disposition/LATE_FAILURE_EVIDENCE_REDUCES_ACTIVE_FAILED_STOCK, equals: OBSERVED_AFTER_OVERSHOOT_AND_PURGE_WITH_FULL_VISIBILITY}
        - {source: persistence_exit, pointer: registered_result_disposition/SELECTIVE_VISIBILITY_PRESERVES_FAILED_ACTIVITY, equals: OBSERVED}
    - id: C04_final_stock_alone_misleads
      statement: Similar final stocks can hide different entry, exit, and survivor paths, so the full observation vector is required.
      evidence:
        - {source: persistence_exit, pointer: case_study_assessment/single_final_stock_is_insufficient, equals: true}
    - id: C05_adaptation_is_needed
      statement: A fixed rule cannot produce the visibility response.
      evidence:
        - {source: adaptive_ladder, pointer: registered_result_disposition/FIXED_RULE_REMAINS_SUFFICIENT_FOR_THE_REGISTERED_SURFACE, equals: NOT_OBSERVED_FIXED_RULE_IS_VISIBILITY_INVARIANT}
    - id: C06_scalar_adaptation_reproduces_the_linear_fit_phase_surface
      statement: With linear productive fit, a one-state rule reproduces the neural phase directions.
      evidence:
        - {source: adaptive_ladder, pointer: registered_result_disposition/DELTA_RULE_REPRODUCES_NEURAL_PHASE_DIRECTIONS, equals: OBSERVED}
    - id: C07_feature_conditional_learning_is_needed_when_structure_reverses
      statement: At a fixed success rate, a scalar learner cannot track which profiles succeed; a feature-conditional one can.
      evidence:
        - {source: matched_marginal_v3, pointer: registered_result_disposition/feature_conditional_need, equals: SUPPORTED_ON_FROZEN_GENERATOR}
    - id: C08_nonlinear_representation_is_needed_for_interactions
      statement: With the optimizer matched, nonlinear policies beat linear ones beyond their linear-world edge in both boundary geometries.
      evidence:
        - {source: matched_marginal_v3, pointer: registered_result_disposition/nonlinear_representation_need, equals: SUPPORTED_BOTH_GEOMETRIES}
    - id: C09_family_choice_depends_on_boundary_geometry
      statement: The MLP wins smooth boundaries and the tree wins axis-aligned ones, in the policy layer and out of sample inside the ABM.
      evidence:
        - {source: matched_marginal_v3, pointer: registered_result_disposition/nonlinear_family_dominance, equals: GENERATOR_DEPENDENT_OR_TIED}
        - {source: nonlinear_abm_v2, pointer: registered_result_disposition/immediate/geometry_crossover, equals: CROSSOVER_TRANSFERS_TO_ABM}
        - {source: nonlinear_abm_v2, pointer: registered_result_disposition/failure_lag_2/geometry_crossover, equals: CROSSOVER_TRANSFERS_TO_ABM}
        - {source: nonlinear_abm_v2, pointer: registered_result_disposition/failure_lag_4/geometry_crossover, equals: CROSSOVER_TRANSFERS_TO_ABM}
    - id: C10_out_of_sample_nonlinear_learning_inside_the_abm
      statement: With field-wide evidence, ABM tree and MLP policies learn interaction structure that generalizes to unsimulated agents.
      evidence:
        - {source: nonlinear_abm_v2, pointer: registered_result_disposition/immediate/field_nonlinear_learning, equals: OUT_OF_SAMPLE_NONLINEAR_LEARNING}
        - {source: nonlinear_abm_v2, pointer: registered_result_disposition/failure_lag_2/field_nonlinear_learning, equals: OUT_OF_SAMPLE_NONLINEAR_LEARNING}
        - {source: nonlinear_abm_v2, pointer: registered_result_disposition/failure_lag_4/field_nonlinear_learning, equals: OUT_OF_SAMPLE_NONLINEAR_LEARNING}
    - id: C11_evidence_scale_gates_useful_learning
      statement: Every feature learner beats the prior with field-wide evidence and loses to it with neighbor evidence.
      evidence:
        - {source: nonlinear_abm_v2, pointer: registered_result_disposition/immediate/evidence_scale, equals: EVIDENCE_SCALE_GATES_USEFUL_LEARNING}
        - {source: nonlinear_abm_v2, pointer: registered_result_disposition/failure_lag_2/evidence_scale, equals: EVIDENCE_SCALE_GATES_USEFUL_LEARNING}
        - {source: nonlinear_abm_v2, pointer: registered_result_disposition/failure_lag_4/evidence_scale, equals: EVIDENCE_SCALE_GATES_USEFUL_LEARNING}
    - id: C12_entry_responds_to_learning_only_with_immediate_failure_visibility
      statement: Learned structure changes who enters only when failure is visible at once; from a two-step delay every field arm saturates.
      evidence:
        - {source: nonlinear_abm_v2, pointer: registered_result_disposition/immediate/entry, equals: ENTRY_CHANNEL_ACTIVE}
        - {source: nonlinear_abm_v2, pointer: registered_result_disposition/failure_lag_2/entry, equals: ENTRY_SATURATED}
        - {source: nonlinear_abm_v2, pointer: registered_result_disposition/failure_lag_4/entry, equals: ENTRY_SATURATED}
    - id: C13_tree_reduces_failed_stock_on_axis_boundaries
      statement: The tree policy lowers active failed stock interaction-specifically in the axis world at every delay.
      evidence:
        - {source: nonlinear_abm_v2, pointer: registered_result_disposition/immediate/exit_passing_family_geometries, contains: tree_batch/axis_interaction_fit}
        - {source: nonlinear_abm_v2, pointer: registered_result_disposition/failure_lag_2/exit_passing_family_geometries, contains: tree_batch/axis_interaction_fit}
        - {source: nonlinear_abm_v2, pointer: registered_result_disposition/failure_lag_4/exit_passing_family_geometries, contains: tree_batch/axis_interaction_fit}
    - id: C14_raw_entry_precision_follows_the_crossover
      statement: Post hoc, the MLP gives the best entrant precision on smooth boundaries and the tree on axis boundaries.
      evidence_type: POST_HOC_DESCRIPTIVE
      evidence:
        - {source: nonlinear_abm_v2, pointer: post_hoc_descriptive/raw_entry_share_mlp_minus_tree_immediate/smooth_interaction_fit/mean, greater_than: 0.0}
        - {source: nonlinear_abm_v2, pointer: post_hoc_descriptive/raw_entry_share_mlp_minus_tree_immediate/axis_interaction_fit/mean, less_than: 0.0}

  rejected:
    - id: R01_neural_policy_is_necessary
      statement: A neural policy is necessary for the Pivot surface.
      reason: Scalar rules reproduce the linear-fit surface, and on interactions the neural family wins only smooth boundaries.
      evidence:
        - {source: adaptive_ladder, pointer: scientific_assessment/neural_necessity_on_current_synthetic_surface, equals: NOT_SUPPORTED}
        - {source: matched_marginal_v3, pointer: registered_result_disposition/neural_specific_advantage, equals: NOT_SUPPORTED_ON_FROZEN_GENERATOR}
        - {source: nonlinear_abm_v2, pointer: scientific_assessment/neural_necessity, equals: NOT_ESTABLISHED}
    - id: R02_v2_neural_specific_advantage
      statement: v2's registered neural-specific advantage.
      reason: The edge was larger on linear worlds and vanished against a tuned tree on axis boundaries.
      evidence:
        - {source: matched_marginal_v2, pointer: registered_result_disposition/neural_specific_advantage, equals: SUPPORTED_ON_FROZEN_GENERATOR_ONLY}
        - {source: matched_marginal_v2, pointer: scientific_assessment/neural_specific_advantage, equals: REGISTERED_PASS_NOT_INTERACTION_SPECIFIC_GENERAL_SMOOTH_FIT_ADVANTAGE_OVER_FROZEN_TREE}
        - {source: matched_marginal_v3, pointer: registered_result_disposition/nonlinear_family_dominance, equals: GENERATOR_DEPENDENT_OR_TIED}
    - id: R03_v2_brier_margin_measures_nonlinearity
      statement: v2's MLP-over-linear Brier margin measures nonlinearity.
      reason: Most of it also appeared on linear worlds, as a baseline fit and calibration gap.
      evidence:
        - {source: matched_marginal_v2, pointer: scientific_assessment/nonlinear_representation_need, equals: SUPPORTED_BY_RANKING_CONTRAST_BUT_REGISTERED_BRIER_MARGIN_MOSTLY_BASELINE_FIT_CONFOUND}
    - id: R04_abm_v1_tree_dominance
      statement: ABM v1's registered tree dominance.
      reason: It scored agents whose own outcomes trained the learner; out of sample the crossover holds.
      evidence:
        - {source: nonlinear_abm_v1, pointer: registered_result_disposition/abm_geometry_crossover, equals: TREE_DOMINATES_IN_ABM}
        - {source: nonlinear_abm_v2, pointer: registered_result_disposition/immediate/geometry_crossover, equals: CROSSOVER_TRANSFERS_TO_ABM}
    - id: R05_abm_v1_learning_survives_local_evidence
      statement: ABM v1's registered survival of nonlinear learning under neighbor evidence.
      reason: Its reference was the degrading linear learner; against the prior every local learner loses.
      evidence:
        - {source: nonlinear_abm_v1, pointer: registered_result_disposition/evidence_scale, equals: NONLINEAR_LEARNING_SURVIVES_LOCAL_EVIDENCE}
        - {source: nonlinear_abm_v2, pointer: registered_result_disposition/immediate/useful_learners_local, equals: []}
    - id: R06_abm_v1_behavior_unchanged
      statement: ABM v1's registered conclusion that behavior does not change.
      reason: The rule pooled visibility regimes; under immediate visibility entry changes.
      evidence:
        - {source: nonlinear_abm_v1, pointer: registered_result_disposition/result, equals: NONLINEAR_LEARNING_CHANGES_BUT_BEHAVIOR_DOES_NOT}
        - {source: nonlinear_abm_v2, pointer: registered_result_disposition/immediate/entry, equals: ENTRY_CHANNEL_ACTIVE}

  open:
    - id: O01_empirical_failure_visibility_delay
      question: How long after entry do failures become publicly visible in real pivots, relative to the entry wave?
      kind: EMPIRICAL
      priority: 1
    - id: O02_empirical_evidence_regime
      question: Do researchers learn from field-wide outcomes or from their own collaborators' outcomes?
      kind: EMPIRICAL
      priority: 2
    - id: O03_empirical_boundary_geometry
      question: Is real pivot success a smooth or an axis-aligned function of researcher attributes?
      kind: EMPIRICAL
      priority: 3
    - id: O04_saturation_boundary_versus_entry_wave_width
      question: Does the saturation boundary depend on delay relative to entry-wave width rather than on absolute delay?
      kind: SYNTHETIC
      priority: 1
      motivation: The ABM entry wave is compressed; see derived_raw_row_facts.
    - id: O05_policy_calibration
      question: Do calibration differences, such as the tree's overconfident errors under log loss, change ABM behavior?
      kind: SYNTHETIC
      priority: 3
      evidence:
        - {source: matched_marginal_v3, pointer: scientific_assessment/tree_edge_on_axis_worlds_under_log_loss, equals: NOT_PRESERVED_TREE_MAKES_OVERCONFIDENT_ERRORS}
    - id: O06_selective_nonavailability_with_nonlinear_policies
      question: Does permanent missing failure evidence interact with nonlinear policies?
      kind: SYNTHETIC
      priority: 3
    - id: O07_cautionary_and_mixed_nonlinear_policies
      question: Do failure-only or mixed learning modes change the nonlinear results?
      kind: SYNTHETIC
      priority: 3

