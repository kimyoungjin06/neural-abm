schema_version: pivot_relative_delay_cost.v1
label: pivot_relative_delay_cost_v1
status: PRECOMMIT_DESIGN_NO_RESULT_INTERPRETATION

purpose:
  primary_goal: >-
    TEST_WHETHER_ENTRY_SATURATION_DEPENDS_ON_FAILURE_DELAY_RELATIVE_TO_ENTRY_WAVE_WIDTH
    AND_MEASURE_THE_COMPUTE_COST_OF_EACH_POLICY_FAMILY
  question: >-
    When entry is spread over more steps, does learned policy precision keep
    changing who enters under longer failure delays, so that one threshold on
    delay relative to entry-wave width separates active from inactive entry
    channels? What does each policy family cost per agent-step?
  answers_open_question: O04_saturation_boundary_versus_entry_wave_width
  consolidation: experiments/configs/pivot_policy_ladder_consolidation_v1.yaml
  motivation: >-
    IN_ALL_1440_ABM_V2_RUNS_ENTRY_INCIDENCE_PEAKED_AT_THE_FIRST_OPEN_STEP_AND_AT_LEAST_53_PERCENT_OF_FINAL_ENTRY_HAPPENED_THERE

