common_environment:
  scenario: hot_field_hype
  state_model: persistence_exit_v1
  learning_mode: imitative
  population_network_randomness: IDENTICAL_BY_REPLICATE_ACROSS_ALL_ARMS_WORLDS_AND_HAZARDS
  transition:
    failed_minimum_active_steps: 2
    failed_continuation_score:
      productive_fit_weight: 0.5
      current_policy_output_weight: 0.5
      exit_below: 0.4
    reentry_after_exit: false

entry_hazard:
  rule: >-
    AN_AGENT_WHOSE_COMMITTED_READINESS_MEETS_THE_THRESHOLD_ENTERS_ONLY_IF_A_UNIFORM_DRAW_IS_BELOW_Q
  draw: SEED_SEQUENCE_OF_BASE_SEED_REPLICATE_HAZARD_COMPONENT_STEP_AND_AGENT
  q_values: [1.0, 0.5, 0.25]
  q_one_nests_predecessor: true
  interpretation: DOMAIN_OWNED_ENTRY_FRICTION_THAT_WIDENS_THE_ENTRY_WAVE

inherited_learning_parameters:
  neighbor_count: 4
  within_stage_probability: 0.6
  learning_rate: 1.5
  prior_anchor: 0.25
  local_alpha: 0.45
  local_noise_scale: 0.02
  social_alpha: 0.40
  peer_similarity_threshold: 0.68
  pivot_threshold: 0.34
  productive_threshold: 0.40

visibility_regimes:
  - id: immediate
    success_delay_steps: 0
    failure_delay_steps: 0
    success_visibility_probability: 1.0
    failure_visibility_probability: 1.0
  - id: failure_lag_1
    success_delay_steps: 0
    failure_delay_steps: 1
    success_visibility_probability: 1.0
    failure_visibility_probability: 1.0
  - id: failure_lag_2
    success_delay_steps: 0
    failure_delay_steps: 2
    success_visibility_probability: 1.0
    failure_visibility_probability: 1.0
  - id: failure_lag_4
    success_delay_steps: 0
    failure_delay_steps: 4
    success_visibility_probability: 1.0
    failure_visibility_probability: 1.0

fit_worlds:
  worlds:
    - id: linear_fit
    - id: smooth_interaction_fit
    - id: axis_interaction_fit
  implementation: V1_APPLY_FIT_WORLD

evidence_regimes:
  - id: neighbor_local
    used_in: BENCHMARK_ONLY
  - id: field_public
    cross_fit_folds: 4
    includes_own_public_outcome: false
    used_in: MAIN_RUN_AND_BENCHMARK

main_run_arms:
  - [fixed_rule, none]
  - [linear_batch, field_public]
  - [tree_batch, field_public]
  - [mlp_batch, field_public]

batch_learners:
  source: EXACT_V2_BATCH_LEARNER_SETTINGS_UNCHANGED
  scalar_batch:
    epochs: 80
    eta: 0.5
    prior_anchor: 0.25
  linear_batch:
    optimizer: ADAM
    epochs: 300
    learning_rate: 0.02
    weight_decay: 0.0001
  mlp_batch:
    hidden_width: 16
    optimizer: ADAM
    epochs: 300
    learning_rate: 0.02
    weight_decay: 0.0001
  tree_batch:
    initial_margin: FROZEN_PRIOR_LOGIT
    rounds: 300
    learning_rate: 0.1
    max_depth: 3
    min_samples_leaf: 5
    leaf_l2: 1.0

probe_cohort:
  base_seed: 20261015
  agent_count: 256
  per_replicate: true

profiles:
  smoke:
    agent_count: 24
    steps: 12
    burn_in_steps: 2
    replicates: 2
    base_seed: 20261014
  development:
    agent_count: 256
    steps: 24
    burn_in_steps: 2
    replicates: 16
    base_seed: 20261014

h3_adapter:
  role: DESCRIPTIVE_SIMULATION_SIDE_TIMING_OBSERVABLES_NOT_A_DECISION
  entry_incidence: NEW_ENTRANTS_PER_STEP
  entry_peak_steps: STEPS_WITH_MAXIMUM_INCIDENCE
  cohort_persistence_horizon_steps: 4
  cohort_persistence: >-
    SHARE_OF_AN_ENTRY_COHORT_NOT_EXITED_FOUR_STEPS_AFTER_ENTRY_FOR_COHORTS_WITH_A_FULL_HORIZON
  decline_onset: >-
    FIRST_LATER_COHORT_WHOSE_PERSISTENCE_IS_AT_LEAST_0.05_BELOW_THE_FIRST_COHORT
  model_h3_gap: EARLIEST_ENTRY_PEAK_STEP_MINUS_DECLINE_ONSET_STEP
  limitation: >-
    A_FULL_H3_COMPARISON_NEEDS_AN_INTERIOR_ENTRY_PEAK_WHICH_REQUIRES_AN_ATTENTION_SURGE_CLOCK_NOT_IN_THIS_MODEL

relative_delay:
  entry_wave_width: >-
    FIXED_RULE_STEPS_FROM_THE_FIRST_OPEN_STEP_TO_NINETY_PERCENT_OF_FINAL_ENTRY_INCLUSIVE
  first_public_failure_lag: FAILURE_DELAY_PLUS_ONE
  relative_delay: FIRST_PUBLIC_FAILURE_LAG_DIVIDED_BY_MEAN_FIXED_RULE_ENTRY_WAVE_WIDTH

decision_contract:
  improvement_rule: >-
    MEAN_PAIRED_IMPROVEMENT_AT_LEAST_THRESHOLD_AND_STRICTLY_POSITIVE_IN_AT_LEAST_REQUIRED_REPLICATES
  difference_in_differences_rule: >-
    INTERACTION_FIT_WORLD_GAP_MINUS_LINEAR_FIT_WORLD_GAP_SAME_HAZARD_VISIBILITY_AND_REPLICATE
  improved_replicates_at_least: 12
  nesting_checks:
    required: true
    conditions:
      - AT_Q_ONE_FIXED_RULE_EQUALS_THE_PERSISTENCE_FROZEN_ARM_IN_THE_LINEAR_WORLD
      - AT_Q_ONE_THE_MLP_FIELD_ARM_EQUALS_THE_V2_ARM_IN_THE_LINEAR_WORLD_UNDER_IMMEDIATE_VISIBILITY
    failure_action: INVALID_IMPLEMENTATION_STOP
  entry_channel:
    metric: PRODUCTIVE_SHARE_OF_ENTRANTS
    comparison: TREE_OR_MLP_OVER_LINEAR_BATCH
    statistic: DIFFERENCE_IN_DIFFERENCES_AGAINST_LINEAR_FIT_WORLD
    worlds: [smooth_interaction_fit, axis_interaction_fit]
    improvement_at_least: 0.02
    cell: EACH_HAZARD_AND_VISIBILITY
    saturation: >-
      LINEAR_TREE_AND_MLP_FIELD_ARMS_EACH_REACH_AT_LEAST_0.98_FINAL_ENTRY_IN_AT_LEAST_12_REPLICATES_OF_EVERY_WORLD
    cell_dispositions:
      - ENTRY_CHANNEL_ACTIVE
      - ENTRY_SATURATED
      - ENTRY_CHANNEL_ABSENT
    precedence: ACTIVE_THEN_SATURATED_THEN_ABSENT
  relative_delay_test:
    identical_pattern: THE_SET_OF_ACTIVE_DELAYS_IS_THE_SAME_FOR_EVERY_Q
    separable: >-
      MAXIMUM_RELATIVE_DELAY_OF_ACTIVE_CELLS_IS_BELOW_THE_MINIMUM_OF_INACTIVE_CELLS_WITH_BOTH_PRESENT
    dispositions:
      RELATIVE_DELAY_SUPPORTED: NOT_IDENTICAL_AND_SEPARABLE
      ABSOLUTE_DELAY_SUPPORTED: IDENTICAL_AND_NOT_SEPARABLE
      NOT_DISCRIMINATED: IDENTICAL_AND_SEPARABLE_OR_ALL_CELLS_ONE_STATUS
      NEITHER_SIMPLE_RULE: NOT_IDENTICAL_AND_NOT_SEPARABLE
  model_selection: FORBIDDEN

cost_ledger:
  command: benchmark
  reproducibility: NOT_BYTE_REPRODUCIBLE_TIMING_REPORTED_SEPARATELY_FROM_THE_SCORECARD
  clock: PROCESS_CPU_TIME_SINGLE_THREAD
  task: DEVELOPMENT_SIZE_REPLICATE_0_IMMEDIATE_AXIS_WORLD_Q_ONE
  repeats: 3
  statistic: MEDIAN_CPU_SECONDS_PER_AGENT_STEP
  arms:
    - [fixed_rule, none]
    - [online_logistic, neighbor_local]
    - [scalar_batch, neighbor_local]
    - [linear_batch, neighbor_local]
    - [tree_batch, neighbor_local]
    - [mlp_batch, neighbor_local]
    - [scalar_batch, field_public]
    - [linear_batch, field_public]
    - [tree_batch, field_public]
    - [mlp_batch, field_public]
  llm_reference: >-
    COUNTS_OF_POLICY_QUERIES_AND_PRE_ENTRY_DECISIONS_AN_LLM_AGENT_WOULD_NEED_NO_PRICE_OR_LATENCY_ASSUMED
  records_machine_load: true

precommit:
  run_requires_full_commit_sha: true
  run_requires_clean_bound_paths: true
  precommit_paths:
    - docs/research/pivot-relative-delay-cost-v1.md
    - docs/package-release-boundary.md
    - experiments/configs/pivot_relative_delay_cost_v1.yaml
    - scripts/prototype_pivot_relative_delay_cost_v1.py
    - scripts/inspect_release_artifacts.py
    - tests/test_pivot_relative_delay_cost_v1.py
    - tests/test_release_artifact_inspection.py
  interpretation_before_frozen_execution: FORBIDDEN

outputs:
  - runs.jsonl
  - scorecard.json
  - scorecard.md
  - receipt.json

boundaries:
  repository_only: true
  generic_nabm_api_changed: false
  empirical_rows_read: 0
  empirical_fit: NOT_RUN
  model_selected: "NO"
  neural_necessity: NOT_ESTABLISHED
  scientific_effect: NOT_ESTABLISHED
  package_promotion: NOT_AUTHORIZED
