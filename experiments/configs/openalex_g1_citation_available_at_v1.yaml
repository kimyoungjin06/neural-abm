  external_target_is_orphan: false
  external_target_publication_date_available: false
  source_bibliographic_date_may_be_accounted: true
  external_target_allowed_in_primary_chronology_safe_graph: false
  external_target_allowed_in_fixed_horizon_outcome: false
  missing_external_citing_works_measurable_from_this_snapshot: false
  reconstructed_inbound_counts_are_total_citations: false

maturation_contract:
