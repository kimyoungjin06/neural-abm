claim_boundary: >-
  This temporal-v3-parent-only IMPLEMENTED_SYNTHETICALLY_PRODUCTION_NOT_RUN
  contract specifies a future
  exact accounting and chronology audit of directed current-snapshot OpenAlex
  referenced-work pairs. It defines
  citing-work publication date as a BIBLIOGRAPHIC_EVENT_TIME_CONVENTION, not an
  observed OpenAlex indexing timestamp. A future full component pass may
  establish current-byte source accounting, exact directed-pair deduplication,
  frozen chronology buckets, open-world target accounting, and a
  retrospectively publication-dated citation proxy. It cannot establish when
  OpenAlex first observed an edge, whether an edge was visible to a researcher
  by a historical cutoff, a historical OpenAlex graph, total citation counts,
  fixed-horizon maturation before a separate G0 freeze, author or candidate
  validity, G-1, G0, empirical G1, an NABM effect, or any scientific effect.
  The executable is restricted to closed synthetic fixtures and direct temporal
  reconstruction. Canonical-spine reuse is
  BLOCKED_CANONICAL_PRODUCTION_RECEIPT_NOT_AVAILABLE; the canonical synthetic
  contract is not a production parent and no fake production receipt hash is
  defined. No production run or result exists under this design artifact.
