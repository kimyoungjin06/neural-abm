    - allowed_work_types
    - same_day_inclusion
    - leap_day_policy
    - negative_lag_sensitivity
    - field_normalization
    - missing_target_policy
  calendar_anniversary_rule: same_month_and_day_h_years_later
  february_29_rule: clip_to_february_28_in_non_leap_target_year
  proposed_interval: closed_target_publication_date_through_maturity_date
  target_is_temporally_mature_in_snapshot_if: maturity_date_lte_snapshot_date
  target_is_temporally_mature_for_decision_year_t_if: maturity_date_lte_december_31_of_t_minus_1
  historical_edge_observation_available_by_decision_year_t: UNIDENTIFIABLE_FROM_CURRENT_SNAPSHOT
  temporal_maturity_alone_establishes_historical_availability: false
