  primary_negative_lag_tolerance_days: 0
  primary_eligibility_predicate_after_common_prerequisites: signed_lag_days >= 0
  supplemental_tolerance_days:
    - 30
    - 365
  supplemental_eligibility_predicate_template: signed_lag_days >= -tolerance_days
  annual_only_chronology_sensitivity: true
  annual_only_eligibility_predicate_after_common_prerequisites: cited_publication_year <= citing_publication_year
  common_prerequisites:
    - exact_distinct_pair
    - not_self_loop
    - source_temporal_disposition_in_{2,3}
    - target_in_snapshot
    - target_temporal_disposition_in_{2,3}
  sensitivity_may_replace_primary: false
  negative_lag_is_automatically_proven_impossible_citation: false

open_world_policy:
