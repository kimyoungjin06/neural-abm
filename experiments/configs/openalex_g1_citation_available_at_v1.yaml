  g0_same_day_choice_applies_to_future_label_policy_only: true
  outcome_count_unit: distinct_chronology_safe_internal_citing_work
  allowed_future_label_name: current_snapshot_internal_citing_work_fixed_horizon_count
  total_citation_claim_allowed: false
  historically_observed_citation_count_claim_allowed: false

t_minus_1_parent_contract:
