study_v2:
  contract: experiments/configs/info_spread_policy_ladder_study_v2.yaml
  record: experiments/evidence/results/info_spread_policy_ladder_study_v2_d4_20261019.summary.json
  cells: THE_DEVELOPMENT_CELLS_JSONL_WHOSE_SHA256_THE_RECORD_NAMES
  arms_read: [F0, F1, T0_1, T0_4, L0]
  parity: L0 RECOMPUTED AT REPLICATE 0 OF EVERY CELL MUST EQUAL STUDY V2'S VALUE EXACTLY; ANY FAILURE BLOCKS READING
donors:
  count: 4
  world_seed_offset: 9000
  world_seed_rule: WORLD_SEED_OFFSET + 4 * CELL + DONOR, DISJOINT FROM THE 5000, 6000, AND 7000 RANGES OF EARLIER STUDIES
  learner_cell_offset: 1000
  learner_seed_rule: STUDY V2'S LEARNER SEEDS WITH CELL = LEARNER_CELL_OFFSET + 4 * CELL + DONOR
  stream_replicate: 1000
  same_as_the_cell: REGIME, LEARNER FAMILY, VERACITY RELATION, WORLD SIZES, AND PROFILE
  different_from_the_cell: NETWORK, THRESHOLDS, COSTS (REGIME B), AND ITEM STREAM
  per_agent_parts: A DONOR'S PER-AGENT RESIDUALS APPLY BY AGENT INDEX, SO IN ANOTHER WORLD THEY FALL ON OTHER AGENTS
arms:
- T0x_1
- T0x_4
arm_meaning:
  T0x_1: THE POLICY TRAJECTORY OF THE FIRST DONOR, REPLAYED AS A TABLE
  T0x_4: THE AVERAGE OF THE FOUR DONORS' TRAJECTORIES
comparisons:
  transfer_closed_loop: [L0, T0x_1]
  transfer_best_table: [L0, T0x_4]
descriptive:
  transfer_cost: [T0_4, T0x_4]
  transfer_cost_single: [T0_1, T0x_1]
measures:
  primary: unverified_share_precision (study v2's)
  recorded: share_precision
seeds:
  rule_tag: 10
rule:
  comparison: paired difference in the primary measure
  minimum_effect: 0.01
  bootstrap_resamples: 2000
  interval: 0.95
  resampling: cells, with replacement
  material: interval excludes zero and |mean cell delta| >= minimum_effect
dispositions:
  primary_comparison: transfer_best_table
  per_regime: ADAPTIVE_BEATS_TRANSFERRED_TABLE if POSITIVE in at least 4 of the 6 study groups, TRANSFERRED_TABLE_SUFFICES
    if POSITIVE in at most 1 of 6, otherwise MIXED
  adaptive_at_least: 4
  table_suffices_at_most: 1
  expected_before_the_run: 'Regime A: TRANSFERRED_TABLE_SUFFICES (one pooled policy over item features should transfer);
    Regime B: ADAPTIVE_BEATS_TRANSFERRED_TABLE (per-agent residuals land on other agents). Stated so that it can be
    rejected, not required.'
  null_check: any comparison material, in either direction, in any null group is DESIGN_DEFECT_IN_NULL_WORLD and
    blocks reading the study groups
profiles: STUDY_V2_PROFILES
precommit:
  precommit_paths:
  - docs/research/info-spread-policy-ladder-transfer-v1.md
  - experiments/configs/info_spread_policy_ladder_transfer_v1.yaml
  - scripts/run_info_spread_policy_ladder_transfer_v1.py
  - tests/test_info_spread_policy_ladder_transfer_v1.py
runs:
  pilot: --pilot-cells 2 under full load, for the time estimate only
  development: --profile development --precommit-sha <HEAD> --v2-cells <study v2 development cells.jsonl> on GPU-Server,
    CUDA_VISIBLE_DEVICES=2, 24 workers
  reproduction: the same command into a second output directory; cells.jsonl and summary.json must be byte identical
outputs:
- cells.jsonl
- summary.json
- progress.jsonl
- receipt.json
boundaries:
  empirical_rows_read: 0
  llm_calls: 0
  generic_nabm_api_changed: false
  scientific_effect: NOT_ESTABLISHED
  synthetic_only: true
