purpose: 'Study v2 found that a table written before the run suffices in stationary worlds, with donors that ran in
  the same world as the evaluation. This study asks whether a table still suffices when its donors ran in other worlds
  from the same generator: the same regime and veracity relation, another network, other thresholds, and other costs.'
