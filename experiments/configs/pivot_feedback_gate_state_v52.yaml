claim_boundary: >-
  The G-1A binding-reconciliation contract is independently valid and
  preserves the exact receipt semantics without aliasing or relabeling legacy
  G-1. This gate authorizes only a versioned G0 v2 binding-only successor that
  retains legacy G-1 as pending lineage and adds the exact bounded G-1A
  prerequisite binding. That successor may remove only the absent-G-1-receipt
  blocker. It must retain the pending holdout receipt, seventeen unresolved
  values, fifteen not-freeze-ready sections, and pass_g0=false. This gate does
  not authorize another design change, value or section completion, holdout
  sealing or opening, confirmatory access, G0 passage, model fitting, G4,
  causality, or a scientific effect.
