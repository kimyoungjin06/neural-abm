    aliases_merge_keys_and_custom_tags_rejected: true
  identifier_conversion_boundary:
    maximum_decimal_suffix_digits_before_int_conversion: 20
    applies_to: [work_id, author_id]
    uint64_range_still_required_after_length_check: true
  controlled_failure_contract:
    malformed_or_over_limit_input_exit_code: 2
    stdout_on_failure: empty
    one_redacted_stderr_line: true
    python_traceback_allowed: false
  path_and_size_boundary:
    regular_file_required: true
    symlink_rejected: true
    link_count_must_equal: 1
    size_checked_before_payload_parse: true
    production_root_path_components_rejected_before_payload_parse: true
    best_effort_intermediate_component_race_boundary: LOCAL_TRUSTED_FILESYSTEM_ONLY_NOT_OPENAT_TRAVERSAL
  exact_top_level_keyset:
    - schema_version
    - surface_kind
    - production_input_access_allowed
    - root_id
    - snapshot_date
    - synthetic_parents
    - main_rows
    - spine_rows
    - authorship_rows
  root_id_prefix: synthetic-
  production_root_id_forbidden_substring: openalex_works_20260330_repairreplay_20260410_190630
  main_row:
    exact_keyset: [id, authors_count, primary_topic__field__id]
    exact_types:
      id: string
      authors_count: non_boolean_integer_0_through_4294967295
      primary_topic__field__id: null_or_string
    work_id_grammar: '^https://openalex[.]org/W(?:-1|0|[1-9][0-9]*)$'
    exact_w_minus_1_quarantined_before_numeric_parse: true
    retained_work_numeric_id_range: uint64
    field_id_grammar: '^https://openalex[.]org/fields/(?:[1-9]|1[0-9]|2[0-6])$'
  spine_row:
    exact_keyset: [work_id_numeric, publication_day, publication_year, temporal_disposition]
    exact_types:
      work_id_numeric: non_boolean_uint64
      publication_day: null_or_non_boolean_int32
      publication_year: null_or_non_boolean_integer_1_through_9999
      temporal_disposition: non_boolean_integer_0_through_5
    publication_day_epoch: "1970-01-01"
    code_0_requires_day_and_year_null: true
    codes_1_through_5_require_day_and_year_non_null: true
    non_null_year_must_equal_year_derived_from_publication_day: true
    ordered_predicates:
      - code_1_if_day_before_1900_01_01
      - code_2_if_day_on_or_after_1900_01_01_and_derived_year_before_2026
      - code_3_if_derived_year_2026_and_day_on_or_before_2026_03_30
      - code_4_if_derived_year_2026_and_day_after_2026_03_30
      - code_5_if_derived_year_after_2026
    numeric_id_set_must_equal_retained_main_numeric_id_set: true
  authorship_row:
    exact_keyset:
      - id
      - authorships__author__id
      - authorships__author__orcid
      - authorships__raw_author_name
      - authorships__author__display_name
      - authorships__author_position
    exact_types:
      id: string
      authorships__author__id: null_or_string
      authorships__author__orcid: null_or_string
      authorships__raw_author_name: null_or_string
      authorships__author__display_name: null_or_string
      authorships__author_position: null_or_string
    work_id_grammar: '^https://openalex[.]org/W(?:-1|0|[1-9][0-9]*)$'
    author_id_grammar: '^https://openalex[.]org/A(?:0|[1-9][0-9]*)$'
    null_author_id_is_raw_slot_not_history: true
    malformed_non_null_author_id_rejected: true
  closure:
    every_retained_authorship_row_matches_one_retained_main_work: true
    declared_authors_count_equals_observed_raw_authorship_slots_per_work: true
    duplicate_author_work_key: [author_numeric_id, work_numeric_id]
    duplicate_pair_counts_once: true
