schema_version: pivot_llm_prior_pilot.v1
label: pivot_llm_prior_pilot_v1
status: PRECOMMIT_DESIGN_NO_RESULT_INTERPRETATION

purpose:
  primary_goal: >-
    TEST_WHETHER_A_LOCAL_LLM_CAN_FILL_THE_NABM_PRIOR_SLOT_ONCE_AND_WHAT_THAT_PRIOR_DOES_FOR_EVIDENCE_STARVED_AND_POOLED_LEARNING
  question: >-
    Elicited once from a local LLM and distilled into the existing logistic
    prior slot, is an LLM prior a better starting policy than the hand-set
    rule? Does it rescue neighbor-scale learning? Does pooled evidence wash it
    out? What does one elicitation cost, against an LLM queried at every agent
    step?
  positioning: >-
    NABM_BETWEEN_RULE_BASED_ABM_AND_LLM_AGENTS_LLM_KNOWLEDGE_ENTERS_ONCE_AS_A_PRIOR_NABM_LEARNS_AND_SCALES
  backend_decision: LOCAL_QWEN_BY_USER_INSTRUCTION_NO_PAID_API

