claims:
  confirmed:
    - id: C15_saturation_boundary_moves_with_entry_wave_width
      statement: >-
        Spreading entry over more steps keeps learned precision acting on entry
        under longer failure delays. The active delays grow from {0} at q = 1
        to {0, 1} at q = 0.5 and {0, 1, 2, 4} at q = 0.25.
      evidence:
        - {source: relative_delay_cost, pointer: scientific_assessment/saturation_boundary_shifts_with_entry_wave_width, equals: true}
        - {source: relative_delay_cost, pointer: registered_relative_delay_test/active_delays_by_q/1.0, equals: [0]}
        - {source: relative_delay_cost, pointer: registered_relative_delay_test/active_delays_by_q/0.5, equals: [0, 1]}
        - {source: relative_delay_cost, pointer: registered_relative_delay_test/active_delays_by_q/0.25, equals: [0, 1, 2, 4]}
    - id: C16_pooled_learning_is_cheap_and_per_agent_learning_is_not
      statement: >-
        Pooled linear, tree, and MLP policies cost 1.9 to 6.7 times the
        rule-based ABM per agent-step. The same families learning per agent
        from neighbor outcomes cost 57 to 65 times, and they are also the
        learners that do worse than the prior.
      evidence:
        - {source: relative_delay_cost, pointer: cost_ledger/records/0/arm_id, equals: fixed_rule}
        - {source: relative_delay_cost, pointer: cost_ledger/records/7/evidence_regime, equals: field_public}
        - {source: relative_delay_cost, pointer: cost_ledger/records/7/cost_relative_to_fixed_rule, greater_than: 1.8}
        - {source: relative_delay_cost, pointer: cost_ledger/records/8/cost_relative_to_fixed_rule, less_than: 6.7}
        - {source: relative_delay_cost, pointer: cost_ledger/records/3/evidence_regime, equals: neighbor_local}
        - {source: relative_delay_cost, pointer: cost_ledger/records/3/cost_relative_to_fixed_rule, greater_than: 56.0}
        - {source: relative_delay_cost, pointer: cost_ledger/records/4/cost_relative_to_fixed_rule, less_than: 65.0}
        - {source: relative_delay_cost, pointer: framework_assessment/cost_and_usefulness_align, equals: THE_EXPENSIVE_PER_AGENT_LOCAL_LEARNERS_ARE_ALSO_THE_ONES_WORSE_THAN_THE_PRIOR}
    - id: C17_uncalibrated_elicited_prior_self_seals
      statement: >-
        An LLM prior elicited once and used on its raw scale is so pessimistic
        that no agent enters, so no evidence is produced to correct it. The hand
        rule wins every registered decision.
      evidence:
        - {source: llm_prior_v1, pointer: scientific_assessment/registered_outcome, equals: HAND_PRIOR_BETTER_ON_EVERY_DECISION_IN_EVERY_WORLD}
        - {source: llm_prior_v1, pointer: scientific_assessment/mechanism, equals: SELF_SEALING_PESSIMISTIC_PRIOR_NO_AGENT_ENTERS_SO_NO_OUTCOME_EVIDENCE_IS_EVER_PRODUCED}
        - {source: llm_prior_v1, pointer: post_hoc_descriptive/llm_prior_max_entry_rate, equals: 0.0}
    - id: C18_the_llm_ranks_like_the_hand_rule
      statement: >-
        The elicited prior ranks agents about as well as the hand rule, and as a
        static forecast every calibrated variant beats a no-knowledge prior.
      evidence:
        - {source: llm_prior_v1, pointer: scientific_assessment/llm_ranking_skill, equals: COMPARABLE_TO_OR_SLIGHTLY_BETTER_THAN_THE_HAND_RULE_DISTILLED_AUC_0_707_VS_0_647_IN_THE_LINEAR_WORLD}
        - {source: llm_prior_v2, pointer: scientific_assessment/llm_prior_information, equals: ALL_LLM_VARIANTS_BEAT_THE_FLAT_PRIOR_AS_STATIC_FORECASTS_COMPARABLE_TO_THE_HAND_RULE_IN_THE_LINEAR_WORLD}
    - id: C19_aggregate_calibration_removes_self_sealing
      statement: >-
        Shifting the elicited prior's intercept to one stated base rate, with
        no outcome labels, makes it usable. Only the uncalibrated prior seals.
      evidence:
        - {source: llm_prior_v2, pointer: scientific_assessment/calibration_removes_self_sealing, equals: true}
        - {source: llm_prior_v2, pointer: registered_result_disposition/self_sealing_priors, equals: [llm_uncalibrated/axis_interaction_fit, llm_uncalibrated/linear_fit, llm_uncalibrated/smooth_interaction_fit]}
    - id: C20_calibrated_llm_prior_selects_better_entrants
      statement: >-
        The calibrated prior picks more productive entrants than the hand rule
        in every world, and in all nine world-by-field-arm cells of v3.
      evidence:
        - {source: llm_prior_v2, pointer: registered_result_disposition/by_variant/llm_base_rate/linear_fit/entry_precision, equals: VARIANT_BETTER}
        - {source: llm_prior_v2, pointer: registered_result_disposition/by_variant/llm_base_rate/smooth_interaction_fit/entry_precision, equals: VARIANT_BETTER}
        - {source: llm_prior_v2, pointer: registered_result_disposition/by_variant/llm_base_rate/axis_interaction_fit/entry_precision, equals: VARIANT_BETTER}
        - {source: llm_prior_v3, pointer: registered_decisions/llm_selective/cells/linear_fit~1linear_batch/precision_versus_hand/pass, equals: true}
        - {source: llm_prior_v3, pointer: registered_decisions/llm_selective/cells/axis_interaction_fit~1linear_batch/precision_versus_hand/pass, equals: true}
    - id: C21_the_prior_sets_the_exploration_regime
      statement: >-
        A selective prior picks better entrants but leaves pooled learners less
        evidence; a permissive prior produces the most evidence and the best
        pooled nonlinear learning. Without exploration, the calibrated prior
        dominates the hand rule in only 3 of 9 cells.
      evidence:
        - {source: llm_prior_v2, pointer: scientific_assessment/mechanism, equals: EXPLORATION_EXPLOITATION_TRADEOFF_SELECTIVE_PRIORS_PICK_BETTER_ENTRANTS_BUT_GENERATE_LESS_EVIDENCE_FOR_POOLED_LEARNING}
        - {source: llm_prior_v3, pointer: registered_result_disposition/llm_selective/summary, equals: DOMINATES_IN_MINORITY}
    - id: C22_an_exploration_floor_separates_selection_from_exploration
      statement: >-
        With a prior-independent exploration floor, the calibrated prior beats
        the hand rule on entrant precision while keeping pooled learning within
        the registered margin: in 7 of 9 cells at a 20% share and 5 of 9 at
        10%. At 40% the precision gain is gone.
      evidence:
        - {source: llm_prior_v3, pointer: scientific_assessment/registered_outcome, equals: HYBRID_20_DOMINATES_HAND_IN_7_OF_9_CELLS_HYBRID_10_IN_5_HYBRID_40_NOWHERE}
        - {source: llm_prior_v3, pointer: registered_result_disposition/hybrid_20/summary, equals: DOMINATES_IN_MAJORITY}
        - {source: llm_prior_v3, pointer: registered_result_disposition/hybrid_10/summary, equals: DOMINATES_IN_MAJORITY}
        - {source: llm_prior_v3, pointer: registered_result_disposition/hybrid_40/summary, equals: DOMINATES_NOWHERE}
        - {source: llm_prior_v3, pointer: execution/new_llm_calls, equals: 0}
    - id: C23_the_exploratory_share_traces_a_frontier
      statement: >-
        Post hoc, raising the exploratory share lowers entrant precision and
        raises evidence in every cell, and improves pooled learning in seven.
      evidence_type: POST_HOC_DESCRIPTIVE
      evidence:
        - {source: llm_prior_v3, pointer: post_hoc_descriptive/cells_with_precision_falling_and_evidence_rising, equals: 9}
        - {source: llm_prior_v3, pointer: post_hoc_descriptive/cells_with_probe_brier_falling, equals: 7}
    - id: C24_escaping_the_hand_prior_explains_most_local_rescue
      statement: >-
        Post hoc, the hand pressure rule is a worse starting point for
        neighbor-scale learning than no prior. Most of the LLM variants'
        local-learning gain over it comes from escaping it; only the verbalized
        readout beats the flat prior.
      evidence_type: POST_HOC_DESCRIPTIVE
      evidence:
        - {source: llm_prior_v2, pointer: scientific_assessment/local_rescue_source, equals: MOSTLY_ESCAPING_THE_HAND_PRESSURE_PRIOR_ONLY_THE_VERBALIZED_READOUT_BEATS_THE_FLAT_PRIOR}
    - id: C25_a_once_elicited_prior_costs_minutes_not_hours
      statement: >-
        Eliciting the prior took under 10 GPU minutes and 3,104 LLM queries.
        Querying the LLM at every agent-step of the same design would take an
        estimated 38 to 125 GPU hours at least. Its successors made no LLM
        calls.
      evidence:
        - {source: llm_prior_v1, pointer: framework_assessment/cost_position_measured, equals: ONE_TIME_ELICITATION_UNDER_10_GPU_MINUTES_VERSUS_AN_ESTIMATED_38_TO_125_GPU_HOURS_TO_QUERY_THE_LLM_AT_EVERY_AGENT_STEP_OF_PHASE_B}
        - {source: llm_prior_v1, pointer: cost_ledger/llm_queries_used_by_the_hybrid, equals: 3104}
        - {source: llm_prior_v1, pointer: cost_ledger/llm_agent_equivalent_gpu_hours_lower_bound/batched_32, greater_than: 38.0}
        - {source: llm_prior_v2, pointer: execution/new_llm_calls, equals: 0}
        - {source: llm_prior_v3, pointer: execution/new_llm_calls, equals: 0}

  rejected:
    - id: R07_fixed_rule_normalized_relative_delay_threshold
      statement: >-
        A single threshold on failure delay relative to the fixed rule's
        entry-wave width separates active from saturated entry cells.
      reason: >-
        The fixed rule has a slow entry tail while learning arms rush in, so it
        is the wrong normalizer; q = 0.25 with a four-step delay stays active
        above two inactive cells.
      evidence:
        - {source: relative_delay_cost, pointer: registered_relative_delay_test/disposition, equals: NEITHER_SIMPLE_RULE}
        - {source: relative_delay_cost, pointer: registered_relative_delay_test/separable_by_relative_delay, equals: false}
        - {source: relative_delay_cost, pointer: scientific_assessment/fixed_rule_normalization_separates_cells, equals: false}

  open:
    - id: O08_post_failure_entry_share_as_the_t01_discriminant
      question: >-
        Registered in advance, does the share of entry that happens after the
        first public failure separate active from saturated entry cells, under
        an attention-surge clock that produces interior entry peaks?
      kind: SYNTHETIC
      priority: 1
      motivation: Post hoc it separates all twelve N01 cells, by a thin margin.
      evidence:
        - {source: relative_delay_cost, pointer: post_hoc_descriptive/post_failure_entry_share_separation/min_active, greater_than: 0.155}
        - {source: relative_delay_cost, pointer: post_hoc_descriptive/post_failure_entry_share_separation/max_inactive, less_than: 0.148}
        - {source: relative_delay_cost, pointer: framework_assessment/h3_adapter_status, equals: INTERIOR_PEAKS_IN_ABOUT_HALF_OF_RUNS_ONLY_WITH_ENTRY_FRICTION_A_SURGE_CLOCK_REMAINS_NEEDED_FOR_A_FULL_COMPARISON}
    - id: O09_llm_agent_reference
      question: >-
        On a reduced design, how do the NABM hybrid's behavior and cost compare
        with a local LLM queried at every agent-step?
      kind: SYNTHETIC
      priority: 2
      motivation: The LLM-agent end of the positioning is estimated from query counts, not measured.
    - id: O10_llm_knowledge_of_real_pivots
      question: Does the elicited prior carry knowledge of real pivot success, beyond the designer's synthetic worlds?
      kind: EMPIRICAL
      priority: 2
      evidence:
        - {source: llm_prior_v3, pointer: scientific_assessment/llm_knowledge_of_real_pivots, equals: NOT_ESTABLISHED}
    - id: O11_exploration_floor_under_delayed_visibility
      question: Does the exploration frontier hold when failure visibility is delayed, where entry saturates?
      kind: SYNTHETIC
      priority: 3
      motivation: v3 ran under immediate visibility only.
    - id: O12_linear_learner_depends_on_entrant_composition
      question: >-
        Why is the linear field learner in the linear world never non-inferior
        to the hand rule, even under the flat prior with the most evidence?
      kind: SYNTHETIC
      priority: 3
      evidence:
        - {source: llm_prior_v3, pointer: post_hoc_descriptive/linear_learner_in_linear_world_note, equals: NO_CONDITION_IS_NONINFERIOR_TO_HAND_INCLUDING_FLAT_WITH_THE_MOST_EVIDENCE}

