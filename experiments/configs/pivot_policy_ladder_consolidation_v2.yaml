positioning:
  statement: >-
    NABM sits between rule-based ABMs and LLM-agent simulations. Agents carry
    small learned policies that take a hand rule or an elicited LLM judgment as
    their prior and learn from pooled outcome records. That makes them heavier
    than a fixed rule and far lighter than querying an LLM at every decision.
  tiers:
    - id: RULE_BASED_ABM
      policy: FIXED_HAND_WRITTEN_RULE
      measured_cost_ms_per_agent_step: 0.149
      evidence:
        - {source: relative_delay_cost, pointer: cost_ledger/records/0/median_cpu_ms_per_agent_step, less_than: 0.15}
        - {source: adaptive_ladder, pointer: registered_result_disposition/FIXED_RULE_REMAINS_SUFFICIENT_FOR_THE_REGISTERED_SURFACE, equals: NOT_OBSERVED_FIXED_RULE_IS_VISIBILITY_INVARIANT}
    - id: NABM_POOLED_LEARNED_POLICY
      policy: LEARNED_POLICY_WITH_THE_RULE_AS_PRIOR_AND_POOLED_EVIDENCE
      measured_cost_relative_to_rule: [1.9, 6.7]
      evidence:
        - {source: nonlinear_abm_v2, pointer: registered_result_disposition/immediate/field_nonlinear_learning, equals: OUT_OF_SAMPLE_NONLINEAR_LEARNING}
        - {source: relative_delay_cost, pointer: validation/nesting_checks, equals: PASS_EXACT}
    - id: NABM_PER_AGENT_LOCAL_LEARNER
      policy: SEPARATE_SMALL_LEARNER_PER_AGENT_ON_NEIGHBOR_EVIDENCE
      measured_cost_relative_to_rule: [56.6, 64.6]
      verdict: NOT_THE_DESIGN_EXPENSIVE_AND_WORSE_THAN_THE_PRIOR
      evidence:
        - {source: nonlinear_abm_v2, pointer: registered_result_disposition/immediate/useful_learners_local, equals: []}
    - id: NABM_WITH_ONCE_ELICITED_LLM_PRIOR
      policy: CALIBRATED_LLM_PRIOR_PLUS_EXPLORATION_FLOOR_PLUS_POOLED_LEARNING
      measured_one_time_cost: UNDER_10_GPU_MINUTES_3104_QUERIES
      evidence:
        - {source: llm_prior_v3, pointer: registered_result_disposition/hybrid_20/summary, equals: DOMINATES_IN_MAJORITY}
        - {source: llm_prior_v3, pointer: validation/nesting_checks, equals: PASS_EXACT}
    - id: LLM_AGENT_SIMULATION
      policy: LLM_QUERIED_AT_EVERY_AGENT_STEP
      estimated_cost: ONE_QUERY_PER_AGENT_STEP_14_2_MILLION_FOR_THE_N01_DESIGN_38_TO_125_GPU_HOURS_AT_LEAST_FOR_THE_LLM_PILOT_DESIGN
      behavior: NOT_MEASURED_SEE_O09
      evidence:
        - {source: relative_delay_cost, pointer: llm_reference_counts/policy_queries, equals: 14155776}
  what_the_ladder_implies:
    - NABM_STRICTLY_NESTS_THE_RULE_ABM_FIXED_RULE_ARMS_EXACTLY_REPRODUCE_THEIR_PREDECESSORS
    - THE_VALUE_COMES_FROM_LEARNED_POLICIES_NOT_SPECIFICALLY_NEURAL_ONES_THE_FAMILY_DEPENDS_ON_BOUNDARY_GEOMETRY
    - SMALL_LEARNED_AGENTS_ARE_EVIDENCE_STARVED_THE_WORKING_DESIGN_IS_RULE_AS_PRIOR_PLUS_POOLED_EVIDENCE
    - LLM_KNOWLEDGE_ENTERS_BEST_ONCE_THROUGH_THE_PRIOR_SLOT_AFTER_AGGREGATE_CALIBRATION_WITH_EXPLORATION_KEPT_SEPARATE
    - EVERY_REGISTERED_RUN_IS_BYTE_REPRODUCIBLE_WHICH_PAIRED_DESIGNS_OF_THOUSANDS_OF_RUNS_NEED
