purpose: >-
  Extend the v1 ledger with the relative-delay and cost study (N01) and the
  three local-LLM prior pilots, and state what the whole ladder implies for
  NABM's position between rule-based ABMs and LLM-agent simulations. v1 stays
  the record for the ladder through nonlinear policy ABM v2; this ledger adds
  to it and updates the status of v1 items it answers.

