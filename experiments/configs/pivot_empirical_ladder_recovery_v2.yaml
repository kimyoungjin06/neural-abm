purpose: 'v1 passed identification but left one limit: entrants drawn from the start toward the episode''s eventual success
  relation, without learning, also won 8 of 8. Learning can act only after evidence is visible; anticipation acts from the
  first quarter. v2 adds an anticipatory competitor, B7, that applies the episode''s eventual success relation from the first
  quarter, and requires NABM to beat it. The anticipation world becomes a must-not-falsely-recover world.'
