schema_version: pivot_llm_prior_pilot.v3
label: pivot_llm_prior_pilot_v3
status: PRECOMMIT_DESIGN_NO_RESULT_INTERPRETATION

purpose:
  primary_goal: >-
    TEST_WHETHER_AN_EXPLORATION_FLOOR_LETS_A_CALIBRATED_LLM_PRIOR_SELECT_BETTER_ENTRANTS_WITHOUT_STARVING_POOLED_LEARNING
  question: >-
    v2 showed that the calibrated LLM prior picks better entrants but leaves
    pooled learners less evidence. If a small, prior-independent share of
    agents explores by entering anyway, does the hybrid beat the hand rule on
    entrant precision while learning at least as well?
  result_informed_successor: true
  informed_by: >-
    V2_SELECTIVE_LLM_PRIOR_IMPROVED_ENTRANT_PRECISION_BUT_REDUCED_EVIDENCE_AND_POOLED_LEARNING_IN_INTERACTION_WORLDS
  new_llm_calls: 0
  reuses: V2_HASH_BOUND_CALIBRATED_PRIORS

source_bindings:
  - path: scripts/prototype_pivot_llm_prior_pilot_v2.py
    sha256: e8eac73fc2a661d14be69384601e7b215c9e3391b5133b5f53a65f8ffa1617d2
    role: CALIBRATED_PRIOR_CONSTRUCTION
