  A pass may establish the exact pre-decision works for the four frozen D0-A
  topic episodes and a current-snapshot author-token measurement base for
  authors observed in each focal field during t-3 through t-1, with
  non-ranked team-cap profiles and past target-topic history. It does not
  establish final candidate eligibility, natural persons, historically
  observed topic classification, incumbent-only or leave-out attention,
