claim_boundary: >-
  This operator-only component materializes the exact row-level predecision
  risk and network-leaveout measurement for the 37 field-27 G4 episodes and an
  exact distinct author-token cold-exclusion guard. It writes raw author tokens
  only under a private mode-0700 output and emits no raw work IDs, entry or
  persistence labels, postdecision target events, realized citation effects,
  or model scores. The guard is ready for mandatory anti-join application when
  earlier analytic rows are later materialized, but no such earlier row set
  currently exists. This component is a real membership foundation, not the
  complete private G4 scoring package: preflight and byte sealing remain
  unauthorized, F and G0 do not pass, G4 stays unopened, and no association,
  null, prediction, transport result, causality, or scientific effect is
  established.
