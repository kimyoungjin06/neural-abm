schema_version: pivot_nabm_case_study_bridge.v1
label: pivot_nabm_case_study_bridge_v1
status: DESIGN_BRIDGE_ONLY_NO_EXECUTION_NO_MODEL_SELECTION

project_hierarchy:
  primary_goal: COMPLETE_AND_IMPROVE_NABM_AS_A_REUSABLE_INSPECTABLE_ADAPTIVE_ABM_FRAMEWORK
  pivot_role: FLAGSHIP_CASE_STUDY_AND_FRAMEWORK_STRESS_TEST
  empirical_role: CONSTRAIN_SIMULATION_OBSERVABLES_AND_EXTERNAL_PLAUSIBILITY
  lean_h3_role: ONE_SET_VALUED_EMPIRICAL_TIMING_TARGET_NOT_THE_PROJECT_GOAL
  governing_question: >-
    Can NABM represent and distinguish productive exploration, hype-driven
    overshoot, delayed correction, and learning trade-offs in researcher
    pivots more usefully than fair simpler baselines?

