claim_boundary: >-
  The bounded D0 core entry-classification and three-year target-topic
  persistence measurement calibration path is complete and independently
  replayed. This establishes deterministic current-snapshot-annotated
  measurement behavior for the exact four certified discovery episodes, not
  adjusted episode comparability, researcher productivity or quality, exposure
  association, causality, or a scientific effect. The optional peer-visible
  success component is deferred. This successor authorizes only a
  metadata-and-contract-only G0 readiness inventory and versioned successor
  design. It does not authorize production Parquet reads, confirmatory or
  holdout access, outcome-based selection, final eligibility, a G0 seal, model
  fitting, or G4.
