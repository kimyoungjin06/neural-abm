claim_boundary: >-
  This contract authorizes only a zero-cost candidate-level aggregation of the
  already frozen 384 title routes and their frozen current-snapshot metadata.
  It separates a joint score/source indexing anomaly from conservative lexical
  semantic evidence and treats ambiguous or quarantined titles as neither
  accept nor reject. The dry-run states are engineering sensitivity results,
  not production content dispositions, semantic truth, accuracy estimates, or
  scientific evidence. No raw scan, new title extraction, API request,
  production disposition, certificate, reselection, outcomes, fitting, G4, or
  scientific effect is authorized.
