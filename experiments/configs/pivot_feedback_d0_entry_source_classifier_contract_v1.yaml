claim_boundary: >-
  This contract resolves the exact normalized sources, time windows,
  work/linkage ABI, and topic-level content-confirmation meaning for the three
  threshold-free pivot-definition inputs. No new API or individual-work label
  is required: the focal feature uses the already certified CONTENT_PASS
  episode topic plus exact current-snapshot primary-topic membership and the
  frozen scholarly-work ABI. This is not work-level semantic ground truth or
  historical topic observability. The contract and fixtures read no production
  Parquet rows and do not authorize source construction, production pivot
  classification, outcome opening, final eligibility, G0, model fitting, G4,
  an association, a causal mechanism, or a scientific effect.
