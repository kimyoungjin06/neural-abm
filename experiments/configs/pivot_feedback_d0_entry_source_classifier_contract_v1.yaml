    - field_id
    - topic_id
    - entry_year
    - author_numeric_id
  pre_entry_target_topic_work_count:
    source_column: pre_entry_target_topic_work_count
    source_artifact: VERIFIED_PREDECISION_AUTHOR_MEASUREMENT
    window: ALL_ELIGIBLE_YEARS_THROUGH_T_MINUS_1
    aggregation: COUNT_DISTINCT_WORK
  trailing_3y_target_topic_work_count:
    source_artifacts:
      - RECEIPT_BOUND_CUTOFF_WORK_METADATA
      - RECEIPT_BOUND_AUTHOR_WORK_EVENTS
    window_offsets: [-3, -2, -1]
    aggregation: COUNT_DISTINCT_ELIGIBLE_TARGET_TOPIC_WORK_PER_AUTHOR_TOKEN
  focal_confirmed_eligible_target_topic_work_count:
    source_artifacts:
      - CERTIFIED_EPISODE_TOPIC_CONTENT_PASS
      - RECEIPT_BOUND_CUTOFF_WORK_METADATA
      - RECEIPT_BOUND_AUTHOR_WORK_EVENTS
    window_offsets: [0]
    aggregation: COUNT_DISTINCT_ELIGIBLE_TARGET_TOPIC_WORK_PER_AUTHOR_TOKEN
  required_invariants:
    - TRAILING_COUNT_LE_PRE_ENTRY_COUNT
    - ZERO_PRE_ENTRY_IMPLIES_ZERO_TRAILING
    - ALL_REGISTERED_AUTHOR_EPISODE_ROWS_RETAINED
    - ONE_CLASSIFICATION_STATE_PER_AUTHOR_TOPIC_YEAR
    - REPEATED_NEW_TOPIC_ENTRY_FOR_SAME_AUTHOR_TOPIC_FORBIDDEN
    - NO_POST_ENTRY_WORK_OR_FUTURE_OUTCOME_INPUT
  entry_year_is_reserved_response_offset_zero_not_attention_year: true
  measurement_abi_latest_attention_year_does_not_truncate_focal_outcome_year: true
  post_entry_offsets_allowed: []
  source_output_before_classification:
    - pre_entry_target_topic_work_count
    - trailing_3y_target_topic_work_count
    - focal_confirmed_eligible_target_topic_work_count
    - excluded_work_missingness_counts

