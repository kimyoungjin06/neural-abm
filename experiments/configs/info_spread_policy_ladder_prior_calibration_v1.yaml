status: PRECOMMIT_DESIGN_NO_RESULT_INTERPRETATION
registered_on: '2026-10-22'
stage: O28 (N21, chosen by the user on 2026-10-22)
purpose: 'O25 found that starting the learner from an LLM prior instead of the hand rule lowers the agents'' utility
  (L1 - L0 in both regimes, L1u - L0 in Regime B). Every LLM prior was calibrated by D3b''s rule to a mean probability
  of 0.4 over the design cohort, while the hand rule F1 sits near 0.68 there. This study crosses each prior''s direction
  (the model''s answers) with its calibration (location and steepness over the cohort) and asks which one carries the
  cost.'
design_document: docs/research/info-spread-policy-ladder-prior-calibration-v1.md
