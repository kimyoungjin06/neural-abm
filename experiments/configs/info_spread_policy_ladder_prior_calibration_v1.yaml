    contract: experiments/configs/info_spread_policy_ladder_study_v2.yaml
    record: experiments/evidence/results/info_spread_policy_ladder_study_v2_d4_20261019.summary.json
    arms_read: [F1, L0]
  llm_arms:
    contract: experiments/configs/info_spread_policy_ladder_llm_arms_v1.yaml
    record: experiments/evidence/results/info_spread_policy_ladder_llm_arms_d5_20261019.summary.json
    arms_read: [P0, L1]
  unclipped_prior:
    contract: experiments/configs/info_spread_policy_ladder_unclipped_prior_v1.yaml
    record: experiments/evidence/results/info_spread_policy_ladder_unclipped_prior_v1_20261021.summary.json
    arms_read: [P0u, L1u]
  utility:
    contract: experiments/configs/info_spread_policy_ladder_utility_v1.yaml
    record: experiments/evidence/results/info_spread_policy_ladder_utility_v1_20261022.summary.json
    read: REGIME B UTILITY OF F1, P0, P0u, L0, L1, AND L1u FROM O25'S DEVELOPMENT CELLS; THE MINIMUM EFFECTS AND THE
      COSTED CASES FROM ITS RECORD
  elicitation: D5'S FIRST REGISTERED ELICITATION, CHECKED AGAINST THE D5 RECORD, TO REBUILD P0 AND P0u EXACTLY
profile_for_counts: development
calibration:
  cohort: D3B'S DESIGN COHORT PER REGIME (1,024 PROFILES, SEED 20261017)
  location: THE MEAN PROBABILITY OF THE PRIOR OVER THE COHORT
  steepness: THE POPULATION STANDARD DEVIATION OF THE PRIOR'S LOGIT OVER THE COHORT
  recalibration: 'Keep the direction prior''s weights up to a positive scale: multiply them by sd(cohort @ source
    weights) / sd(cohort @ direction weights), then set the intercept by D3b''s bisection so the mean probability over
    the cohort equals the source''s. The direction prior''s own intercept is not used.'
  bisection: D3B'S INTERVAL [-40, 40] AND TOLERANCE 1e-10
  inspected_before_the_freeze: THE LOCATION, STEEPNESS, AND COHORT SHARE AT 0.5 OF F1, P0, AND P0u FROM THEIR RECORDED
    WEIGHTS (A STATED REASON FOR THE EXPECTATION); NOTHING ABOUT ANY RUN OF THE NEW ARMS
priors:
  P0_hcal: [P0, F1]
  F1_pcal: [F1, P0]
  P0u_hcal: [P0u, F1]
  F1_ucal: [F1, P0u]
learner_arms:
  L1_hcal: P0_hcal
  L0_pcal: F1_pcal
  L1u_hcal: P0u_hcal
  L0_ucal: F1_ucal
comparisons:
  P0/calibration_given_llm_answers: [L1, L1_hcal]
  P0/calibration_given_hand_answers: [L0_pcal, L0]
  P0/answers_given_hand_calibration: [L1_hcal, L0]
  P0/answers_given_llm_calibration: [L1, L0_pcal]
  P0u/calibration_given_llm_answers: [L1u, L1u_hcal]
  P0u/calibration_given_hand_answers: [L0_ucal, L0]
  P0u/answers_given_hand_calibration: [L1u_hcal, L0]
  P0u/answers_given_llm_calibration: [L1u, L0_ucal]
consistency: EACH GROUP'S MEAN CELL DIFFERENCE L1 - L0 AND L1u - L0 MUST EQUAL O25'S RECORDED VALUE; ANY FAILURE BLOCKS
  READING
parity: L0 RECOMPUTED AT REPLICATE 0 OF EVERY LEARNER TASK MUST EQUAL ITS RECORDED COUNTS, PRECISIONS, REACH, DECISIONS,
  AND UTILITY EXACTLY; ANY FAILURE BLOCKS READING
measure:
  primary: unverified_utility_per_agent (O25's measure)
  reported_not_judged: unverified shares and unverified share precision of every learner arm
design:
  groups: STUDY V2'S 12 STUDY GROUPS (2 REGIMES x 2 FAMILIES x THE LINEAR, SMOOTH, AND AXIS WORLDS); THE NULL WORLD IS
    NOT RUN
  cells_and_replicates: STUDY V2'S, 20 CELLS PER GROUP AND 16 REPLICATES PER CELL
seeds:
  learner_seeds: STUDY V2'S, AS FOR L0, L1, AND L1u
  rule_tag: 28
rule:
  comparison: paired difference in utility per agent per run
  bootstrap_resamples: 2000
  interval: 0.95
  resampling: cells, with replacement
  minimum_effect: O25'S RECORDED MINIMUM EFFECT PER REGIME (1% OF F1'S MEAN ABSOLUTE UTILITY), NOT RECOMPUTED
  material: interval excludes zero and |mean cell delta| >= the regime's minimum effect
dispositions:
  per_comparison_and_regime: MOSTLY_POSITIVE if POSITIVE in at least 4 of the 6 study groups, MOSTLY_NEGATIVE if NEGATIVE
    in at least 4 of 6, otherwise MIXED_OR_NONE
  mostly_at_least: 4
  calibration_check: 'For each recalibrated fixed prior and regime, its mean unverified share count over the study
    cells must lie closer to its calibration source''s than to its direction source''s. If either recalibrated prior of
    an LLM prior fails in a regime, that case is CALIBRATION_CHECK_FAILED.'
  attribution_per_prior_and_regime: CALIBRATION if both calibration comparisons are MOSTLY_NEGATIVE and the two answers
    comparisons are not both MOSTLY_NEGATIVE; ANSWERS in the reverse case; BOTH if all four are; NEITHER_CONSISTENTLY
    otherwise
  costed_cases: [P0/A, P0/B, P0u/B]
  costed_cases_rule: THE CASES WHOSE L1 - L0 OR L1u - L0 WAS MOSTLY_NEGATIVE UNDER UTILITY IN O25, READ FROM ITS RECORD;
    P0u/A IS REPORTED BUT IS NOT A COSTED CASE
  overall: O28_CALIBRATION_CHECK_FAILED if any costed case failed the check; otherwise O28_<ATTRIBUTION>_IN_EVERY_COSTED_CASE
    if the three costed cases share one attribution, and O28_ATTRIBUTION_DIFFERS_ACROSS_COSTED_CASES if not
  expected_before_the_run: 'CALIBRATION in every costed case, stated so it can be rejected. On the cohort, D3b''s shift
    puts every LLM prior at a mean probability of 0.40 against F1''s 0.67 to 0.69, and at c = 1 the LLM priors share 0
    to 40% of profiles against F1''s 75%.'
precommit:
  precommit_paths:
  - docs/research/info-spread-policy-ladder-prior-calibration-v1.md
  - experiments/configs/info_spread_policy_ladder_prior_calibration_v1.yaml
  - scripts/run_info_spread_policy_ladder_prior_calibration_v1.py
  - tests/test_info_spread_policy_ladder_prior_calibration_v1.py
runs:
  pilot: --pilot-cells 2 under full load, for the time estimate only; its summary is not opened
  development: --profile development --precommit-sha <HEAD> --elicitation-dir <D5 first elicitation> --v2-cells --d5-cells
    --o24-cells --o25-cells <the four development cells.jsonl> on GPU-Server, CUDA_VISIBLE_DEVICES=2, 24 workers
  reproduction: the same command into a second output directory; cells.jsonl and summary.json must be byte identical
outputs: [cells.jsonl, summary.json, progress.jsonl, receipt.json]
boundaries:
  empirical_rows_read: 0
  llm_calls: 0
  paid_api_calls: 0
  generic_nabm_api_changed: false
  one_recalibration: LOCATION AND STEEPNESS ARE MOVED TOGETHER; WHICH OF THE TWO MATTERS IS NOT SEPARATED
  p0_regime_a_direction: P0/A HAS A DISTILLATION R-SQUARED OF 0.026, SO ITS DIRECTION AT F1'S STEEPNESS IS LARGELY THE
    CLIPPED READOUT'S NOISE
  synthetic_only: true
