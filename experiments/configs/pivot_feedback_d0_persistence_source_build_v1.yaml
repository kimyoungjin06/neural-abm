claim_boundary: >-
  This build may materialize only the current-snapshot-annotated t+1 through
  t+3 persistence counts, state, and boolean for every one of the 4,301
  independently verified observable-history NEW_TOPIC_ENTRY rows. It must
  rehash every bound work and author-event partition and preserve the exact
  denominator. It may not read confirmatory entry years or post-entry offsets
  outside 1 through 3, filter the denominator, apply a history or team
  threshold, join citation or peer outcomes, analyze an association, create an
  API request, establish final eligibility, freeze G0, fit a model, open G4,
  or establish true researcher-topic persistence, causality, or a scientific
  effect.
