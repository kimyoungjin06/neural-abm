purpose: 'Extend the v12 ledger with the peer-outcome contrast, recommended experiment 4, which the user directed on
  2026-10-30: does an author''s entry into a surge topic depend on a coauthor''s visible outcome there, as Study 2''s
  learning rules postulate? It is the first study to read outcome rows from OpenAlex, from the discovery partition
  only. v1 to v12 remain the records for everything before.'
