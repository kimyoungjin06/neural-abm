claims:
  confirmed:
  - id: C89_the_visibility_estimator_recovers_study2s_imitative_direction
    statement: Run on Study 2's own arms with a three-step outcome delay, the visibility estimator finds the imitative
      arm's direction in every scenario. Entry rises once a neighbor's success becomes visible (+5.2 to +6.7
      log-odds) and falls once a failure does (-4.3 to -4.7). The visibility DiD is +9.7 to +11.0. The cautionary
      arm never pivots after a visible failure.
    evidence:
    - source: peer_outcome_contrast
      pointer: simulation/simulation~1baseline~1delay_3/by_arm/imitative/state~1success_following/low
      greater_than: 0.0
    - source: peer_outcome_contrast
      pointer: simulation/simulation~1interdisciplinary_seed_grants~1delay_3/by_arm/imitative/state~1success_following/low
      greater_than: 0.0
    - source: peer_outcome_contrast
      pointer: simulation/simulation~1hot_field_hype~1delay_3/by_arm/imitative/state~1success_following/low
      greater_than: 0.0
    - source: peer_outcome_contrast
      pointer: simulation/simulation~1baseline~1delay_3/by_arm/imitative/state~1failure_avoidance/high
      less_than: 0.0
    - source: peer_outcome_contrast
      pointer: simulation/simulation~1interdisciplinary_seed_grants~1delay_3/by_arm/imitative/state~1failure_avoidance/high
      less_than: 0.0
    - source: peer_outcome_contrast
      pointer: simulation/simulation~1hot_field_hype~1delay_3/by_arm/imitative/state~1failure_avoidance/high
      less_than: 0.0
    - source: peer_outcome_contrast
      pointer: post_hoc/imitative_visibility_did_at_delay_3_min_mean
      greater_than: 9.0
    - source: peer_outcome_contrast
      pointer: simulation/simulation~1interdisciplinary_seed_grants~1delay_3/state_events/cautionary/F
      equals: 0.0
  - id: C90_the_visibility_placebo_is_biased_in_study2s_frozen_arm
    statement: In Study 2's seed-grant world, the frozen arm, which never learns, shows a visibility DiD of -0.785
      [-1.156, -0.371] at the three-step delay. Its outcome gap is positive while outcomes are pending and negative
      once they are visible, though its dynamics do not depend on the delay. The placebo removes only the
      association fixed before visibility, and this one changes over time. By the registered rule the data DiD is
      not interpreted.
    evidence:
    - source: peer_outcome_contrast
      pointer: status
      equals: E4_NOT_INTERPRETABLE_THE_ESTIMATOR_FLAGS_STUDY2_FROZEN_ARM
    - source: peer_outcome_contrast
      pointer: simulation/simulation~1interdisciplinary_seed_grants~1delay_3/by_arm/frozen/state~1visibility_did/high
      less_than: 0.0
    - source: peer_outcome_contrast
      pointer: simulation/simulation~1interdisciplinary_seed_grants~1delay_3/by_arm/frozen/state~1outcome_gap_before_visible/low
      greater_than: 0.0
    - source: peer_outcome_contrast
      pointer: simulation/simulation~1interdisciplinary_seed_grants~1delay_3/by_arm/frozen/state~1outcome_gap_visible/high
      less_than: 0.0
    - source: peer_outcome_contrast
      pointer: checks/study2_parity/frozen_delay_3_runs_equal
      equals: 90
    - source: peer_outcome_contrast
      pointer: post_hoc/frozen_grants_bias_exceeds_the_data_interval_half_width
      equals: true
  - id: C91_a_visible_coauthor_entry_goes_with_more_entry_in_the_discovery_partition
    statement: In the 24 discovery episodes, an author at risk with a coauthor's entry in view enters the topic more
      often, without recruitment, by +0.520 [+0.367, +0.739] log-odds. Counting entries recruited by an earlier
      entrant, the association is +1.078 [+0.948, +1.323]. These are associations, not effects.
    evidence:
    - source: peer_outcome_contrast
      pointer: decision/expectations/EE1/held
      equals: true
    - source: peer_outcome_contrast
      pointer: data/estimates/exposure~1exposed/low
      greater_than: 0.36
    - source: peer_outcome_contrast
      pointer: data/estimates/exposure_recruited_as_events~1exposed/low
      greater_than: 0.9
    - source: peer_outcome_contrast
      pointer: data/counts/exposed_authors
      equals: 177254
  - id: C92_discovery_entrants_rarely_follow_up_and_show_no_entry_order_gradient
    statement: Of 6,291 precise discovery entrants, 14.6% publish again in the topic within four quarters, 12.2% enter
      with an earlier entrant as coauthor, and 51.4% with a topic incumbent. The follow-up rate shows no gradient
      with entry quarter, +0.010 [-0.224, +0.287] log-odds across the twelve quarters.
    evidence:
    - source: peer_outcome_contrast
      pointer: post_hoc/label_rate_of_precise_entrants
      equals: 0.1462
    - source: peer_outcome_contrast
      pointer: post_hoc/recruited_share_of_precise_entrants
      equals: 0.1222
    - source: peer_outcome_contrast
      pointer: data/estimates/entry_order~1entry_time/low
      less_than: 0.0
    - source: peer_outcome_contrast
      pointer: data/estimates/entry_order~1entry_time/high
      greater_than: 0.0
  - id: C93_post_hoc_the_data_bound_outcome_dependence_far_below_study2s_imitative_arm
    statement: 'Post hoc and descriptive. Under the same estimator, Study 2''s imitative arm shows a visible outcome
      gap of at least 6.95 log-odds; the data''s upper bound is 0.79, and the frozen arm''s largest bias is 0.79.
      Study 2''s learning rate makes agents answer one neighbor''s outcome far more strongly than coauthors'' entries
      answer it here. Pivots and topic entries are different events; the comparison puts them on one log-odds
      scale. Study 2''s imitative arm also shows a falling entry-order gradient (-0.43 to -8.04), which the data do
      not (C92).'
    evidence:
    - source: peer_outcome_contrast
      pointer: post_hoc/status
      equals: POST_HOC_DESCRIPTIVE_NOT_REGISTERED
    - source: peer_outcome_contrast
      pointer: post_hoc/imitative_outcome_gap_visible_min_mean
      greater_than: 6.9
    - source: peer_outcome_contrast
      pointer: post_hoc/data_outcome_gap_visible_high
      less_than: 0.8
    - source: peer_outcome_contrast
      pointer: post_hoc/entry_order_means/imitative/hot_field_hype~1delay_3
      less_than: 0.0
  - id: C94_the_contrast_reproduced_with_parity_and_read_no_confirmatory_outcome
    statement: The contrast reproduced byte for byte. Study 2's slots reproduced all 270 tracked runs, the rebuilt
      rows of every exposed author equal N11b's, every fit converged, and no confirmatory or G4 outcome row was
      read.
    evidence:
    - source: peer_outcome_contrast
      pointer: execution/byte_identical/e4_summary.json
      equals: true
    - source: peer_outcome_contrast
      pointer: execution/byte_identical/private~1cells.parquet
      equals: true
    - source: peer_outcome_contrast
      pointer: checks/study2_parity/delay_0_runs_equal
      equals: 270
    - source: peer_outcome_contrast
      pointer: checks/n11b_parity/exposed_panel_rows_differing
      equals: 0
    - source: peer_outcome_contrast
      pointer: data/unconverged_fits
      equals: 0
    - source: peer_outcome_contrast
      pointer: data_access/confirmatory_outcome_rows_read
      equals: 0
  rejected:
  - id: R24_es2_the_imitative_gap_could_not_be_checked_in_the_baseline_world
    statement: 'ES2 failed as registered. In the seed-grant world the imitative arm''s outcome gap exceeds the frozen
      arm''s by +7.03 [+6.44, +7.69], but in the baseline world the frozen arm had only 9 entries after a visible
      failure, below the registered 10, so the difference is undefined there.'
    evidence:
    - source: peer_outcome_contrast
      pointer: decision/expectations/ES2/held
      equals: false
    - source: peer_outcome_contrast
      pointer: simulation/simulation~1baseline~1delay_0/state_events/frozen/F
      equals: 9.0
    - source: peer_outcome_contrast
      pointer: decision/expectations/ES2/rows/interdisciplinary_seed_grants/low
      greater_than: 6.0
  - id: R25_es3_the_estimator_is_not_flat_in_study2s_no_learning_arm
    statement: ES3 failed. The frozen arm's visibility DiD excludes zero in the seed-grant world (C90), covers it in
      the hype world, and is undefined in the baseline world.
    evidence:
    - source: peer_outcome_contrast
      pointer: decision/expectations/ES3/held
      equals: false
    - source: peer_outcome_contrast
      pointer: decision/expectations/ES3/covers_zero/interdisciplinary_seed_grants
      equals: false
    - source: peer_outcome_contrast
      pointer: decision/expectations/ES3/covers_zero/hot_field_hype
      equals: true
  - id: R26_ee2_homophily_before_visibility_was_not_detected
    statement: EE2 failed. Before a coauthor's outcome is visible, authors whose coauthor will follow up do not
      detectably enter more often, +0.290 [-0.553, +0.583]. The interval is wide; 32 and 110 entries fall in the two
      pending states.
    evidence:
    - source: peer_outcome_contrast
      pointer: decision/expectations/EE2/held
      equals: false
    - source: peer_outcome_contrast
      pointer: data/estimates/state~1outcome_gap_before_visible/low
      less_than: 0.0
    - source: peer_outcome_contrast
      pointer: data/state_events/P_S
      equals: 32.0
  open:
  - id: O38_a_learning_direction_test_that_leaves_study2s_frozen_arm_flat
    question: Is there a coauthor-outcome design that leaves Study 2's frozen arm flat at the study's delay, and that
      has the power to read learning direction at the empirical shape, before the confirmatory partition is read?
    kind: SYNTHETIC_THEN_EMPIRICAL
    priority: 2
    motivation: The before-and-after-visibility placebo is biased without learning (C90), and the discovery data hold
      17 entries after a visible success and 60 after a visible failure. The confirmatory partition stays sealed.
    evidence:
    - source: peer_outcome_contrast
      pointer: data/state_events/S
      equals: 17.0
    - source: peer_outcome_contrast
      pointer: data/state_events/F
      equals: 60.0
  - id: O39_study2_at_a_learning_strength_the_data_allow
    question: Does Study 2's imitative loop, more failed pivots under supportive environments, survive when its
      learning strength is cut to an outcome dependence the coauthor data allow, and when outcomes become visible
      only after a delay?
    kind: SYNTHETIC
    priority: 2
    motivation: Study 2's imitative arm answers one neighbor's outcome far more strongly than the data bound (C93), and
      its loop rests on a falling entry-order gradient that the data do not show (C92).
    evidence:
    - source: peer_outcome_contrast
      pointer: post_hoc/imitative_outcome_gap_visible_min_mean
      greater_than: 6.9
