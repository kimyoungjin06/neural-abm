claim_boundary: >-
  The metadata-only prerequisite closure plan is independently valid and
  identifies the first blocker as a contract-generation mismatch, not missing
  evidence. An exact passing G-1A receipt exists, while immutable G0 v1 expects
  a legacy G-1 schema; legacy G-1 remains pending and is not promoted. This
  gate authorizes only a versioned metadata-only binding-reconciliation
  contract that preserves the G-1A receipt's bounded semantics. It does not
  authorize editing G0 v1 or G0 v2, relabeling the receipt, resolving another
  value, completing a section, creating or opening a holdout seal, opening
  confirmatory data, sealing G0, fitting a model, opening G4, asserting
  causality, or establishing a scientific effect.
