purpose: 'Extend the v14 ledger with stage 1 of recommended experiment 3, which the user directed on 2026-10-30 and
  chose to run in two stages, synthetic first and OpenAlex second: can the crossing where an in-run learner overtakes a
  table written before the run be predicted from between-run heterogeneity and within-run evidence measured before
  the comparison? v1 to v14 remain the records for everything before.'
