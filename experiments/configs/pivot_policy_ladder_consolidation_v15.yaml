claims:
  confirmed:
  - id: C101_a_rule_from_heterogeneity_and_evidence_beats_both_baselines_but_misses_the_bound
    statement: A parameter-free rule, computed from learner runs with one fixed sign on separate worlds, placed the
      crossing of the in-run learner and a k-donor table with a mean absolute error of 0.0549 over nine series
      (visibility 0.2, 0.5, 1.0; 2, 4, 8 donors). A constant baseline erred by 0.1052 and a table-size-only rule by
      0.0987. The rule was within 0.05 in 6 of 9 series, each baseline in 2 of 9. Its mean error misses the
      registered bound of 0.05.
    evidence:
    - source: crossover_prediction
      pointer: status
      equals: E3_THE_RULE_BEATS_THE_BASELINES_BUT_MISSES_BY_MORE_THAN_THE_BOUND
    - source: crossover_prediction
      pointer: scoring/mean_absolute_error/predicted
      equals: 0.0549
    - source: crossover_prediction
      pointer: scoring/mean_absolute_error/baseline_table_size_only
      equals: 0.0987
    - source: crossover_prediction
      pointer: scoring/mean_absolute_error/baseline_constant
      equals: 0.1052
    - source: crossover_prediction
      pointer: scoring/within_bound/predicted
      equals: 6
    - source: crossover_prediction
      pointer: scoring/within_bound/baseline_table_size_only
      equals: 2
  - id: C102_the_crossing_moves_later_with_table_size_and_earlier_with_evidence
    statement: The learner's crossing rose with the table size (2, 4, 8 donors) at every visibility and fell with the
      visibility (0.2, 0.5, 1.0) at every table size. Within-run variance fell in proportion to the visibility (0.032,
      0.013, 0.0067) while between-run heterogeneity changed little (0.092 to 0.103). The first material advantage
      came at flip rates from 0.05 (one donor) to 0.25 (four or eight donors at visibility 0.2); at visibility 0.5 it
      came at 0.05, 0.05, 0.1, and 0.15 for 1, 2, 4, and 8 donors.
    evidence:
    - source: crossover_prediction
      pointer: expectations/X2/held
      equals: true
    - source: crossover_prediction
      pointer: expectations/X3/held
      equals: true
    - source: crossover_prediction
      pointer: predicted/pi=0.2~1components/mean_V
      greater_than: 0.03
    - source: crossover_prediction
      pointer: predicted/pi=1~1components/mean_V
      less_than: 0.007
    - source: crossover_prediction
      pointer: observed/pi=0.5~1k=8~1p=0.1/label
      equals: INDISTINGUISHABLE
    - source: crossover_prediction
      pointer: observed/pi=0.5~1k=8~1p=0.15/label
      equals: POSITIVE
    - source: crossover_prediction
      pointer: observed/pi=0.2~1k=4~1p=0.2/label
      equals: INDISTINGUISHABLE
  - id: C103_without_heterogeneity_a_larger_table_wins_and_one_donor_ties
    statement: With no flips, every table of 2 or more donors matched or beat the in-run learner at every visibility,
      and the one-donor table was indistinguishable from it, as the rule implies.
    evidence:
    - source: crossover_prediction
      pointer: expectations/X1/held
      equals: true
    - source: crossover_prediction
      pointer: expectations/X5/held
      equals: true
    - source: crossover_prediction
      pointer: observed/pi=0.2~1k=8~1p=0/label
      equals: NEGATIVE
  - id: C104_post_hoc_the_rule_misses_only_where_evidence_is_scarce
    statement: 'Post hoc and descriptive. At visibility 1.0 the rule was within 0.010 of every observed crossing, on
      either side; at 0.5 it was late in all three series by at most 0.030; at 0.2 it was late by 0.062 to 0.236.
      Without visibility 0.2 its mean error would be 0.017. Its squared-error proxy on uniform probe items may
      overweight items far from the share cutoff; that is not tested.'
    evidence:
    - source: crossover_prediction
      pointer: scoring/series/pi=0.2~1k=8/predicted
      greater_than: 0.4
    - source: crossover_prediction
      pointer: scoring/series/pi=0.2~1k=8/observed
      less_than: 0.19
    - source: crossover_prediction
      pointer: scoring/series/pi=1~1k=8/predicted
      greater_than: 0.049
    - source: crossover_prediction
      pointer: scoring/series/pi=1~1k=8/observed
      less_than: 0.053
  - id: C105_o26s_four_donor_comparison_replicates_on_new_worlds
    statement: At visibility 0.5, the four-donor comparison on new worlds gave -0.015, +0.017, and +0.067 at flip rates
      0, 0.1, and 0.25, against O26's Regime A linear -0.017, +0.010, and +0.069. O26's interval at 0.1 covered zero
      and this one does not, so the onset reads 0.1 here and 0.25 in O26.
    evidence:
    - source: crossover_prediction
      pointer: observed/pi=0.5~1k=4~1p=0.25/mean_cell_delta
      equals: 0.0668
    - source: flip_rate
      pointer: table/A~1linear_exact~1p=0.25/unverified_share_precision/best_table/mean_cell_delta
      equals: 0.0688
    - source: crossover_prediction
      pointer: observed/pi=0.5~1k=4~1p=0.1/material
      equals: true
    - source: flip_rate
      pointer: table/A~1linear_exact~1p=0.1/unverified_share_precision/best_table/material
      equals: false
  - id: C106_the_study_reproduced_byte_for_byte_on_one_host
    statement: The development and reproduction runs on GPU-Server's CPU (3,475 and 3,509 s) wrote byte-identical
      measurement, cell, and summary files, and no empirical row was read.
    evidence:
    - source: crossover_prediction
      pointer: execution/byte_identical/measurement.jsonl
      equals: true
    - source: crossover_prediction
      pointer: execution/byte_identical/cells.jsonl
      equals: true
    - source: crossover_prediction
      pointer: execution/byte_identical/summary.json
      equals: true
    - source: crossover_prediction
      pointer: boundary/empirical_rows_read
      equals: 0
  rejected:
  - id: R27_x4_the_rule_does_not_meet_the_registered_accuracy_bound
    statement: X4 failed. The rule's mean crossing error, 0.0549, exceeds the registered bound of 0.05, though it is
      below both baselines' (C101).
    evidence:
    - source: crossover_prediction
      pointer: expectations/X4/held
      equals: false
    - source: crossover_prediction
      pointer: scoring/mean_absolute_error/predicted
      greater_than: 0.05
  open:
  - id: O41_a_decision_weighted_crossover_rule
    question: Does a rule whose error weights items near the share cutoff, or is computed on the decisions learners
      actually face, place the crossing within the bound where within-run evidence is scarce?
    kind: SYNTHETIC
    priority: 2
    motivation: The squared-error rule is late only at visibility 0.2 (C104), the regime of sparse labels.
    evidence:
    - source: crossover_prediction
      pointer: scoring/series/pi=0.2~1k=4/predicted
      greater_than: 0.25
  - id: O42_the_crossover_rule_on_openalex_discovery_episodes
    question: Applied to the discovery episodes, does the rule order a table pooled from other episodes against a
      within-episode learner of the follow-up label as the observed forecasts do?
    kind: EMPIRICAL_DISCOVERY_PARTITION
    priority: 3
    motivation: The user chose this as stage 2 of experiment 3. Stage 1 found the rule late where evidence is scarce
      (C104), and the episodes give few labels, each visible five quarters after entry.
    evidence:
    - source: crossover_prediction
      pointer: experiment
      equals: RECOMMENDED_EXPERIMENT_3_STAGE_1_SYNTHETIC
