claim_boundary: >-
  A full v3 component pass establishes exact current-snapshot YYYY-MM-DD
  publication parsing, pairwise publication-date/year concordance, frozen null
  and chronology buckets, and exact UTC-millisecond lexical, non-null, and
  not-after-snapshot validity for created_date and updated_date in the declared
  main-work projection. The created <= updated relation is retained only as a
  descriptive count because OpenAlex does not document it as a vendor
  invariant. A pass does not establish record-event order, edge observation
  time or citation available_at, historical content identity, author entity or
  candidate eligibility, G-1 or G0, empirical G1, field selection, NABM
  effects, or any scientific effect. A max-files run is
  PILOT_MAIN_TEMPORAL_FIELD_VALIDITY_V3_EXACT_UTC_MILLISECOND_ONLY and can
  never receive the full component status.
