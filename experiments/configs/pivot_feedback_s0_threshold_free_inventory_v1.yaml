claim_boundary: >-
  A passing core inventory establishes exact field-year counts from the bound
  work-metadata and distinct author-work-event surfaces, exact non-ranked
  descriptive team-size and calendar-support profiles, and raw annual,
  trailing-three-year, and trailing-five-year attention counts. It does not
  establish ORCID-stable author identity, author-work affiliation, distinct
  coauthor graph topology, candidate eligibility, a fixed outcome horizon,
  shocks, effects, field selection, D0 authorization, G0, model fitting, or a
  scientific effect. S0 remains incomplete until the three deferred source and
  graph components pass.
