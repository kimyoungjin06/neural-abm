claim_boundary: >-
  This additive ledger preserves the v6 linkage-review boundary and records a
  full outcome-blind scholarly-work ABI, deterministic four-episode reselection,
  and automated title/indexing extraction. The automated audit passed data
  integrity but identified a predeclared topic-score and source-concentration
  discontinuity in episode 3, which is quarantined pending human double review
  and a complete-universe contamination-rule successor. The other three
  episodes are not promoted by default, and the prior author-opportunity
  foundation is not the current analytic panel. D0 remains incomplete.
  Leave-out, network, bridge, entry, persistence, G0, final-panel
  materialization, model fitting, G4, empirical associations, causal effects,
  and scientific effects remain paused, unauthorized, sealed, not run, or not
  established.
