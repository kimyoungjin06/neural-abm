    may_issue_receipt_only_after_atomic_finalization: true
    may_open_seal: false
  future_seal_independent_verification:
    state: REQUIRED_AFTER_RECEIPT
    must_rehash_final_artifacts_and_manifest: true
    must_verify_receipt_was_written_last: true
    must_verify_zero_prior_open_events: true
    may_parse_or_analyze_holdout_rows: false
    may_open_seal: false
  future_seal_opening:
