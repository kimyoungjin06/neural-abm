claim_boundary: >-
  This metadata-only contract fixes the future holdout partition and the
  manifest, receipt, atomic-finalization, independent-verification, and
  fail-closed rules for a later seal-creation phase. It does not enumerate or
  hash holdout artifacts, create or issue a seal, write a receipt, open
  confirmatory or holdout data, change G0 v2, resolve quantitative choices or
  required sections, pass G0, fit a model, open G4, assert causality, or
  establish a scientific effect. Seal creation and seal opening require
  distinct future authorization gates.
