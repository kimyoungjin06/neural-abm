    - id: linear_fit
    - id: smooth_interaction_fit
    - id: axis_interaction_fit
  implementation: V1_APPLY_FIT_WORLD

evidence_regimes:
  - id: neighbor_local
  - id: field_public
    cross_fit_folds: 4
    includes_own_public_outcome: false

batch_learners:
  source: EXACT_V2_BATCH_LEARNER_SETTINGS_UNCHANGED
  scalar_batch:
    epochs: 80
    eta: 0.5
    prior_anchor: 0.25
  linear_batch:
    optimizer: ADAM
    epochs: 300
    learning_rate: 0.02
    weight_decay: 0.0001
  mlp_batch:
    hidden_width: 16
    optimizer: ADAM
    epochs: 300
    learning_rate: 0.02
    weight_decay: 0.0001
  tree_batch:
    initial_margin: FROZEN_PRIOR_LOGIT
    rounds: 300
    learning_rate: 0.1
    max_depth: 3
    min_samples_leaf: 5
    leaf_l2: 1.0

probe_cohort:
  base_seed: 20261212
  agent_count: 256
  per_replicate: true

profiles:
  smoke:
    agent_count: 48
    steps: 12
    burn_in_steps: 2
    replicates: 2
    base_seed: 20261211
  development:
    agent_count: 256
    steps: 18
    burn_in_steps: 2
    replicates: 16
    base_seed: 20261211

decision_contract:
  unit: REPLICATE_THE_MEAN_OVER_ITS_FOUR_FOLD_LEARNERS_AS_IN_THE_RUNS_PROBE_BRIER
  metric: PROBE_BRIER_ON_THE_REPLICATES_PROBE_COHORT
  interval: PAIRED_95_PERCENT_T_INTERVAL_OVER_16_REPLICATES
  minimum_replicates: 12
  material_brier_difference: 0.01
  material_rule: THE_INTERVAL_EXCLUDES_ZERO_AND_THE_ABSOLUTE_MEAN_IS_AT_LEAST_THE_MATERIAL_DIFFERENCE
  primary_world: linear_fit
  source_of_the_gap:
    learner_gap: REGISTERED_LINEAR_MINUS_REGISTERED_MLP_ON_THE_SAME_EVIDENCE_FOR_EACH_SOURCE_ARM
    evidence_gap: THE_SAME_FIT_ON_THE_LINEAR_ARMS_EVIDENCE_MINUS_ON_THE_MLP_ARMS_EVIDENCE_FOR_EACH_REGISTERED_FIT
    outcomes:
      LEARNER: BOTH_LEARNER_GAPS_MATERIAL_AND_POSITIVE_AND_NO_EVIDENCE_GAP_MATERIAL
      EVIDENCE: AN_EVIDENCE_GAP_MATERIAL_AND_NOT_BOTH_LEARNER_GAPS
      BOTH: BOTH_LEARNER_GAPS_MATERIAL_AND_POSITIVE_AND_AN_EVIDENCE_GAP_MATERIAL
      NEITHER: OTHERWISE
  optimization:
    on: THE_LINEAR_ARMS_OWN_EVIDENCE
    outcomes:
      NO_GAP_TO_EXPLAIN: THE_LEARNER_GAP_ON_THE_LINEAR_ARMS_EVIDENCE_IS_NOT_MATERIAL_AND_POSITIVE
      OPTIMIZATION_BUDGET: UPPER_95_PERCENT_BOUND_OF_CONVERGED_LINEAR_MINUS_REGISTERED_MLP_AT_MOST_THE_MARGIN
      PARTLY_OPTIMIZATION: NOT_THE_ABOVE_AND_REGISTERED_MINUS_CONVERGED_LINEAR_MATERIAL_AND_POSITIVE
      NOT_OPTIMIZATION: OTHERWISE
  optimization_noninferiority_margin: 0.005
  study_status: O35_THEN_THE_PRIMARY_WORLDS_SOURCE_THEN_ITS_OPTIMIZATION_OUTCOME
  other_worlds: SAME_QUANTITIES_REPORTED_THE_LINEAR_POLICY_IS_MISSPECIFIED_THERE
  reported: [LOG_LOSS, AUC, SHARPNESS, RESIDUAL_NORM, EVIDENCE_EVENTS, EVIDENCE_PRODUCTIVE_SHARE]
  checks:
    required: true
    conditions:
      - THE_RECORDED_FOLD_LEARNERS_REPRODUCE_THE_RUNS_PROBE_BRIER_EXACTLY
      - THE_SOURCE_ARMS_REGISTERED_REFIT_ON_EACH_FINAL_BUFFER_REPRODUCES_THE_RECORDED_PROBE_OUTPUT_EXACTLY
      - THE_LEARNER_SLOT_IS_RESTORED_AND_THE_PRIOR_SLOT_IS_THE_HAND_RULE_AFTER_EVERY_TASK
      - EVERY_LINEAR_CONVERGED_FIT_REACHES_THE_GRADIENT_TOLERANCE
    failure_action: INVALID_IMPLEMENTATION_STOP
  model_selection: FORBIDDEN

expectations_before_the_run:
  basis: >-
    THE_LINEAR_LABEL_IS_A_DETERMINISTIC_LINEAR_THRESHOLD_SO_ITS_BEST_FORECAST_IS_A_STEP_WHICH_A_LOGISTIC_POLICY_APPROACHES_ONLY_WITH_LARGE_WEIGHTS_ADAM_AT_0.02_MOVES_EACH_RESIDUAL_PARAMETER_AT_MOST_ABOUT_6_IN_300_STEPS_WHILE_THE_MLP_MULTIPLIES_TWO_SUCH_MOVES_ACROSS_16_UNITS
  E1: THE_PRIMARY_WORLDS_SOURCE_IS_LEARNER
  E2: THE_PRIMARY_WORLDS_OPTIMIZATION_IS_OPTIMIZATION_BUDGET
  E3: ON_THE_LINEAR_ARMS_EVIDENCE_THE_REGISTERED_MLP_MINUS_LINEAR_PROBE_AUC_IS_BELOW_0.02_SO_THE_GAP_IS_SHARPNESS_NOT_RANKING
  recording: EACH_EXPECTATION_IS_RECORDED_AS_HELD_OR_FAILED_A_FAILED_EXPECTATION_IS_A_REJECTED_CLAIM

precommit:
