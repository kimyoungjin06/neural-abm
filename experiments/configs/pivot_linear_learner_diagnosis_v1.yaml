purpose:
  primary_goal: >-
    EXPLAIN_WHY_THE_POOLED_LINEAR_LEARNER_FORECASTS_WORSE_THAN_THE_MLP_IN_THE_LINEAR_WORLD
  question: >-
    In the linear world the productive label is a deterministic linear threshold
    of the features, so the residual linear policy is correctly specified, and
    the residual MLP nests it exactly. Yet under the hand rule the pooled linear
    learner's probe Brier is about 0.060 against the MLP's 0.013 (O35, reopening
    O12). Is the gap the learner or the evidence it saw, and is it the policy
    class or its optimization budget?
  open_item: O35_why_the_linear_learner_loses_in_the_linear_world
  ledger: experiments/configs/pivot_policy_ladder_consolidation_v10.yaml
  new_llm_calls: 0

