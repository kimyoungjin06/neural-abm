prior: HAND_RULE_IN_THE_PRIOR_SLOT

recording:
  method: >-
    A_SUBCLASS_OF_THE_V2_PROBED_LEARNER_THAT_ONLY_LISTS_ITSELF_FILLS_THE_LEARNER_SLOT_DURING_THE_RUN_AND_IS_RESTORED
  recorded_per_fold: FINAL_TRAINING_BUFFER_EVAL_AND_PROBE_FEATURES_SEED_COMPONENTS_AND_REFIT_COUNT
  refit_seed: THE_SEED_OF_THE_FOLD_LEARNERS_LAST_REFIT

source_arms: [linear_batch, mlp_batch]

refits:
  - id: registered_linear
    learner: linear_batch
    method: REGISTERED_ADAM
  - id: registered_mlp
    learner: mlp_batch
    method: REGISTERED_ADAM
  - id: linear_epochs_x10
    learner: linear_batch
    method: REGISTERED_ADAM
    overrides: {epochs: 3000}
  - id: linear_learning_rate_x10
    learner: linear_batch
    method: REGISTERED_ADAM
    overrides: {learning_rate: 0.2}
  - id: linear_converged
    learner: linear_batch
    method: LBFGS_TO_CONVERGENCE
    weight_decay: 0.0001
    objective: MEAN_BINARY_CROSS_ENTROPY_PLUS_HALF_THE_WEIGHT_DECAY_TIMES_THE_SQUARED_RESIDUAL_NORM_THE_ADAM_L2_OBJECTIVE
  - id: linear_converged_weak_penalty
    learner: linear_batch
    method: LBFGS_TO_CONVERGENCE
    weight_decay: 0.000001
    role: DESCRIPTIVE_ONLY_ITS_CONVERGENCE_IS_RECORDED_NOT_REQUIRED

convergence:
  max_iterations: 20000
  max_abs_gradient: 0.000001
  required_for: [linear_converged]
  failure_action: INVALID_IMPLEMENTATION_STOP

common_environment:
  scenario: hot_field_hype
  state_model: persistence_exit_v1
  learning_mode: imitative
  transition:
    failed_minimum_active_steps: 2
    failed_continuation_score:
      productive_fit_weight: 0.5
      current_policy_output_weight: 0.5
      exit_below: 0.4
    reentry_after_exit: false

inherited_learning_parameters:
  neighbor_count: 4
  within_stage_probability: 0.6
  learning_rate: 1.5
  prior_anchor: 0.25
  local_alpha: 0.45
  local_noise_scale: 0.02
  social_alpha: 0.40
  peer_similarity_threshold: 0.68
  pivot_threshold: 0.34
  productive_threshold: 0.40

visibility_regimes:
  - id: immediate
    success_delay_steps: 0
    failure_delay_steps: 0
    success_visibility_probability: 1.0
    failure_visibility_probability: 1.0

fit_worlds:
