  G0 v3 independently preserves its immutable G0 v2 predecessor and binds only
  the four choices authorized by gate v58. Six choices are serialized in total,
  thirteen quantitative choices remain unresolved, and all fifteen required
  sections remain not freeze-ready. The four values are outcome-blind policies,
  have not been applied to production data, and do not establish empirical
  effects. Citation availability remains a current-snapshot bibliographic-time
  proxy. This gate authorizes only a separate discovery-only precommitment and
  closed synthetic fixture for the exact next six risk-set, weighting, support,
  and collinearity choices. It does not authorize binding those values into G0,
  production application, holdout access or sealing, model fitting, G0 passage,
  G4 opening, causality, or a scientific effect.
