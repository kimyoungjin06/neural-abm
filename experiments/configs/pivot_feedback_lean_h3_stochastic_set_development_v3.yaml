scientific_object:
  question: >-
    Can a scale-invariant posterior practical-peak set recover set-valued field
    timing geometry under finite counts without using the opened challenge?
  primary_estimand: FOUR_FIELD_VECTOR_OF_MEAN_EPISODE_PRACTICAL_PEAK_GAP_INTERVALS
  secondary_summary: FIELD_BALANCED_INTERVAL_HULL_REPORTED_WITH_VECTOR
  event_time_grid: [-2, -1, 0, 1, 2]
  claim_role: NONBLIND_SYNTHETIC_STOCHASTIC_DEVELOPMENT_ONLY

scale_audit:
  selection_criterion: POSITIVE_AFFINE_RATE_TRANSFORMATION_INVARIANCE
  criterion_fixed_without_opened_metrics: true
  rejected_rule:
    name: absolute_probability_peak_membership_margin
    margin: 0.01
    reason: PEAK_SET_CHANGES_UNDER_POSITIVE_AFFINE_RESCALE
  retained_rule:
    name: normalized_prominence_regret
    formula: (DRAW_MAX_PROBABILITY_MINUS_DRAW_TIME_PROBABILITY)/DRAW_PROMINENCE
    inclusive_regret_margin: 0.10
    reason: DIMENSIONLESS_AND_POSITIVE_AFFINE_INVARIANT
    policy_status: PROSPECTIVE_DESIGN_CHOICE_NOT_LITERATURE_MANDATED
  retained_absolute_rule:
    role: PRACTICALLY_FLAT_CURVE_FLOOR_ONLY
    inclusive_probability_prominence_floor: 0.01
    source: OUTCOME_BLIND_G0_V4_ONE_PERCENTAGE_POINT_PRACTICAL_NULL_ANCHOR
    transfer_status: PROVISIONAL_NOT_EMPIRICALLY_VALIDATED_FOR_PEAK_LOCATION
  analytic_fixture:
    base_curve: [0.01, 0.02, 0.10, 0.095, 0.01]
    affine_scale: 4.0
    affine_shift: 0.0
    expected_absolute_rule_invariant: false
    expected_normalized_rule_invariant: true

stochastic_candidate:
  name: jeffreys_normalized_regret_field_vector_v3
  within_episode_working_likelihood:
    model: INDEPENDENT_JEFFREYS_BINOMIAL_BY_REGISTERED_TIME
    prior_alpha: 0.5
    prior_beta: 0.5
    role: SYNTHETIC_DEVELOPMENT_WORKING_LIKELIHOOD_ONLY
  posterior_peak_set:
    joint_probability_draws_across_five_registered_times: true
    normalized_regret_margin: 0.10
    minimum_time_inclusion_probability: 0.90
    practically_flat_prominence_floor: 0.01
    minimum_flat_posterior_probability_for_invalid: 0.90
    empty_peak_set_action: INVALID_UNRESOLVED_POSTERIOR_PEAK_SET
    boundary_including_peak_set_action: INVALID_CENSORED_BY_EVENT_WINDOW
    missing_registered_denominator_action: INVALID
    contiguous_interior_set_action: SET_IDENTIFIED
    noncontiguous_interior_set_action: SET_IDENTIFIED_MULTIMODAL
    earliest_argmax_tie_break: FORBIDDEN
  field_aggregation:
    field_count: 4
    episodes_per_field: 8
    minimum_valid_episodes_per_field: 4
    preserve_field_vector: true
    field_interval: MEAN_OF_VALID_EPISODE_GAP_LOWERS_AND_UPPERS
    field_balanced_interval_hull: SECONDARY_MEAN_OF_FOUR_FIELD_BOUNDS
    binary_pass_fail_decision: FORBIDDEN
  descriptive_direction_state:
    meaningful_positive_floor_cohort_years: 1.0
    unanimous_meaningful_positive: EVERY_FIELD_LOWER_AT_LEAST_FLOOR
    unanimous_nonpositive: EVERY_FIELD_UPPER_AT_MOST_ZERO
    otherwise: MIXED_OR_PARTIALLY_IDENTIFIED_NO_BINARY_DECISION

dependence_boundary:
  between_episode: FIELD_VECTOR_PRESERVED_NO_CROSS_FIELD_POOLING
  generator_overdispersion_axis: BETA_BINOMIAL_EPISODE_TIME_PROBABILITY_PERTURBATION
