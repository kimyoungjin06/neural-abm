claims:
  confirmed:
  - id: C79_in_the_linear_world_the_linear_learners_gap_is_the_learner_not_the_evidence
    statement: Refitted on the evidence each fold learner actually saw, the registered linear learner is 0.046 (on
      its own arm's evidence) and 0.053 (on the MLP arm's) worse in probe Brier than the registered MLP in the linear
      world. Swapping the evidence makes no material difference to either learner.
    evidence:
    - source: linear_learner_diagnosis
      pointer: decisions/by_world/linear_fit/source_of_the_gap
      equals: LEARNER
    - source: linear_learner_diagnosis
      pointer: decisions/by_world/linear_fit/learner_gap/on_linear_batch_evidence/low
      greater_than: 0.04
    - source: linear_learner_diagnosis
      pointer: decisions/by_world/linear_fit/evidence_gap/registered_linear/material
      equals: false
    - source: linear_learner_diagnosis
      pointer: decisions/by_world/linear_fit/evidence_gap/registered_mlp/material
      equals: false
  - id: C80_most_of_that_gap_is_the_adam_budget_and_the_rest_the_penalty
    statement: Converging the linear learner's registered objective closes 71% of its gap to the MLP in the linear
      world, and 10x the Adam steps gets almost all of the way there. The converged fit is still 0.013 worse than the
      MLP, outside the registered 0.005 margin. Descriptively, at a 100x weaker penalty the converged fit matches the
      MLP; the MLP reaches a steep slope through products of smaller parameters, which the same L2 penalty charges
      less. The MLP's ranking advantage is only 0.007 in AUC.
    evidence:
    - source: linear_learner_diagnosis
      pointer: decisions/by_world/linear_fit/optimization
      equals: PARTLY_OPTIMIZATION
    - source: linear_learner_diagnosis
      pointer: post_hoc_descriptive/share_of_the_gap_closed_by_convergence_on_the_linear_arms_evidence
      greater_than: 0.7
    - source: linear_learner_diagnosis
      pointer: decisions/by_world/linear_fit/converged_linear_minus_mlp/low
      greater_than: 0.005
    - source: linear_learner_diagnosis
      pointer: post_hoc_descriptive/weak_penalty_converged_minus_registered_mlp/high
      less_than: 0.0
    - source: linear_learner_diagnosis
      pointer: post_hoc_descriptive/epochs_x10_minus_converged/high
      less_than: 0.001
    - source: linear_learner_diagnosis
      pointer: decisions/by_world/linear_fit/mlp_minus_linear_auc_on_linear_evidence/high
      less_than: 0.01
  - id: C81_in_the_interaction_worlds_the_mlps_edge_is_the_policy_class
    statement: In the smooth and axis interaction worlds, where the linear policy is misspecified, converging the
      linear learner changes its Brier by about 0.001, and the MLP ranks far better (AUC higher by 0.18 and 0.19).
      There the MLP's edge is its policy class.
    evidence:
    - source: linear_learner_diagnosis
      pointer: decisions/by_world/smooth_interaction_fit/optimization
      equals: NOT_OPTIMIZATION
    - source: linear_learner_diagnosis
      pointer: decisions/by_world/axis_interaction_fit/optimization
      equals: NOT_OPTIMIZATION
    - source: linear_learner_diagnosis
      pointer: decisions/by_world/smooth_interaction_fit/mlp_minus_linear_auc_on_linear_evidence/low
      greater_than: 0.15
    - source: linear_learner_diagnosis
      pointer: decisions/by_world/axis_interaction_fit/mlp_minus_linear_auc_on_linear_evidence/low
      greater_than: 0.15
  - id: C82_the_diagnosis_reproduced_with_exact_refit_parity
    statement: The diagnosis reproduced byte for byte. Each source arm's registered refit on every recorded fold
      buffer reproduced the run's probe output exactly, and every converged fit reached the gradient tolerance.
    evidence:
    - source: linear_learner_diagnosis
      pointer: checks
      equals: PASS_REFIT_PARITY_PROBE_BRIER_PARITY_AND_CONVERGENCE
    - source: linear_learner_diagnosis
      pointer: reproduction/byte_identical/runs.jsonl
      equals: true
    - source: linear_learner_diagnosis
      pointer: reproduction/byte_identical/scorecard.json
      equals: true
  rejected:
  - id: R23_the_linear_learners_gap_is_its_optimization_budget_alone
    statement: The diagnosis's expectation stated before the run (E2), that the linear learner converged under its
      registered objective is non-inferior to the MLP within 0.005 in the linear world.
    reason: Converging closes 71% of the gap. The rest comes from the registered weight decay, which limits the
      linear parameterization's slope more than the MLP's.
    evidence:
    - source: linear_learner_diagnosis
      pointer: expectations/E2/held
      equals: false
    - source: linear_learner_diagnosis
      pointer: expectations/E1/held
      equals: true
    - source: linear_learner_diagnosis
      pointer: expectations/E3/held
      equals: true
  open:
  - id: O36_capacity_comparisons_with_converged_fits
    question: Do the ladder's capacity conclusions (C08 to C11, C14) hold when every learner's registered objective is
      converged, or when the penalty is set per parameterization rather than shared?
    kind: SYNTHETIC
    priority: 2
    motivation: Under the registered 300-step Adam budget, 71% of the linear learner's gap to the MLP in the linear
      world is unconverged training (C80). The interaction-world edges are the policy class (C81), but no capacity
      comparison has been run with converged fits.
    evidence:
    - source: linear_learner_diagnosis
      pointer: cells/0/source_arm
      equals: linear_batch
    - source: linear_learner_diagnosis
      pointer: cells/0/fits/registered_linear/brier
      greater_than: 0.05
    - source: linear_learner_diagnosis
      pointer: cells/0/fits/linear_converged/brier
      less_than: 0.03
