reporting_rules:
- id: UNVERIFIED_MEASURE
  rule: Information-spread comparisons from study v2 on are on share precision on unverified items, whose
    fact-check is not public at the decision. Study v1's groups are not read.
  carried_from: v10
- id: TRANSFER_WITHIN_ONE_GENERATOR
  rule: '"A table suffices" holds for donors in the same world and in other worlds of the same generator, which
    share the veracity relation. Transfer across relations or domains is not tested.'
  carried_from: v10
- id: RARE_RUN_SPECIFIC_INFORMATION
  rule: The table critique holds only while run-specific information is rare. In the flip study, a four-donor
    table falls behind between a tenth and a quarter of runs carrying it. That is one kind of information and one
    table size.
  carried_from: v10
- id: PRECISION_AND_UTILITY
  rule: Report comparisons that involve an LLM prior under both share precision and the agents' utility, since
    they disagree in 5 of 20 summaries. Utility scores only the sharer's own gain and cost, not the reach of false
    items.
  carried_from: v10
- id: LLM_READOUT
  rule: Name the readout with any LLM-prior result. P0 in Regime A saturated under the inherited clip and is
    nearly constant; without the clip the same answers carry the relation's direction (C58). The X0 table is not
    clipped.
  carried_from: v10
- id: LLM_PRIOR_ATTRIBUTION_BY_REGIME
  rule: Name an LLM prior's calibration (the rule that set its location, and its steepness) with any result about
    it, and attribute its utility cost per regime. With share rates matched in the world, D5's prior costs utility
    through its calibration in Regime A (C68) and through its calibration and the model's answers in Regime B (C69);
    the unclipped prior in Regime B, through the model's answers (C70).
  carried_from: v10
- id: WORLD_MATCHED_ATTRIBUTION
  rule: Attribute a prior's cost to its parts only with each recalibrated prior matched to its source's share rate
    in the world, and report that match beside the comparisons. Under O28's cohort match two of the three costed
    attributions differed (C69, C70). Only the location has been matched in the world; the steepness has not.
  carried_from: v10
- id: SELECTIVITY_MATCHED_PRECISION
  rule: Compare two priors on the precision of whom they admit only beside a comparison at matched selectivity in
    the world, made by shifting one prior's intercept. A more selective prior raises precision without ranking
    better; C22's gain disappeared at matched entry (C75).
  carried_from: v10
- id: INTERVAL_NONINFERIORITY
  rule: Judge non-inferiority by the lower bound of an interval, not by the mean, and name the seed set. Under that
    change C22's dominance count is 2 of 9, against 7 of 9 as recorded (C77).
  carried_from: v10
- id: CONVERGED_CAPACITY_COMPARISON
  rule: Name each learner's training budget with any comparison of policy classes, and report how far its
    registered objective is from convergence. In the linear world, converging the linear learner closes 71% of its
    gap to the MLP (C80); in the interaction worlds the gap is the policy class (C81).
