schema_version: pivot_crossover_prediction.v1
label: pivot_crossover_prediction_v1
status: PRECOMMIT_DESIGN_NO_RESULT_INTERPRETATION
registered_on: '2026-11-02'
experiment: RECOMMENDED_EXPERIMENT_3_STAGE_2_OPENALEX_DISCOVERY_EPISODES
purpose: >-
  Stage 1 registered a rule that places where a table written before the run
  loses to the in-run learner, from between-run heterogeneity and within-run
  evidence measured outside the comparison. It beat two baselines in the
  information-spread generator but missed its accuracy bound, late where
  evidence was scarce (C101, C104). This stage applies the rule to a
  generator we did not build: the OpenAlex discovery episodes. The policy is
  an entrant's chance of a follow-up topic work. A table gives the mean
  follow-up share of k other episodes; the in-episode learner gives the
  episode's own share among entrants whose outcome is already visible. The
  rule predicts, from other episodes only, which of the two has the lower
  Brier score at each table size and evidence level, and it is scored against
  the observed forecasts.
open_items:
  answers: O42_the_crossover_rule_on_openalex_discovery_episodes
  relates_to: O30_tables_across_relations
development_note: >-
  The design was written after reading only these: E4's recorded aggregates
  (920 of 6,291 discovery precise entrants follow up); a count of discovery
  precise entrants by episode and entry quarter, which reads no label; and
  synthetic pilots at that shape with scratch seeds (777, 778, 999, 5, 31, 32, 424242),
  which set the evidence bins and the generator-check thresholds. E4 read
  the discovery labels once and reported pooled aggregates only; no
  per-episode share was computed or seen before this freeze.

