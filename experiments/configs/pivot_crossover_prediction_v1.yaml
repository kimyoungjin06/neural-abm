  - scripts/run_pivot_crossover_prediction_v1.py
  - tests/test_pivot_crossover_prediction_v1.py
  - tests/duckdb_overlay_tests.txt
  - scripts/inspect_release_artifacts.py
  - tests/test_release_artifact_inspection.py
