purpose: >-
  Extend the v2 ledger with the model-size ladder (LLM prior pilot v4) and the
  measured LLM-agent reference (N06), and update the positioning: the
  LLM-agent tier is now measured in this design rather than estimated. v1 and
  v2 remain the records for everything before; this ledger adds to them.

