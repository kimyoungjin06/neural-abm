schema_version: info_spread_crossover_prediction.v1
label: info_spread_crossover_prediction_v1
status: PRECOMMIT_DESIGN_NO_RESULT_INTERPRETATION
registered_on: '2026-10-30'
experiment: RECOMMENDED_EXPERIMENT_3_STAGE_1_SYNTHETIC
purpose: >-
  The flip-rate study (O26) found that the in-run learner L0 overtakes the
  four-donor table T0-4 between flip rates 0.1 and 0.25, and the one-donor
  table already at 0.1. That is one evidence level and one table size. This
  study registers a rule that predicts where a k-donor trajectory table is
  overtaken, from between-run heterogeneity and within-run evidence measured
  in runs with one fixed sign, and tests it at visibilities, table sizes, and
  flip rates that O26 did not run. Stage 2, a separate precommit, applies the
  rule to OpenAlex discovery episodes.
open_items:
  answers_in_part: O29_the_onset_with_larger_tables_and_shifts_within_a_run
  answered_part: THE_TABLE_SIZE_HALF
  not_answered: SHIFTS_WITHIN_A_RUN
  stage_2_relates_to: O30_tables_across_relations
development_note: >-
  The rule was written with O26's onsets in view: its k = 1 and k = 4
  implications at visibility 0.5 match them qualitatively. It has no fitted
  parameter, and no measurement or comparison of this study was run before
  this freeze. A timing pilot on scratch seeds printed timings only. A
  smoke-profile run (60 agents, 20 steps) went through the scoring code to
  exercise it; nothing in the design changed after it.

