claim_boundary: >-
  This additive API-only successor records that human review and human
  calibration are not run by design, freezes a simple past-only
  observable-history new-topic pivot definition, and converts the frozen
  384-title result into 197 strict API-consensus candidates plus 187 unresolved
  quarantined rows. API consensus is not ground truth. The 384 titles are a
  diagnostic sample, not the candidate universe. Topic cards, a complete
  candidate-universe API screen, paid submission authorization, deterministic
  episode reselection, author-panel rebuilding, production pivot
  classification, outcomes, D0 completion, G0, model fitting, G4, and
  scientific effects remain not run, unauthorized, incomplete, sealed, or not
  established.
