reporting_rules:
- id: UNVERIFIED_MEASURE
  rule: Information-spread comparisons from study v2 on are on share precision on unverified items, whose
    fact-check is not public at the decision. Study v1's groups are not read.
- id: SAME_WORLD_DONORS
  rule: '"A table suffices" holds for tables whose donor runs used the same world. Transfer across worlds is not
    tested.'
- id: PRECISION_IS_NOT_UTILITY
  rule: Share precision rewards selectivity and is not the agents' utility. Report share counts beside it when a
    comparison may turn on selectivity.
- id: LLM_READOUT
  rule: P0 in Regime A saturated under the inherited clip and is nearly constant. Do not read it as the model's
    knowledge. The X0 table is not clipped.
