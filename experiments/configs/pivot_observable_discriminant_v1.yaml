status: PRECOMMIT_DESIGN_NO_RESULT_INTERPRETATION
purpose:
  primary_goal: FIND_WHICH_DATA_OBSERVABLE_IF_ANY_TRACKS_THE_ENTRY_CHANNEL_STATUS_BEFORE_THE_EMPIRICAL_STAGE
  question: The post-failure entry share separated the N01 cells, but it needs the time of the first public
    failure, which data cannot see. Under an attention-surge clock that puts the entry peak inside the
    window, does it still classify the entry channel out of sample, and does any candidate computable
    from entry timing, cohort persistence, or entrant attributes separate the same cells?
  next_step_id: N05
  answers: O08_post_failure_entry_share_as_the_t01_discriminant
  user_decision: USER_CHOSE_THE_OBSERVABLE_SEARCH_AFTER_THE_N01_SCREEN_FOUND_NO_OBSERVABLE_PROXY
  result_informed_successor: true
  pre_freeze_screen:
    status: POST_HOC_ON_RECORDED_N01_ROWS_BEFORE_THIS_FREEZE
    separating:
    - post_failure_entry_share
    not_separating:
    - post_decline_entry_share
    - post_first_cohort_entry_share
    - cohort_persistence_drop
    - post_peak_entry_share
    not_computable_from_n01_rows:
    - attribute_selection_trend
    - outcome_selection_trend
