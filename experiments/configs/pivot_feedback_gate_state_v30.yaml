abstract_review_contract:
  target_topic_name: Hepatitis C virus research
  target_definition: >-
    A work is on topic when its abstract shows that the objective, population,
    exposure, intervention, diagnostic test, analysis, or primary findings
    substantively concern hepatitis C, HCV, hepacivirus, or historically
    specific non-A/non-B hepatitis. HCV may be one of several explicitly
    measured primary infections. A work is off topic when the abstract
    substantively concerns another condition and contains no such hepatitis-C
    role, or mentions it only incidentally or as background.
  exact_review_rows: 5
  visible_fields: [item_id, target_topic_name, target_definition, title, language, work_type, abstract]
  forbidden_fields:
    - openalex_id
    - publication_year
    - source_name
    - primary_topic_name
    - primary_topic_score
    - author
    - citation
    - outcomes
    - field_candidate_rank
  labels: [ON_TOPIC, AMBIGUOUS, OFF_TOPIC, UNREVIEWABLE]
  confidence_levels: [HIGH, MEDIUM, LOW]
  consensus_accept: BOTH_LABEL_ON_TOPIC_AND_CONFIDENCE_HIGH
  consensus_reject: BOTH_LABEL_OFF_TOPIC_AND_CONFIDENCE_HIGH
  all_other_results: REMAIN_UNRESOLVED
  provider_calls: 2
  retries: 0
  human_review: NOT_RUN_BY_DESIGN
  provider_labels_are_ground_truth: false

