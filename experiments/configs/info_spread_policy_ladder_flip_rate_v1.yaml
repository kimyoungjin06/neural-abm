study_v2:
  contract: experiments/configs/info_spread_policy_ladder_study_v2.yaml
  reused: WORLD SPEC, PROFILES, LEARNERS AND THEIR SETTINGS, OBSERVABILITY, DONOR REPLICATES, MEASURE, AND RULE
arms:
- F1
- T0_1
- T0_4
- L0
comparisons:
  closed_loop: [L0, T0_1]
  best_table: [L0, T0_4]
  hand_rule: [L0, F1]
design:
  geometry: linear
  flip_rates: [0.0, 0.1, 0.25, 0.5]
  families:
    A: [linear_exact, mlp]
    B: [partial_linear_exact, partial_mlp]
  groups: 16
  stream: THE PROTOTYPE'S STREAM WITH THE CREDIBILITY WEIGHT +3 OR -3; REVERSED WHEN THE PROTOTYPE'S KEYED SIGN UNIFORM
    U >= 1 - P, SO P = 0 IS THE STATIONARY STREAM AND P = 0.5 IS THE POS-SIGN STREAM
  donors: STUDY V2'S DONOR REPLICATES (1000-1003), EACH DRAWING ITS OWN SIGN AT THE SAME FLIP RATE
  pairing: THE SAME WORLD, ITEM FEATURES, AND LEARNER SEEDS AT EVERY FLIP RATE OF A CELL
seeds:
  world_seed_offset: 11000
  learner_seeds: STUDY V2'S (LEARNER TAG 9) WITH THE CELL INDEX AND GEOMETRY INDEX 0
  rule_tag: 11
measures:
  primary: unverified_share_precision (study v2's)
  recorded: share_precision
rule:
  comparison: paired difference in the primary measure
  minimum_effect: 0.01
  bootstrap_resamples: 2000
  interval: 0.95
  resampling: cells, with replacement
  material: interval excludes zero and |mean cell delta| >= minimum_effect
dispositions:
  per_family: THE ONSET, THE SMALLEST FLIP RATE AT WHICH L0 - T0_4 IS MATERIAL AND POSITIVE, OR NONE_UP_TO_0.5
  reported_with_it: THE LABEL OF EVERY COMPARISON AT EVERY FLIP RATE
  design_check: L0 - T0_1 MUST BE MATERIAL AND POSITIVE AT P = 0.5 IN ALL FOUR FAMILIES (THE POS-SIGN CONTROL INSIDE
    THE STUDY); OTHERWISE POSITIVE_CONTROL_FAILS_AT_0.5 AND THE ONSETS ARE NOT READ
  expected_before_the_run: 'At p = 0 the four-donor table beats or matches L0, as in study v2; at p = 0.5 L0 beats it,
    as in D2d. The onset is not predicted.'
precommit:
  precommit_paths:
  - docs/research/info-spread-policy-ladder-flip-rate-v1.md
