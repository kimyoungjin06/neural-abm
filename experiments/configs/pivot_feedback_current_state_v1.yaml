claim_boundary: >-
  This milestone successor activates the independently validated six-phase
  routing and binds the independently validated, outcome-blind G1 replication
  tolerance into the thirteen-choice pre-G1 registry. It moves six G2/G3
  choices and two G2/G3 sections to their registered just-in-time boundaries.
  D and C are complete only in their bounded source, structure, discovery
  measurement, and descriptive roles. F remains incomplete until all thirteen
  pre-G1 sections, final-panel conformance, atomic partitions, and a byte-level
  holdout seal are complete. This authority does not pass F or G0, read a
  confirmatory or holdout row, run G1, fit a model, open G4, establish
  transport, establish causality, or establish a scientific effect.
