run:
  name: toy_validation_representative_toy1_10_social_calibrated_seeds01_03_toy6_categorical_output_average
  seed: 3
  output_dir: experiments/runs
simulation:
  epochs: 50
  sync_mode: synchronous
  device: cpu
model:
  policy:
    rule: categorical_learning
    learning_rate: 0.15
    revision_rate: 1.0
    temperature: 1.0
    decision_mode: sampled
  agents:
    init_mode: independent_init
    logit_noise: 0.1
  coordination:
    mixer: output_average
    peer_rule: output_similarity
    alpha: 0.25
    threshold: 0.0
domain:
  toy: toy6
  environment:
    grid_width: 10
    grid_height: 10
    initial_strategy_probabilities:
    - 0.34
    - 0.33
    - 0.33
    reward_ema_decay: 0.9
  game:
    strategy_count: 3
    win_payoff: 1.0
    loss_payoff: -1.0
    draw_payoff: 0.0
  graph:
    type: grid
    neighborhood: von_neumann
    periodic: true
logging:
  micro_state: true
  interval: 1
  aggregate_metrics: true
  probe_predictions: false
  probe_prediction_interval: 1
