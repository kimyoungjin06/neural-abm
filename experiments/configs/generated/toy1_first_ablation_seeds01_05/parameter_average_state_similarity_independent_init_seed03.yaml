run:
  name: toy1_first_ablation_seeds01_05_parameter_average_state_similarity_independent_init
  seed: 3
  output_dir: experiments/runs
simulation:
  epochs: 50
  sync_mode: synchronous
  device: cpu
model:
  agents:
    count: 50
    init_mode: independent_init
    model:
      input_dim: 2
      hidden_dim: 16
      output_dim: 2
      activation: relu
    optimizer:
      name: adam
      learning_rate: 0.01
    training:
      local_batch_size: 64
      local_steps_per_epoch: 1
    shards:
      policy: five_group_bias
      groups:
        left_region:
          count: 10
          samples_per_agent: 600
        right_region:
          count: 10
          samples_per_agent: 600
        boundary_region:
          count: 10
          samples_per_agent: 600
        noisy_labels:
          count: 10
          samples_per_agent: 600
          label_noise: 0.2
        small_balanced:
          count: 10
          samples_per_agent: 150
  coordination:
    mixer: parameter_average
    peer_rule: state_similarity
    alpha: 0.25
    threshold: 0.8
    communication_budget:
      probe_predictions: 512
      latent_dim: 16
      scalar_summary: 8
domain:
  toy: toy1
  data:
    boundary: sine
    label_noise: 0.02
    train_pool_size: 20000
    probe_size: 512
    test_size: 5000
  graph:
    type: watts_strogatz
    k: 6
    rewire_probability: 0.1
logging:
  micro_state: true
  interval: 1
  aggregate_metrics: true
