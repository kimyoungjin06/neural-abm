run:
  name: toy8_async_sensitivity_seeds01_05_ia0p25_if0_ba0p02_pa0p15_fr0p03_of0p08_rr0p01_k4_rw0p1_output_average_output_similarity_a0_t0
  seed: 5
  output_dir: experiments/runs
simulation:
  epochs: 25
  sync_mode: synchronous
  device: cpu
model:
  policy:
    rule: event_hazard
  agents:
    count: 100
  coordination:
    mixer: output_average
    peer_rule: output_similarity
    alpha: 0.0
    threshold: 0.0
domain:
  toy: toy8
  environment:
    initial_active_fraction: 0.25
    initial_failed_fraction: 0.0
    base_activation_rate: 0.02
    peer_activation_rate: 0.15
    failure_rate: 0.03
    overload_failure_rate: 0.08
    recovery_rate: 0.01
    max_time: 50.0
  graph:
    type: watts_strogatz
    k: 4
    rewire_probability: 0.1
logging:
  micro_state: true
  interval: 1
  aggregate_metrics: true
  probe_predictions: false
  probe_prediction_interval: 1
