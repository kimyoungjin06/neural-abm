run:
  name: toy5_neural_threshold_target_wavefront_stress_quick_toy5_threshold_target_lattice_k4_heterogeneous_h0p85_wavefront_spread_neural_threshold_target_lattice_k4_heterogeneous_h0p85_output_average
  seed: 2
  output_dir: experiments/runs
simulation:
  epochs: 50
  sync_mode: synchronous
  device: cpu
model:
  policy:
    rule: neural_policy
    learning_enabled: true
    revision_rate: 1.0
    temperature: 1.0
    decision:
      mode: argmax
      action_temperature: 1.0
      exploration_epsilon: 0.0
    domain:
      repeated_exposure_decay: 0.0
      adoption_is_absorbing: true
      local_update_rule: threshold_target
    neural_update_backend: tensor_batched
  agents:
    count: 100
    init_mode: same_init
    model:
      input_dim: 6
      hidden_dim: 16
      output_dim: 2
      activation: relu
    optimizer:
      name: adam
      learning_rate: 0.01
    policy_prior_action_probability: 0.49
  coordination:
    mixer: output_average
    peer_rule: output_similarity
    alpha: 0.25
    threshold: -1.0
  state:
    reputation:
      enabled: true
      decay: 0.9
      peer_rule: spatial
      temperature: 1.0
      noise: 0.0
      observation_mode: none
    mobility:
      enabled: false
      rate: 0.0
      candidate_pool_size: 8
      selection_rule: local_quality
      move_cost: 0.0
domain:
  toy: toy5
  environment:
    initial_action_fraction: 0.01
    seed_selection: first_agent
    threshold_mode: heterogeneous
    homogeneous_threshold: 0.25
    heterogeneous_threshold_low: 0.35
    heterogeneous_threshold_high: 0.85
    simple_contagion_probability: 0.08
  graph:
    type: watts_strogatz
    k: 4
    rewire_probability: 0.0
logging:
  micro_state: true
  interval: 1
  aggregate_metrics: true
  probe_predictions: false
  probe_prediction_interval: 1
