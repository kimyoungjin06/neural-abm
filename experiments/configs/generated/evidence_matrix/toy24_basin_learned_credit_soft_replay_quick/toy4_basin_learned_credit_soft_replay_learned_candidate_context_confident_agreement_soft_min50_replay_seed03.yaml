run:
  name: toy24_basin_learned_credit_soft_replay_quick_toy4_basin_learned_credit_soft_replay_learned_candidate_context_confident_agreement_soft_min50_replay
  seed: 3
  output_dir: experiments/runs
simulation:
  epochs: 50
  sync_mode: synchronous
  device: cpu
model:
  policy:
    rule: neural_policy
    learning_enabled: true
    revision_rate: 1.0
    selection_strength: 1.0
    temperature: 1.0
    decision:
      mode: sampled
      action_temperature: 1.0
      exploration_epsilon: 0.0
    domain:
      basin_credit:
        learned_credit_replay_selection: confident_agreement
        learned_credit_replay_mode: soft_attention
        learned_credit_replay_soft_min_weight: 0.5
        learned_credit_replay_soft_disagreement_weight: 0.25
        enabled: true
        critic: prototype_phase
        credit_method: one_step_ablation
        objective_weight: 0.5
        individual_weight: 0.0
        local_social_weight: 0.0
        basin_weight: 0.5
        horizon: 1
        target_basin: ceiling
        training_scope: all
        training_passes: 3
        training_pass_schedule: credit_signal_escalation
        min_training_passes: 2
        training_pass_credit_positive_threshold: 0.6
        training_pass_credit_delta_threshold: 0.0
        learned_credit_enabled: true
        learned_credit_model_path: experiments/results/basin_critic/toy24_basin_phase_critic_candidate_context_quick/toy24_basin_phase_critic_candidate_context_quick_toy4_basin_phase_critic_candidate_context_model.npz
        learned_credit_abstention_margin_threshold: 0.005
        learned_credit_uncertainty_threshold: 0.05
        learned_credit_fallback: prototype
      objective:
        profile: linear_welfare_heavy
        clip_abs: null
    neural_update_backend: loop
  agents:
    init_mode: independent_init
    model:
      input_dim: 6
      hidden_dim: 16
      output_dim: 2
      activation: relu
    optimizer:
      name: adam
      learning_rate: 0.01
  coordination:
    mixer: output_average
    peer_rule: output_similarity
    alpha: 0.25
    threshold: 0.0
  state:
    reputation:
      enabled: true
      decay: 0.9
      peer_rule: spatial
      temperature: 1.0
      noise: 0.0
      observation_mode: none
    mobility:
      enabled: false
      rate: 0.0
      candidate_pool_size: 8
      selection_rule: local_quality
      move_cost: 0.0
domain:
  toy: toy4
  environment:
    grid_width: 10
    grid_height: 10
    initial_action_probability: 0.5
    reward_ema_decay: 0.9
    entropy_beta: 0.01
    resource_enabled: false
    resource_initial: 100.0
    resource_carrying_capacity: 100.0
    resource_recovery_rate: 0.05
    resource_extraction_per_defector: 1.0
    resource_collapse_threshold: 0.0
  game:
    multiplier: 1.6
    contribution_cost: 1.0
    group_mode: local_neighborhood
  graph:
    type: grid
    neighborhood: von_neumann
    periodic: true
logging:
  micro_state: true
  interval: 1
  aggregate_metrics: true
  probe_predictions: false
  probe_prediction_interval: 1
