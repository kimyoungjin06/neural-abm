run:
  name: toy24_decision_bootstrap_quick_toy2_decision_bootstrap_target_decision_bootstrap_w1p0_e3_linear_welfare
  seed: 2
  output_dir: experiments/runs
simulation:
  epochs: 50
  sync_mode: synchronous
  device: cpu
model:
  policy:
    rule: neural_policy
    learning_enabled: true
    revision_rate: 1.0
    selection_strength: 1.0
    temperature: 1.0
    decision:
      mode: sampled
      action_temperature: 1.0
      exploration_epsilon: 0.0
      calibration:
        mode: none
        strength: 4.0
    domain:
      local_update_rule: counterfactual_advantage
      neural_peer_mode: spatial
      interaction_mode: spatial
      payoff_transform: linear
      objective:
        profile: linear_welfare_heavy
        clip_abs: null
      bootstrap:
        enabled: true
        weight: 1.0
        epochs: 3
        decay: linear
        decision_enabled: true
        decision_weight: 1.0
        decision_epochs: 3
        decision_decay: linear
    neural_update_backend: loop
  agents:
    init_mode: independent_init
    model:
      input_dim: 6
      hidden_dim: 16
      output_dim: 2
      activation: relu
    optimizer:
      name: adam
      learning_rate: 0.01
    policy_prior_action_probability: null
  coordination:
    mixer: output_average
    peer_rule: output_similarity
    alpha: 0.25
    threshold: 0.0
    communication_budget:
      probe_predictions: 1
      latent_dim: 16
      scalar_summary: 8
  state:
    reputation:
      enabled: true
      decay: 0.9
      peer_rule: spatial
      temperature: 1.0
      noise: 0.0
      observation_mode: none
    mobility:
      enabled: false
      rate: 0.0
      candidate_pool_size: 8
      selection_rule: local_quality
      move_cost: 0.0
domain:
  toy: toy2
  environment:
    grid_width: 10
    grid_height: 10
    neighborhood: von_neumann
    periodic: true
    initial_action_probability: 0.5
    reward_ema_decay: 0.9
    entropy_beta: 0.01
    payoff_R: 3.0
    payoff_S: 0.0
    payoff_T: 5.0
    payoff_P: 1.0
  game:
    family: prisoner_dilemma
    payoff:
      T: 5.0
      R: 3.0
      P: 1.0
      S: 0.0
logging:
  micro_state: true
  interval: 1
  aggregate_metrics: true
  probe_predictions: false
  probe_prediction_interval: 1
