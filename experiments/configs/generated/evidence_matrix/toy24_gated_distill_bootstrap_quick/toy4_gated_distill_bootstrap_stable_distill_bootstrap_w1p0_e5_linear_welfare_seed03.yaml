run:
  name: toy24_gated_distill_bootstrap_quick_toy4_gated_distill_bootstrap_stable_distill_bootstrap_w1p0_e5_linear_welfare
  seed: 3
  output_dir: experiments/runs
simulation:
  epochs: 50
  sync_mode: synchronous
  device: cpu
model:
  policy:
    rule: neural_policy
    learning_enabled: true
    revision_rate: 1.0
    selection_strength: 1.0
    temperature: 1.0
    decision:
      mode: sampled
      action_temperature: 1.0
      exploration_epsilon: 0.0
    domain:
      objective:
        profile: linear_welfare_heavy
        clip_abs: null
      bootstrap:
        distill_enabled: true
        distill_weight: 1.0
        distill_epochs: 5
        distill_decay: linear
        distill_loss: bce
        distill_scope: all
        distill_stable_teacher_only: true
        distill_teacher_margin_min: 0.0
    neural_update_backend: loop
  agents:
    init_mode: independent_init
    model:
      input_dim: 6
      hidden_dim: 16
      output_dim: 2
      activation: relu
    optimizer:
      name: adam
      learning_rate: 0.01
  coordination:
    mixer: output_average
    peer_rule: output_similarity
    alpha: 0.25
    threshold: 0.0
  state:
    reputation:
      enabled: true
      decay: 0.9
      peer_rule: spatial
      temperature: 1.0
      noise: 0.0
      observation_mode: none
    mobility:
      enabled: false
      rate: 0.0
      candidate_pool_size: 8
      selection_rule: local_quality
      move_cost: 0.0
domain:
  toy: toy4
  environment:
    grid_width: 10
    grid_height: 10
    initial_action_probability: 0.5
    reward_ema_decay: 0.9
    entropy_beta: 0.01
    resource_enabled: false
    resource_initial: 100.0
    resource_carrying_capacity: 100.0
    resource_recovery_rate: 0.05
    resource_extraction_per_defector: 1.0
    resource_collapse_threshold: 0.0
  game:
    multiplier: 1.6
    contribution_cost: 1.0
    group_mode: local_neighborhood
  graph:
    type: grid
    neighborhood: von_neumann
    periodic: true
logging:
  micro_state: true
  interval: 1
  aggregate_metrics: true
  probe_predictions: false
  probe_prediction_interval: 1
