run:
  name: toy24_precommitment_peer_evidence_domain_uncertainty_calibration_quick_toy2_precommitment_peer_evidence_stag_hunt_calibration_revision_objective_basin_stag_hunt_p0p35
  seed: 3
  output_dir: experiments/runs
simulation:
  epochs: 60
  sync_mode: synchronous
  device: cpu
model:
  policy:
    rule: neural_policy
    learning_enabled: true
    revision_rate: 1.0
    selection_strength: 1.0
    temperature: 1.0
    decision:
      mode: sampled
      action_temperature: 1.0
      exploration_epsilon: 0.0
      calibration:
        mode: none
        strength: 4.0
    domain:
      local_update_rule: counterfactual_advantage
      neural_peer_mode: spatial
      interaction_mode: spatial
      payoff_transform: linear
      objective:
        profile: linear_welfare_heavy
        clip_abs: null
      basin_credit:
        enabled: true
        critic: prototype_phase
        credit_method: one_step_ablation
        objective_weight: 0.5
        individual_weight: 0.0
        local_social_weight: 0.0
        basin_weight: 0.5
        horizon: 1
        target_basin: ceiling
    neural_update_backend: loop
  agents:
    init_mode: independent_init
    model:
      input_dim: 6
      hidden_dim: 16
      output_dim: 2
      activation: relu
    optimizer:
      name: adam
      learning_rate: 0.01
    policy_prior_action_probability: null
  coordination:
    mixer: output_average
    peer_rule: output_similarity
    alpha: 0.25
    threshold: 0.0
    communication_budget:
      probe_predictions: 1
      latent_dim: 16
      scalar_summary: 8
    revision_operator_enabled: true
    revision_operator_source: policy_probability
  state:
    reputation:
      enabled: true
      decay: 0.9
      peer_rule: spatial
      temperature: 1.0
      noise: 0.0
      observation_mode: none
    mobility:
      enabled: false
      rate: 0.0
      candidate_pool_size: 8
      selection_rule: local_quality
      move_cost: 0.0
domain:
  toy: toy2
  environment:
    grid_width: 10
    grid_height: 10
    neighborhood: von_neumann
    periodic: true
    initial_action_probability: 0.35
    reward_ema_decay: 0.9
    entropy_beta: 0.01
    payoff_R: 4.0
    payoff_S: 0.0
    payoff_T: 3.0
    payoff_P: 2.0
  game:
    family: stag_hunt
    payoff:
      T: 3.0
      R: 4.0
      P: 2.0
      S: 0.0
logging:
  micro_state: true
  interval: 1
  aggregate_metrics: true
  probe_predictions: false
  probe_prediction_interval: 1
