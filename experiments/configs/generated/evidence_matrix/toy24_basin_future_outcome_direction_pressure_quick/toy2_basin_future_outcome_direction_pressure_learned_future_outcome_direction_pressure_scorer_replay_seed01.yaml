run:
  name: toy24_basin_future_outcome_direction_pressure_quick_toy2_basin_future_outcome_direction_pressure_learned_future_outcome_direction_pressure_scorer_replay
  seed: 1
  output_dir: experiments/runs
simulation:
  epochs: 50
  sync_mode: synchronous
  device: cpu
model:
  policy:
    rule: neural_policy
    learning_enabled: true
    revision_rate: 1.0
    selection_strength: 1.0
    temperature: 1.0
    decision:
      mode: sampled
      action_temperature: 1.0
      exploration_epsilon: 0.0
      calibration:
        mode: none
        strength: 4.0
    domain:
      local_update_rule: counterfactual_advantage
      neural_peer_mode: spatial
      interaction_mode: spatial
      payoff_transform: linear
      objective:
        profile: linear_welfare_heavy
        clip_abs: null
      basin_credit:
        enabled: true
        critic: prototype_phase
        credit_method: one_step_ablation
        objective_weight: 0.5
        individual_weight: 0.0
        local_social_weight: 0.0
        basin_weight: 0.5
        horizon: 1
        target_basin: ceiling
        training_scope: all
        training_passes: 3
        training_pass_schedule: credit_signal_escalation
        min_training_passes: 2
        training_pass_credit_positive_threshold: 0.6
        training_pass_credit_delta_threshold: 0.0
        learned_credit_enabled: true
        learned_credit_model_path: experiments/results/basin_critic/toy24_basin_phase_critic_future_outcome_direction_quick/toy24_basin_phase_critic_future_outcome_direction_quick_toy2_basin_phase_critic_future_outcome_direction_model.npz
        learned_credit_abstention_margin_threshold: 0.005
        learned_credit_uncertainty_threshold: 0.05
        learned_credit_fallback: prototype
        learned_credit_replay_mode: learned_weight
        learned_credit_replay_weight_model_path: experiments/results/basin_critic/toy24_basin_replay_pressure_scorer_h5_q99_quick/toy24_basin_replay_pressure_scorer_h5_q99_quick_toy2_basin_replay_weight_scorer_model.npz
    neural_update_backend: loop
  agents:
    init_mode: independent_init
    model:
      input_dim: 6
      hidden_dim: 16
      output_dim: 2
      activation: relu
    optimizer:
      name: adam
      learning_rate: 0.01
    policy_prior_action_probability: null
  coordination:
    mixer: output_average
    peer_rule: output_similarity
    alpha: 0.25
    threshold: 0.0
    communication_budget:
      probe_predictions: 1
      latent_dim: 16
      scalar_summary: 8
  state:
    reputation:
      enabled: true
      decay: 0.9
      peer_rule: spatial
      temperature: 1.0
      noise: 0.0
      observation_mode: none
    mobility:
      enabled: false
      rate: 0.0
      candidate_pool_size: 8
      selection_rule: local_quality
      move_cost: 0.0
domain:
  toy: toy2
  environment:
    grid_width: 10
    grid_height: 10
    neighborhood: von_neumann
    periodic: true
    initial_action_probability: 0.5
    reward_ema_decay: 0.9
    entropy_beta: 0.01
    payoff_R: 3.0
    payoff_S: 0.0
    payoff_T: 5.0
    payoff_P: 1.0
  game:
    family: prisoner_dilemma
    payoff:
      T: 5.0
      R: 3.0
      P: 1.0
      S: 0.0
logging:
  micro_state: true
  interval: 1
  aggregate_metrics: true
  probe_predictions: false
  probe_prediction_interval: 1
