run:
  name: toy5_neural_threshold_target_threshold_aware_grid_quick_toy5_threshold_aware_grid_no_seed_heterogeneous_safety_neural_threshold_aware_grid_no_seed_threshold_anchor
  seed: 5
  output_dir: experiments/runs
simulation:
  epochs: 20
  sync_mode: synchronous
  device: cpu
model:
  policy:
    rule: neural_policy
    learning_enabled: true
    revision_rate: 1.0
    temperature: 1.0
    decision:
      mode: argmax
      action_temperature: 1.0
      exploration_epsilon: 0.0
    domain:
      repeated_exposure_decay: 0.0
      adoption_is_absorbing: true
      local_update_rule: threshold_target
    neural_update_backend: tensor_batched
  agents:
    count: 100
    init_mode: same_init
    model:
      input_dim: 6
      hidden_dim: 16
      output_dim: 2
      activation: relu
    optimizer:
      name: adam
      learning_rate: 0.01
    policy_prior_action_probability: 0.49
  coordination:
    mixer: output_average
    peer_rule: output_similarity
    alpha: 0.25
    threshold: -1.0
    precommitment_direction_source: readiness_augmented_threshold_with_action_anchor
    precommitment_enabled: true
    precommitment_min_policy_probability: 0.5
    precommitment_min_evidence: 1.5
    precommitment_evidence_increment: 1.0
    precommitment_evidence_decay: 0.5
    precommitment_requires_direction: true
    precommitment_min_direction: 0.0
    precommitment_readiness_direction_weight: 2.0
    precommitment_peer_evidence_enabled: true
    precommitment_peer_evidence_weight: 1.0
    precommitment_peer_readiness_aggregation: max
  state:
    reputation:
      enabled: true
      decay: 0.9
      peer_rule: spatial
      temperature: 1.0
      noise: 0.0
      observation_mode: none
    mobility:
      enabled: false
      rate: 0.0
      candidate_pool_size: 8
      selection_rule: local_quality
      move_cost: 0.0
domain:
  toy: toy5
  environment:
    initial_action_fraction: 0.0
    seed_selection: first_agent
    threshold_mode: heterogeneous
    homogeneous_threshold: 0.25
    heterogeneous_threshold_low: 0.15
    heterogeneous_threshold_high: 0.55
    simple_contagion_probability: 0.08
  graph:
    type: watts_strogatz
    k: 6
    rewire_probability: 0.1
logging:
  micro_state: true
  interval: 1
  aggregate_metrics: true
  probe_predictions: false
  probe_prediction_interval: 1
