  component pass may establish exact retained work-ID accounting,
  deterministic numeric partitions, inherited publication-time dispositions,
  and a checksummed local row-level spine commitment. Temporal v3 does not
  publish a row-level disposition artifact or digest, so this component cannot
  claim direct row-by-row artifact identity to the temporal parent. The exact
  temporal-v3 full pass is an input validity and aggregate-disposition parent,
  not a row-level temporal product. This component does not
  establish historical content identity, W0 entity validity, citation edge
