review_contract:
  request_seed: pivot-feedback-d0-t10151-rank5-abstract-cross-provider-v1
  target_topic_name: Hepatitis C virus research
  target_definition: >-
    A work is on topic when its abstract shows that the objective, population,
    exposure, intervention, diagnostic test, analysis, or primary findings
    substantively concern hepatitis C, HCV, hepacivirus, or historically
    specific non-A/non-B hepatitis. HCV may be one of several explicitly
    measured primary infections. A work is off topic when the abstract
    substantively concerns another condition and contains no such hepatitis-C
    role, or mentions it only incidentally or as background.
  prompt_text: |-
    Classify each scholarly work using only the supplied target topic,
    definition, title, language, work type, and abstract. Do not infer or use
    authors, year, source, citations, identifiers outside the opaque item ID,
    OpenAlex topic scores, episode, treatment assignment, outcomes, or
    downstream effects.

    Assign exactly one label and confidence to every item:
    ON_TOPIC: the abstract affirmatively shows that the work substantively
    studies, applies, measures, diagnoses, treats, or analyzes the target.
    This includes historically specific non-A/non-B hepatitis and studies in
    which HCV is one of several explicitly measured primary infections.
    AMBIGUOUS: a plausible relation exists, but abstract evidence is
    insufficient to establish a substantive target role or clear absence.
    OFF_TOPIC: the abstract affirmatively concerns another subject and has no
    substantive target role, or mentions the target only incidentally.
    UNREVIEWABLE: the supplied title and abstract are corrupted,
    uninterpretable, or internally incompatible.

    Be conservative. Return exactly one decision for each supplied opaque
    item_id, with no omissions or duplicates. Keep each rationale concise and
    grounded only in the supplied title and abstract.
  labels: [ON_TOPIC, AMBIGUOUS, OFF_TOPIC, UNREVIEWABLE]
  confidence_levels: [HIGH, MEDIUM, LOW]
  exact_items: 5
  request_visible_fields:
    - item_id
    - target_topic_name
    - target_definition
    - title
    - language
    - work_type
    - abstract
  forbidden_request_fields:
    - openalex_id
    - source_file
    - source_row_group
    - publication_year
    - primary_topic_name
    - primary_topic_score
    - author
    - citation
    - outcomes
  response_fields: [item_id, label, confidence, rationale]
  maximum_rationale_characters: 280
  consensus_accept: BOTH_LABEL_ON_TOPIC_AND_CONFIDENCE_HIGH
  consensus_reject: BOTH_LABEL_OFF_TOPIC_AND_CONFIDENCE_HIGH
  all_other_results: REMAIN_UNRESOLVED
  current_accept_rows: 27
  current_reject_rows: 21
  current_unresolved_rows: 16
  recent_denominator_rows: 64
  pass_lower_bound_rows: 32
  fail_lower_bound_rows: 32
  human_review: NOT_RUN_BY_DESIGN
  provider_labels_are_ground_truth: false
  evidence_role: POST_DIAGNOSTIC_LOCAL_ABSTRACT_AUGMENTATION

