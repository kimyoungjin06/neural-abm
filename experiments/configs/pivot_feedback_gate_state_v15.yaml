claim_boundary: >-
  This additive successor freezes an independently replayed zero-cost
  candidate-level dry-run over the existing 384 titles. Three candidates would
  pass the simple conservative rule and T12505 would fail a joint score/source
  indexing-anomaly rule, but these dry-run states are not production
  dispositions. All four production content states remain unresolved. The
  T12505 signal is stable over the declared accept-threshold grid, while T12421
  is threshold-sensitive. Only a rule decision and targeted-successor design
  are authorized. Raw title scans, new title extraction, API requests, paid
  submission, production dispositions, certificates, reselection, outcomes,
  fitting, G4, and scientific effects remain not run, unauthorized, incomplete,
  sealed, or not established.
