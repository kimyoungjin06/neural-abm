claim_boundary: >-
  This additive API-only successor freezes four conservative topic cards and
  an independently verified zero-cost routing dry-run on the frozen 384-title
  diagnostic sample. The dry-run routes 229 rows to local accept, 24 to local
  reject, 94 to an API exception queue, and 37 to unresolved quarantine,
  avoiding 290 counterfactual API requests. Neither rules nor prior API labels
  are ground truth, and these counts do not establish accuracy. The 70,277
  existing rows are topic-year candidates, not title-bearing candidate works.
  A complete work manifest and complete-manifest local routing may now be built
  without API submission. Paid API screening, response ingestion, production
  dispositions, deterministic episode reselection, author-panel rebuilding,
  production pivot classification, outcomes, D0 completion, G0, fitting, G4,
  and scientific effects remain not run, unauthorized, incomplete, sealed, or
  not established. Human review remains not run by design.
