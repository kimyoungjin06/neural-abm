claim_boundary: >-
  This registry verifies only small repository evidence JSON, explicitly
  supplied operator-local control receipts, and one exact fixed-path bounded
  author-history lineage validator against its config-pinned synthetic fixture. It
  never opens OpenAlex production source payloads, production author or citation
  rows, Parquet data pages, model inputs, or scientific outcomes. Existing
  component passes remain bounded. The relation production receipt is present
  and its narrow primary-exact-score successor component passes; the original
  blocked parent remains immutable lineage evidence. The full canonical
  work-time-spine production receipt is also present and independently verified.
  The full author-history production component now passes only bounded
  current-snapshot author-token accounting; author entities and past
  observability remain explicitly unverified. The citation-chronology production
  component now passes only as a current-snapshot bibliographic-time proxy;
  OpenAlex first-observation time and past researcher visibility remain
  unidentifiable. The normalized cutoff-primitives foundation now passes, but
  candidate eligibility, work-type inclusion, team caps, same-day treatment,
  fixed maturation horizon, sampling, and weights remain for a versioned G0
  successor. It therefore does not satisfy the final cutoff-panel requirement.
  The missing final cutoff-panel, outcome-blind field-structure, and
  representative-pilot receipts still prevent G-1 and G0 promotion.
  The earlier author-history pinned-fixture attestation remains
  nonpromoting synthetic lineage evidence for token-accounting mechanics only;
  its stored stdout bytes are attested only for the declared runtime and are not
  claimed cross-runtime. It is not author-entity validation or a
  historical-observability result.
  This v0 registry can never authorize production or scientific execution or
  emit a passing G-1 decision.
