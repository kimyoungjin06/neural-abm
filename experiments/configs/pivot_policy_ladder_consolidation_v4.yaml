claims:
  confirmed:
  - id: C36_nabm_matches_a_persona_llm_agent
    statement: With the same LLM and exploration floor, the NABM hybrid matches a persona LLM agent that
      decides for itself in all nine cells, and the persona selects better than the hand rule nowhere.
    evidence:
    - source: persona_agent
      pointer: registered_result_disposition/nabm_versus_persona/summary
      equals: NABM_MATCHES_PERSONA_AGENT_IN_ALL_CELLS
    - source: persona_agent
      pointer: registered_result_disposition/persona_versus_hand_precision/summary
      equals: SELECTS_BETTER_NOWHERE
  - id: C37_the_uncalibrated_persona_nearly_seals_itself
    statement: The persona says Yes to pivoting in under 0.2% of questions, never stays after a failed
      pivot, and self-seals in both interaction worlds.
    evidence:
    - source: persona_agent
      pointer: registered_result_disposition/self_sealing_by_world/smooth_interaction_fit/self_sealing
      equals: true
    - source: persona_agent
      pointer: registered_result_disposition/self_sealing_by_world/axis_interaction_fit/self_sealing
      equals: true
    - source: persona_agent
      pointer: phase_a/zero_evidence_yes_share
      equals: 0.0
    - source: persona_agent
      pointer: decision_totals/stay_no
      equals: 1492
  - id: C38_the_post_failure_share_is_near_necessary_not_sufficient
    statement: Under surge clocks the post-failure entry share classifies 18 of 24 cells, with only false
      actives.
    evidence:
    - source: observable_discriminant
      pointer: registered_result_disposition/post_failure_entry_share/disposition
      equals: HOLDS_IN_MOST_CELLS
    - source: observable_discriminant
      pointer: registered_result_disposition/post_failure_entry_share/false_inactive
      equals: 0
    - source: observable_discriminant
      pointer: registered_result_disposition/post_failure_entry_share/false_active
      equals: 6
  - id: C39_persistence_trends_track_the_entry_channel
    statement: 'Two observables from entry timing and persistence separate all N05 cells: later entrants
      persist more when learning acts on entry.'
    evidence:
    - source: observable_discriminant
      pointer: registered_result_disposition/separating_observables
      equals:
      - cohort_persistence_drop
      - outcome_selection_trend
  - id: C40_two_sided_classification_is_not_confirmed
    statement: At thresholds fixed from N05, neither observable classifies every new N08 cell; each mostly
      holds.
    evidence:
    - source: observable_confirmation
      pointer: registered_result_disposition/observable_tests/cohort_persistence_drop/disposition
      equals: HOLDS_IN_MOST_CELLS
    - source: observable_confirmation
      pointer: registered_result_disposition/observable_tests/outcome_selection_trend/disposition
      equals: HOLDS_IN_MOST_CELLS
    - source: observable_confirmation
      pointer: registered_result_disposition/carried_to_the_empirical_stage_as_a_confirmed_discriminant
      equals: []
  - id: C41_the_sufficient_sign_is_confirmed
    statement: 'On new schedule shapes, an observable past its threshold always marked an active channel:
      11 flagged, 0 false actives, for each.'
    evidence:
    - source: observable_one_sided
      pointer: registered_result_disposition/one_sided_tests/outcome_selection_trend/disposition
      equals: SUFFICIENT_SIGN_CONFIRMED
    - source: observable_one_sided
      pointer: registered_result_disposition/one_sided_tests/cohort_persistence_drop/disposition
      equals: SUFFICIENT_SIGN_CONFIRMED
    - source: observable_one_sided
      pointer: registered_result_disposition/one_sided_tests/outcome_selection_trend/false_active
      equals: 0
  - id: C42_the_outcome_selection_trend_is_the_empirical_indicator
    statement: Only the outcome selection trend also passes its no-learning control, so it alone goes
      to the empirical stage, as a one-sided indicator.
    evidence:
    - source: observable_one_sided
      pointer: registered_result_disposition/carried_to_the_empirical_stage_as_a_one_sided_indicator
      equals:
      - outcome_selection_trend
    - source: observable_one_sided
      pointer: registered_result_disposition/no_learning_control_by_observable/outcome_selection_trend
      equals: true
    - source: observable_confirmation
      pointer: registered_result_disposition/no_learning_control/disposition
      equals: CONTROL_READS_INACTIVE_EVERYWHERE
  rejected:
  - id: R09_the_post_failure_share_as_a_discriminant
    statement: The post-failure entry share classifies the entry channel on its own.
    reason: Out of sample it calls inactive cells active (6 in N05), and data cannot observe the time
      of the first public failure.
    evidence:
    - source: observable_discriminant
      pointer: registered_result_disposition/post_failure_entry_share/separates_in_this_study
      equals: DOES_NOT_SEPARATE
  - id: R10_the_persistence_drop_as_a_learning_specific_sign
    statement: A small cohort-persistence drop shows that learning acts on entry.
    reason: Without learning, the fixed rule passes the drop threshold in 8 of 24 N09 cells.
    evidence:
    - source: observable_one_sided
      pointer: registered_result_disposition/no_learning_control_by_observable/cohort_persistence_drop
      equals: false
  - id: R11_only_weak_channels_are_missed
    statement: The observables miss only weak channels (a post-hoc reading of N08).
    reason: N09 misses a cell with two passing family-geometry pairs.
    evidence:
    - source: observable_one_sided
      pointer: post_hoc_descriptive/missed_cells_passing_pairs/hazard_q0p15~1failure_lag_4
      equals: 2
  open:
  - id: O17_empirical_persistence_definition_and_threshold_transfer
    question: How should persistence and its horizon be defined in OpenAlex so that the model-scale threshold
      of the outcome selection trend transfers?
    kind: EMPIRICAL
    priority: 1
  - id: O18_empirical_source_choice
    question: Finish the 2026-06-26 snapshot (35 GB left) or amend the lean H3 design to use the local
      2026-03-30 snapshot and its G1 derived tables, excluding 2013-2016 G1 episodes and 2020-2022 G4?
    kind: EMPIRICAL
    priority: 1
    motivation: USER_DECISION_PENDING_SINCE_2026_10_07
  - id: O19_sensitivity_of_the_one_sided_indicator
    question: What lowers sensitivity below 85%, and can a registered indicator catch the missed channels
      without false actives?
    kind: SYNTHETIC
    priority: 3
