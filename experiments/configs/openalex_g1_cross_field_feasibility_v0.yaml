claim_boundary: >-
  A successful summary validates the small 20260330 taxonomy entity graph and
  reprojects the already-frozen work-level primary-field, publication-year,
  declared-author-band, and author-ID-availability cube into an exact
  cross-field feasibility profile. It performs no OpenAlex work-table rescan.
  It does not validate work-to-topic or work-to-field entity references,
  duplicate work-topic edges, publication dates, author entities, candidate
  researchers, temporal leakage safety, final field selection, G-1 data
  readiness, G0 measurement freeze, empirical G1, or any scientific effect.
