status: PRECOMMIT_DESIGN_NO_RESULT_INTERPRETATION

purpose:
  primary_goal: >-
    TEST_WHETHER_THE_LADDERS_CAPACITY_CONCLUSIONS_SURVIVE_TRAINING_EACH_RESIDUAL_LEARNER_TO_ITS_OWN_OPTIMUM
  question: >-
    The capacity conclusions C07 to C14 were drawn with every residual learner
    trained by 300 Adam steps from the frozen prior. O35 found that this budget
    leaves the linear learner far from the optimum of its own objective where
    its class is right (C80). A pilot on O35's recorded evidence found the
    reverse for the MLP: converged at the registered penalty, it forecast the
    linear world worse than its 300-step fit, so the budget also regularizes
    it. Do the conclusions hold when every residual objective is converged, and
    when each learner's training is tuned on its own evidence from one shared
    menu?
  open_item: O36_capacity_comparisons_with_converged_fits
  ledger: experiments/configs/pivot_policy_ladder_consolidation_v11.yaml
  new_llm_calls: 0

