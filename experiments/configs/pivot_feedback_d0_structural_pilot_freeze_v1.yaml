claim_boundary: >-
  A pass freezes two discovery-only pilot fields using only pre-2013
  threshold-free S0 structural coverage and freezes two provisional,
  calendar-disjoint primary-topic attention episodes per field using current
  snapshot topic families. It reads no entry, persistence, realized citation,
  predictive, model-selection, or G4 outcome. It does not complete D0, validate
  incumbent and network leave-outs, establish eligible author opportunities,
  select final G0 fields or thresholds, authorize model fitting, or establish
  an empirical, causal, mechanism, or scientific effect.
