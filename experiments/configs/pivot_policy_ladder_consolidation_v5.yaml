claims:
  confirmed:
  - id: C43_the_s1_structure_was_rebuilt_without_outcomes
    statement: S1 built 63 episodes and 19,132 retained entrants from the 2026-06-26 snapshot, reproduced
      byte for byte, and computed no persistence label.
    evidence:
    - source: s1_build
      pointer: status
      equals: S1_PASS_STRUCTURAL_BUILD_REPRODUCED_NO_PERSISTENCE_LABEL
    - source: s1_build
      pointer: episodes/registered
      equals: 63
    - source: s1_build
      pointer: entrants/retained
      equals: 19132
  - id: C44_the_ladder_separates_learning_from_anticipation_at_the_s1_scale_shape
    statement: At the S1-scale synthetic shape (600 at risk, about 200 entrants per episode, exact dates),
      the ladder with the anticipatory competitor B7 recovers learning in 8 of 8 replicates and wins 0 of
      8 in the anticipation world.
    evidence:
    - source: ladder_v2
      pointer: registered_result/disposition
      equals: IDENTIFICATION_PASSES
    - source: ladder_v2
      pointer: registered_result/worlds/W1_learning/nabm_wins
      equals: 8
    - source: ladder_v2
      pointer: registered_result/worlds/W6_static_aligned_drift/nabm_wins
      equals: 0
  - id: C45_the_n11b_risk_sets_were_built_without_outcomes
    statement: N11b built and reproduced the risk sets, entry events, and pre-entry features, and computed
      no persistence label, follow-up count, or visible evidence.
    evidence:
    - source: risk_sets
      pointer: status
      equals: N11B_PASS_RISK_SETS_REPRODUCED_NO_OUTCOME
    - source: risk_sets
      pointer: persistence_labels_computed
      equals: 0
    - source: risk_sets
      pointer: follow_up_counts_computed
      equals: 0
    - source: risk_sets
      pointer: visible_evidence_computed
      equals: 0
  - id: C46_no_false_recovery_was_observed_at_the_n11b_shape
    statement: At the N11b shape, the registered analysis won in none of the 8 replicates of each of the
      five no-learning worlds. With 8 independent replicates, the one-sided 95% upper bound on a world's
      false-recovery rate is about 31%, so a zero rate is not established.
    evidence:
    - source: ladder_v3
      pointer: registered_result/worlds/W3_static/nabm_wins
      equals: 0
    - source: ladder_v3
      pointer: registered_result/worlds/W4_static_confounded/nabm_wins
      equals: 0
    - source: ladder_v3
      pointer: registered_result/worlds/W5_static_independent_drift/nabm_wins
      equals: 0
    - source: ladder_v3
      pointer: registered_result/worlds/W6_static_aligned_drift/nabm_wins
      equals: 0
    - source: ladder_v3
      pointer: registered_result/worlds/W8_static_recruitment/nabm_wins
      equals: 0
  rejected:
  - id: R12_the_outcome_selection_trend_as_the_empirical_test
    statement: The one-sided outcome selection trend (N10) is an adequate empirical test of learning.
    reason: In the N11a v1 worlds it missed pure learning in 8 of 8 replicates and turned positive only
      when topic growth accompanied learning, so a positive reading cannot be separated from growth.
    evidence:
    - source: ladder_v1
      pointer: registered_result/worlds/W1_learning/sign_test_positive
      equals: 0
    - source: ladder_v1
      pointer: registered_result/worlds/W2_learning_confounded/sign_test_positive
      equals: 8
  - id: R13_the_registered_v3_analysis_detects_learning_at_the_n11b_shape
    statement: The registered N11a v3 analysis detects learning at the N11b shape.
    reason: It recovered learning in 1 of 8 replicates of W1 and 3 of 8 of the confounded W2, against a
      required 7 of 8.
    evidence:
    - source: ladder_v3
      pointer: registered_result/disposition
      equals: UNDERPOWERED_AT_THE_EMPIRICAL_SHAPE
    - source: ladder_v3
      pointer: registered_result/worlds/W1_learning/nabm_wins
      equals: 1
    - source: ladder_v3
      pointer: registered_result/worlds/W2_learning_confounded/nabm_wins
      equals: 3
  - id: R14_a_joint_model_test_of_the_learned_coefficient_separates_learning_from_anticipation
    statement: A one-sided test of the learned coefficient in a joint model with the anticipatory proxy,
      with or without an anticipation ramp, separates learning from anticipation at the N11b shape.
    reason: In the exploratory screen it flagged the anticipation world W6 in 8 of 8 replicates without
      the ramp and 7 of 8 with it. The proxy is estimated from final observed labels, so this is a
      counterexample for this test, not evidence that an exactly specified anticipation model also fails.
    evidence:
    - source: power_screen
      pointer: cells/base~1W6_static_aligned_drift/A1_joint_confirmatory/wins
      equals: 8
    - source: power_screen
      pointer: cells/base~1W6_static_aligned_drift/A2_joint_ramp_confirmatory/wins
      equals: 7
    - source: power_screen
      pointer: cells/C_no_g4_guard~1W6_static_aligned_drift/A2_joint_ramp_confirmatory/wins
      equals: 5
  - id: R15_field_history_or_lifting_the_g4_guard_restores_power
    statement: Adding same-field history as evidence, or lifting the G4 guard, restores the registered
      rule's power without false recovery.
    reason: In the exploratory screen the registered rule recovered W1 in 3 of 8 replicates with field
      history and 2 of 8 with the guard lifted, and the joint test under field history flagged the
      static world W3 in 2 of 8.
    evidence:
    - source: power_screen
      pointer: cells/B_field_history~1W1_learning/A0_three_way/wins
      equals: 3
    - source: power_screen
      pointer: cells/C_no_g4_guard~1W1_learning/A0_three_way/wins
      equals: 2
    - source: power_screen
      pointer: cells/B_field_history~1W3_static/A1_joint_confirmatory/wins
      equals: 2
  open:
  - id: O20_which_factors_cost_the_v3_power
    question: How much of the loss of power from v2 to v3 comes from each change made together in v3,
      namely date imprecision, the gap between agent and analyst evidence, sparse features, case-cohort
      sampling, and censoring?
    kind: SYNTHETIC
    priority: 3
    motivation: Scarce analyst evidence and the similarity of the learned and anticipatory terms are the
      leading candidates, but similar coefficients alone do not establish collinearity, and no factor was
      varied on its own.
  - id: O21_fidelity_of_the_synthetic_evidence_timing
    question: Why does v3's median analyst evidence pool in W1 (6, 40, and about 58 at quarters 5, 8, and
      11) exceed N11b's median count of precise confirmatory entrants old enough for evidence (3, 16, and
      32)?
    kind: SYNTHETIC
    priority: 3
    motivation: The two count different things. v3 also counts imprecise entrants' labels, which become
      visible from the second year after the entry year, and its entry timing is simulated rather than
      copied. The remaining gap at quarter 5 was not decomposed, so v3 is not a complete reproduction of
      the empirical structure.
    evidence:
    - source: ladder_v3
      pointer: registered_result/worlds/W1_learning/median_confirmatory_evidence_pool/quarter_5
      equals: 6.0
    - source: risk_sets
      pointer: post_hoc_structural_diagnostics/confirmatory_precise_entrants_old_enough_for_evidence/quarter_5/median
      equals: 3.0
  - id: O22_learning_and_anticipation_with_another_unit_or_information_source
    question: Can learning be separated from anticipation with a different empirical unit or a measured
      information source, such as finer choices with many more events?
    kind: EMPIRICAL
    priority: 3
    motivation: Outside Paper-1. Any such design must first show power at its own measured shape.
