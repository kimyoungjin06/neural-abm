  paper_1: METHOD_AND_FRAMEWORK
  central_claim: NABM is a reusable framework that separates policy learning from social interaction, so
    fixed policies, adaptive policies, and external priors can be compared and traced within one
    simulation lifecycle.
  performance_comparisons: CONDITIONAL_CASES_NOT_THE_CENTRAL_CLAIM
  safe_llm_wording: In the specified synthetic worlds and comparison conditions, the NABM hybrid met the
