reporting_rules:
- id: ZERO_OF_N
  rule: Report a count of 0 of n replicates with its one-sided 95% binomial upper bound, 1 - 0.05^(1/n),
    which is about 31% at n = 8. It means no event was observed, not a zero rate.
- id: MATCHES
  rule: '"Matches" means each mean metric lies within the registered 0.02 margin of the comparator. It
    is not a test of statistical equivalence.'
- id: LLM_SCOPE
  rule: Both LLM-agent designs used the same local Qwen3-4B-Instruct-2507. The comparison is conditional
    on the specified worlds and comparison conditions, and its outcome reflects calibration and decision
    rules as well as the policy family.
- id: NEURAL_NECESSITY
  rule: The learned arms include linear and tree learners, so these results do not establish that a
    neural policy is necessary.
