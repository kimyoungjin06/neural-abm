empirical_stage:
  id: N11
  current_design: CLOSED_BEFORE_CONFIRMATORY_SCORING
  closure: In synthetic worlds that reflect the data structure measured in N11b, the registered analysis
    did not meet the power criterion needed to distinguish learning from anticipation. The explored
    alternatives did not achieve power and false-recovery control together, so the confirmatory analysis
    of the current design does not proceed. This does not imply the absence of learning.
  not_implied:
  - THE_ABSENCE_OF_LEARNING_IN_THE_DATA
  - THAT_NO_METHOD_COULD_DISTINGUISH_LEARNING_FROM_ANTICIPATION_IN_THIS_DATA
  - THAT_V3_REPRODUCES_THE_EMPIRICAL_STRUCTURE_COMPLETELY
  diagnosis: SCARCE_ANALYST_EVIDENCE_AND_SIMILAR_LEARNED_AND_ANTICIPATORY_TERMS_ARE_THE_LEADING_CANDIDATE_BOTTLENECKS_NOT_SEPARATED_FROM_THE_OTHER_V3_CHANGES
