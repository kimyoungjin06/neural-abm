claim_boundary: >-
  This metadata-only plan decomposes the four G0 blockers without executing
  any closure. It identifies the first blocker as a contract-generation
  mismatch: an exact passing G-1A receipt exists, while the immutable G0 v1
  skeleton still expects a legacy G-1 schema that the acyclic gate design does
  not pass. The plan therefore routes a versioned binding-reconciliation
  contract and does not promote legacy G-1. It also specifies future holdout
  seal, seventeen-choice precommitment, and fifteen-section completion
  workstreams while leaving every current value, section, receipt, and gate
  state unchanged. It reads no operator row data, opens no confirmatory or
  holdout data, creates no API request, and establishes no G0 seal, model, G4
  result, causality, or scientific effect.
