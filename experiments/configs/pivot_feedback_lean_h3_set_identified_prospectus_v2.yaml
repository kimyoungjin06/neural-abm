claim_boundary: >-
  This prospectus defines set-valued peak and field-vector interval semantics
  on closed analytic fixtures. It does not validate the one-percentage-point
  anchor for peak location, implement posterior uncertainty, replay the opened
  challenge, establish estimator admissibility or superiority, select an
  estimator or support rule, authorize a fresh blind or empirical access, or
  establish H3, feedback, causality, prediction, NABM necessity, or a
  scientific effect.
