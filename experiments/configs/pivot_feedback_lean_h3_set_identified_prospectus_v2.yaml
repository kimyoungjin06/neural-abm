scientific_object:
  question: >-
    Can a set-valued peak definition preserve practical near-ties and field
    heterogeneity without forcing a scalar peak or treating every tie as a
    terminal invalid result?
  primary_estimand: FOUR_FIELD_VECTOR_OF_MEAN_EPISODE_PEAK_GAP_SETS
  secondary_summary: FIELD_BALANCED_INTERVAL_HULL_REPORTED_WITH_VECTOR
  episode_gap_set: ENTRY_PRACTICAL_PEAK_SET_MINUS_PERSISTENCE_PRACTICAL_PEAK_SET
  event_time_grid: [-2, -1, 0, 1, 2]
  claim_role: PROSPECTIVE_ANALYTIC_DEFINITION_ONLY

candidate_family:
  name: practical_equivalence_set_field_vector_v2
  curve_peak_set:
    analytic_fixture_rule: >-
      INCLUDE_EVERY_REGISTERED_TIME_WITH_PROBABILITY_WITHIN_THE_INCLUSIVE
      ABSOLUTE_MARGIN_OF_THE_MAXIMUM
    inclusive_absolute_probability_margin: 0.01
    margin_source: OUTCOME_BLIND_G0_V4_ONE_PERCENTAGE_POINT_PRACTICAL_NULL_ANCHOR
    missing_registered_time_action: INVALID
    practically_flat_curve_action: INVALID
    boundary_including_peak_set_action: INVALID_CENSORED_BY_EVENT_WINDOW
    contiguous_interior_near_tie_action: SET_IDENTIFIED
    noncontiguous_interior_peak_set_action: SET_IDENTIFIED_MULTIMODAL_NO_SCALAR_PEAK
    earliest_argmax_tie_break: FORBIDDEN
  stochastic_successor_not_implemented:
    posterior_peak_set_rule: PENDING_SEPARATE_PRECOMMIT
    simultaneous_uncertainty_rule: PENDING_SEPARATE_PRECOMMIT
    dependence_and_overdispersion_model: PENDING_EMPIRICAL_SCALE_AUDIT
    opened_challenge_parameter_tuning: FORBIDDEN
  aggregation:
    field_count: 4
    episodes_per_field: 8
    minimum_valid_episodes_per_field: 4
    preserve_field_vector: true
    episode_gap_lower: MIN_ENTRY_PEAK_MINUS_MAX_PERSISTENCE_PEAK
    episode_gap_upper: MAX_ENTRY_PEAK_MINUS_MIN_PERSISTENCE_PEAK
    field_interval: MEAN_OF_VALID_EPISODE_LOWERS_AND_UPPERS
    field_balanced_interval_hull: MEAN_OF_FOUR_FIELD_LOWERS_AND_UPPERS
    scalar_peak_gap_required: false
    binary_pass_fail_decision: FORBIDDEN
  descriptive_direction_state:
    meaningful_positive_floor_cohort_years: 1.0
    unanimous_meaningful_positive: EVERY_FIELD_LOWER_AT_LEAST_FLOOR
    unanimous_nonpositive: EVERY_FIELD_UPPER_AT_MOST_ZERO
    otherwise: MIXED_OR_PARTIALLY_IDENTIFIED_NO_BINARY_DECISION

