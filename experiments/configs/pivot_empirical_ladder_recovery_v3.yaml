schema_version: pivot_empirical_ladder_recovery.v3
label: pivot_empirical_ladder_recovery_v3
status: PRECOMMIT_DESIGN_NO_RESULT_INTERPRETATION
registered_on: '2026-10-12'
next_step_id: N11a_v3
purpose: >-
  v1 and v2 passed identification in worlds of 600 authors at risk per
  episode, a third of whom entered. N11b measured the empirical shape, which
  is far from that: about 680,000 authors at risk per confirmatory episode,
  about 3 entries per 100,000 per quarter, 42.5% of entry dates known only to
  the year, sparse count features, and an evidence pool that is small and
  appears late. Confirmatory outcomes can be read once. v3 therefore reruns
  the recovery test at the measured shape, with the exact analysis N11c and
  N11d would apply to data, before any outcome row is read.

