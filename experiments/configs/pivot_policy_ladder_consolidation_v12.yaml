claims:
  confirmed:
  - id: C83_the_capacity_conclusions_hold_with_converged_and_with_tuned_training
    statement: The matched-marginal discriminator v3 and the nonlinear policy ABM v2 were rerun with every residual
      objective converged, and with each fit's training chosen on its own evidence from one shared menu. Their own
      decision code judges every capacity claim, C07 to C14, as recorded under both, and R01 stays rejected. The
      registered regime reproduced both records row for row.
    evidence:
    - source: converged_capacity
      pointer: status
      equals: O36_HOLD_UNDER_BOTH
    - source: converged_capacity
      pointer: decisions/by_regime/converged/claims/outcome
      equals: CLAIMS_HOLD
    - source: converged_capacity
      pointer: decisions/by_regime/tuned/claims/outcome
      equals: CLAIMS_HOLD
    - source: converged_capacity
      pointer: checks/parity/row_for_row
      equals: true
    - source: converged_capacity
      pointer: checks/registered/dispositions_equal_both_records
      equals: true
  - id: C84_with_tuned_training_the_linear_worlds_mlp_edge_vanishes
    statement: In the linear world, with field evidence and immediate visibility, the MLP's probe-Brier edge over the
      linear learner is 0.046 registered, 0.008 converged, and -0.001 [-0.002, +0.001] tuned. The policy layer's
      linear-world gap falls from 0.028 and 0.038 to about zero. Tuned, the linear learner chose a converged fit in
      every linear-world selection.
    evidence:
    - source: converged_capacity
      pointer: decisions/registered_quantities/linear_world_mlp_edge/registered/low
      greater_than: 0.04
    - source: converged_capacity
      pointer: decisions/registered_quantities/linear_world_mlp_edge/converged/mean
      less_than: 0.01
    - source: converged_capacity
      pointer: decisions/registered_quantities/linear_world_mlp_edge/tuned/low
      less_than: 0.0
    - source: converged_capacity
      pointer: decisions/registered_quantities/linear_world_mlp_edge/tuned/high
      greater_than: 0.0
    - source: converged_capacity
      pointer: descriptive/policy_layer_brier/tuned/linear_support_aligned/matched_linear
      less_than: 0.041
    - source: converged_capacity
      pointer: descriptive/policy_layer_brier/tuned/linear_support_aligned/residual_mlp
      greater_than: 0.040
    - source: converged_capacity
      pointer: descriptive/tuned_abm_field_selection_counts_by_menu_index/linear_batch~1linear_fit/5
      greater_than: 250
  - id: C85_the_registered_budget_regularizes_the_mlp
    statement: Converged at the registered penalty, the MLP forecasts the linear world 0.004 [0.002, 0.006] worse
      than its 300-step fit, and the axis world 0.013 worse. Tuned, it chose 300 Adam steps in 62% of its
      linear-world selections. The budget that handicaps the linear learner acts on the MLP as a regularizer.
    evidence:
    - source: converged_capacity
      pointer: decisions/registered_quantities/mlp_budget_effect/low
      greater_than: 0.0
    - source: converged_capacity
      pointer: descriptive/field_means/converged/immediate/axis_interaction_fit/mlp_batch/probe_brier
      greater_than: 0.125
    - source: converged_capacity
      pointer: descriptive/field_means/registered/immediate/axis_interaction_fit/mlp_batch/probe_brier
      less_than: 0.115
    - source: converged_capacity
      pointer: descriptive/tuned_abm_field_selection_counts_by_menu_index/mlp_batch~1linear_fit/0
      greater_than: 150
  - id: C86_the_interaction_world_comparisons_do_not_depend_on_training
    statement: In the interaction worlds the linear learner's probe Brier moves by at most 0.002 across regimes, and
      the crossover holds in 16 of 16 replicates under each (the MLP over the tree in the smooth world by 0.040,
      0.037, and 0.038; the tree over the MLP in the axis world by 0.054, 0.067, and 0.052). The DiD margins grow
      because they subtract a smaller linear-world gap. The MLP's field-learning DiD in the smooth world rises from
      0.046 to 0.094, and the policy layer's nonlinear need from 0.13 to 0.16.
    evidence:
    - source: converged_capacity
      pointer: reports/abm/converged/immediate/field_geometry_crossover/mlp_batch_over_tree_batch~1smooth_interaction_fit/positive_replicates
      equals: 16
    - source: converged_capacity
      pointer: reports/abm/converged/immediate/field_geometry_crossover/tree_batch_over_mlp_batch~1axis_interaction_fit/positive_replicates
      equals: 16
    - source: converged_capacity
      pointer: reports/abm/tuned/immediate/field_geometry_crossover/mlp_batch_over_tree_batch~1smooth_interaction_fit/positive_replicates
      equals: 16
    - source: converged_capacity
      pointer: reports/abm/tuned/immediate/field_geometry_crossover/tree_batch_over_mlp_batch~1axis_interaction_fit/positive_replicates
      equals: 16
    - source: converged_capacity
      pointer: reports/abm/registered/immediate/field_nonlinear_learning/mlp_batch~1smooth_interaction_fit/mean
      less_than: 0.05
    - source: converged_capacity
      pointer: reports/abm/tuned/immediate/field_nonlinear_learning/mlp_batch~1smooth_interaction_fit/mean
      greater_than: 0.09
    - source: converged_capacity
      pointer: reports/policy_layer/tuned/nonlinear_representation_need/smooth_interaction_aligned/mean
      greater_than: 0.15
  - id: C87_the_mlps_behavior_gains_are_interaction_specific_once_the_linear_learner_is_trained_to_its_optimum
    statement: Registered, only the tree passed the entry and exit DiDs, because the MLP's linear-world edge was
      subtracted. Converged and tuned, the MLP also passes the entry DiD in both interaction worlds, and tuned, the
      exit DiD in the smooth world, with immediate visibility. In the linear world the tuned linear learner's entrant
      precision and active failed stock match the MLP's (0.433 and 0.010, against 0.434 and 0.013).
    evidence:
    - source: converged_capacity
      pointer: decisions/registered_quantities/behavior_passing_lists/tuned/immediate/entry
      contains: mlp_batch/smooth_interaction_fit
    - source: converged_capacity
      pointer: decisions/registered_quantities/behavior_passing_lists/tuned/immediate/entry
      contains: mlp_batch/axis_interaction_fit
    - source: converged_capacity
      pointer: decisions/registered_quantities/behavior_passing_lists/tuned/immediate/exit
      contains: mlp_batch/smooth_interaction_fit
    - source: converged_capacity
      pointer: decisions/registered_quantities/behavior_passing_lists/converged/immediate/entry
      contains: mlp_batch/axis_interaction_fit
    - source: converged_capacity
      pointer: expectations/E4/held
      equals: true
  - id: C88_the_comparison_reproduced_with_parity_and_every_acting_fit_converged
    statement: The comparison reproduced byte for byte. Every acting L-BFGS fit reached the gradient tolerance; one
      of 63,777 inner fits under tuning did not, and its candidate was unavailable for that one selection. Under
      tuning every neighbor-learner fit kept the registered setting, and those rows equal the registered ones.
    evidence:
    - source: converged_capacity
      pointer: reproduction/byte_identical/runs.jsonl
      equals: true
    - source: converged_capacity
      pointer: reproduction/byte_identical/policy_rows.jsonl
      equals: true
    - source: converged_capacity
      pointer: reproduction/byte_identical/scorecard.json
      equals: true
    - source: converged_capacity
      pointer: checks/convergence/within_ceiling
      equals: true
    - source: converged_capacity
      pointer: checks/convergence/by_study_and_regime/abm~1tuned/unconverged_inner_fits
      equals: 1
    - source: converged_capacity
      pointer: tuned_neighbor_rows_equal_registered
      equals: true
  rejected: []
  open:
  - id: O37_llm_prior_comparisons_inside_tuned_learners
    question: Does the LLM direction still add nothing inside the pooled learners (C76) when the learners' training is
      chosen on their own evidence?
    kind: SYNTHETIC
    priority: 2
    motivation: The entry-matched control's learner arms used the registered 300-step training. Tuning removed the
      linear learner's linear-world deficit (C84) and changed which behavior DiDs the MLP passes (C87).
