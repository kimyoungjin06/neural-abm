claim_boundary: >-
  G0 v2 is independently valid as a binding-only successor: G-1A bounded
  evidence is satisfied without passing legacy G-1, while the holdout receipt,
  seventeen values, and fifteen sections remain blockers. This gate authorizes
  only a metadata-only holdout-seal contract that freezes the already declared
  partition and separates seal creation from opening. It does not authorize
  enumerating or hashing holdout artifacts, creating or issuing a seal,
  opening confirmatory or holdout data, changing G0 v2, resolving values or
  sections, passing G0, fitting a model, opening G4, asserting causality, or
  establishing a scientific effect.
