    rule_id: FIELD_YEAR_TOP_DECILE_AGE3_CITATION_PROXY_INCLUSIVE_TIES_V1
    proxy_included: true
    unit: ELIGIBLE_WORK
    reference_cohort: PRIMARY_FIELD_ID_X_PUBLICATION_YEAR
    citation_horizon_years: 3
    citation_count_definition: DISTINCT_SOURCE_WORK_CITATIONS_AVAILABLE_BY_END_OF_PUBLICATION_YEAR_PLUS_3
    citation_available_at_proxy: CITING_WORK_PUBLICATION_DATE
    historical_platform_observation_time_established: false
    researcher_visibility_established: false
    current_snapshot_primary_field_role: RETROSPECTIVE_NORMALIZATION_PROXY
