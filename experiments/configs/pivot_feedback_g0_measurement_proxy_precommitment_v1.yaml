    focal_population: INCUMBENT_ONLY_EXCLUDES_FOCAL_ENTRANTS
    recent_window_offsets: [-3, -2, -1]
    reference_window_offsets: [-6, -5, -4]
    window_year_count: 3
    recent_value: SUM_ELIGIBLE_INCUMBENT_ATTENTION_IN_RECENT_WINDOW
    reference_value: SUM_ELIGIBLE_INCUMBENT_ATTENTION_IN_REFERENCE_WINDOW
    acceleration_score: LOG1P_RECENT_ANNUAL_MEAN_MINUS_LOG1P_REFERENCE_ANNUAL_MEAN
    normalization_group: PRIMARY_FIELD_ID_X_DECISION_YEAR_ACROSS_ELIGIBLE_TOPICS
    location_estimator: MEDIAN
    scale_estimator: MEDIAN_ABSOLUTE_DEVIATION
    modified_z_multiplier: 0.6744897501960817
    primary_modified_z_threshold_inclusive: 3.0
    raw_acceleration_must_be_positive: true
    recent_count_must_exceed_reference_count: true
    mad_zero_action: NO_SURGE_FAIL_CLOSED
    nonfinite_or_missing_action: EXCLUDE_AND_REPORT
    primary_threshold_may_be_relaxed_for_coverage: false
    sensitivity_thresholds_report_only: [2.5, 3.5]
