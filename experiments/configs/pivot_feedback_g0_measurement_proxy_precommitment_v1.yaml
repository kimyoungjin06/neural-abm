claim_boundary: >-
  This outcome-blind contract precommits four measurement/proxy choices and a
  synthetic fixture interface. The robust-surge threshold, top-decile proxy,
  three-year horizon, and one-percentage-point equivalence margin are explicit
  design policies, not literature-mandated truths or empirical effects. The
  citation proxy uses citing-work publication time from a current snapshot and
  does not establish platform observation, researcher visibility, or
  information receipt. No discovery production input is opened, G0 v2 is not
  changed, the remaining thirteen quantitative choices and all required
  sections remain unresolved, and no holdout artifact, seal, model, G4 result,
  causality, or scientific effect is established.
