  negative_control_equivalence_margins:
    resolution_status: FROZEN_OUTCOME_BLIND_POLICY_RULE
    estimand_scale: AVERAGE_MARGINAL_BINARY_OUTCOME_PROBABILITY_DIFFERENCE
