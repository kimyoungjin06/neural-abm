claim_boundary: >-
  This contract accepts the simple predeclared candidate aggregation rule and
  freezes four production candidate dispositions without human review or API
  labels as ground truth. It certifies only the Computer Science field pair.
  Medicine rank 2 T10543 remains CONTENT_UNRESOLVED and blocks the global
  certificate. Only a versioned v16 gate may authorize the exact 96-title
  targeted local sample. General raw scans, full title copies, API requests,
  global certification, deterministic reselection, outcomes, fitting, G4, and
  scientific effects remain unauthorized or not established.
