reference_rules:
  id_grammar:
    topic: '^https://openalex[.]org/T([1-9][0-9]*)$'
    domain: '^https://openalex[.]org/domains/([1-9][0-9]*)$'
    field: '^https://openalex[.]org/fields/([1-9][0-9]*)$'
    subfield: '^https://openalex[.]org/subfields/([1-9][0-9]*)$'
  zero_sentinels:
    topic: https://openalex.org/T0
    domain: https://openalex.org/domains/0
    field: https://openalex.org/fields/0
    subfield: https://openalex.org/subfields/0
  score_range:
    minimum_inclusive: 0.0
    maximum_inclusive: 1.0
  allow_all_null_hierarchy: true
  allow_partial_hierarchy: false
  require_zero_grammar_or_unknown_id_rows: true
  require_zero_parent_chain_or_name_mismatch_rows: true
  require_zero_nonfinite_or_out_of_range_score_rows: true

execution:
  workload_class: local_cpu_io
  batch_size: 262144
  checkpoint_unit: input_file
  checkpoint_binds:
    - relative_path
    - bytes
    - mtime_ns
    - footer_rows
    - projected_schema_sha256
    - projected_payload_sha256
    - payload_sha256
  deterministic_file_order: lexical_relative_path
  max_files_per_table_is_pilot_only: true
  verify_parent_before_resume: true
  resume_verification: rehash_current_projected_payload_before_reusing_metrics
  verify_source_identity_before_and_after_file: true
  refuse_symlink_inputs: true

