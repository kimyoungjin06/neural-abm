  measure_2026_10_18: SHARE_PRECISION_ON_UNVERIFIED_ITEMS
  comparisons: L1_MINUS_L0_L0_MINUS_X0_L1_MINUS_P0
  weights: COPY_THE_PINNED_SNAPSHOT_TO_THE_GPU_SERVER_AND_VERIFY_ITS_HASHES
