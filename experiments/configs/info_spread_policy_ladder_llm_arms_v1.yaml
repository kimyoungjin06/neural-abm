stage: D3b, frozen with study v2 (D3a v2) in one commit; run as D5 after D4 v2
purpose: 'Freeze the LLM arms of the information-spread policy ladder in the study v2 cells: P0, a prior elicited
  once from a local Qwen; X0, AgentTorch-style archetypes; and L1, the study learner started from P0. Three comparisons
  on the study v2 primary measure (share precision on unverified items): L1 - L0 (the LLM prior inside NABM), L0 - X0
  (NABM against archetypes), and L1 - P0 (the closed loop on the LLM prior).'
design_document: docs/research/info-spread-policy-ladder-llm-arms-v1.md
