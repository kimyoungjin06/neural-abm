schema_version: pivot_empirical_ladder_risk_sets.v1
label: pivot_empirical_ladder_risk_sets_v1
status: PRECOMMIT_DESIGN_NO_RESULT_INTERPRETATION
registered_on: '2026-10-12'
next_step_id: N11b
purpose: >-
  The frozen executable contract for stage N11b of the empirical model ladder.
  It reads the private S1 extract and writes, for every S1 episode, the risk
  set of field-active authors over the twelve response quarters, a case-cohort
  sample of it, pre-entry features, coauthor entry exposure, and the shared
  episode environment. It reads no outcome: no follow-up topic work, no
  persistence label, and no visible evidence. A run needs a committed user
  authorization file in addition to this precommit.

