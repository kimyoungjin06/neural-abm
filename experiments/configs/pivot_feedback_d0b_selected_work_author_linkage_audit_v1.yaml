claim_boundary: >-
  A pass may establish exact linkage coverage between the 83,565 frozen
  pre-decision target-topic works and distinct valid current-snapshot OpenAlex
  author-token events, plus descriptive work-type, calendar-window, team-cap,
  and pre-signal incumbent coverage. It does not establish that unlinked
  declared slots are exclusively null author IDs, natural persons,
  historically observed topic classification, a valid incumbent-attention
  definition, an episode exclusion or threshold decision, focal or network
  leave-outs, entry, persistence, an association, D0-B completion, D0
  completion, G0, model fitting, G4, or a scientific effect.
