audit_contract:
  selected_work_identity_source: RECEIPT_BOUND_D0B_AUTHOR_FOUNDATION
  selected_work_metadata_source: RECEIPT_BOUND_CUTOFF_WORK_METADATA
  valid_author_token_source: RECEIPT_BOUND_AUTHOR_HISTORY_EVENTS
  valid_author_token_unit: DISTINCT_CURRENT_SNAPSHOT_OPENALEX_AUTHOR_TOKEN_WORK_PAIR
  declared_minus_valid_distinct_token_interpretation: >-
    UNLINKED_DECLARED_AUTHOR_SLOTS_OR_DUPLICATE_TOKEN_SLOTS_NOT_PROOF_OF_NULL_ONLY
  selected_work_must_match_cutoff_metadata_exactly: true
  selected_event_must_match_work_year_team_and_field: true
  zero_valid_author_token_works_retained: true
  pre_signal_incumbent_rule: author has at least one selected target-topic work strictly before t-6
  work_any_incumbent_rule: at least one linked valid author token is a pre-signal incumbent
  work_all_linked_authors_incumbent_rule: >-
    at least one linked valid author token and every linked valid author token is a pre-signal incumbent
  nonranked_team_cap_profiles: [10, 50, 100, ALL]
  work_type_profile_required: true
  reference_and_signal_window_profile_required: true
  linkage_threshold_or_episode_selection_allowed: false

