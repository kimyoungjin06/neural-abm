claim_boundary: >-
  This outcome-blind component replays focal and preexisting-peer leaveout for
  the 65 candidates selected by the verified all-topic strict-incumbent screen,
  retains the aligned field-year normalization and unchanged support and
  three-family rules, and does not replace a selected field. It may authorize
  atomic partition assignment if every selected slot conforms, but it does not
  inspect entry, persistence, realized citation effects, model scores, private
  holdout bytes, or G4 outcomes; pass F or G0; or establish a null,
  association, prediction, transport, causality, or scientific effect.
