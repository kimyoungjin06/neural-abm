claims:
  confirmed:
  - id: C95_at_the_data_allowed_learning_rate_study2s_imitative_loop_falls_below_material
    statement: At the largest grid rate whose outcome dependence the coauthor data do not exclude, 0.0234375, the
      imitative arm's failed pivots exceed the frozen arm's by +0.0003 [+0.0000, +0.0008] at baseline and by +0.0161
      [+0.0117, +0.0208] under seed grants with a three-step delay (+0.0222 [+0.0169, +0.0275] at once). Both are
      below the registered material size of 0.05, against +0.281 and +0.289 at the tracked rate. The grant
      difference is still detected.
    evidence:
    - source: learning_strength
      pointer: status
      equals: O39_THE_LOOP_FALLS_BELOW_MATERIAL_AT_THE_DATA_ALLOWED_STRENGTH
    - source: learning_strength
      pointer: decision/by_delay/delay_0/disposition
      equals: THE_LOOP_FALLS_BELOW_MATERIAL_AT_THE_DATA_ALLOWED_STRENGTH
    - source: learning_strength
      pointer: decision/by_delay/delay_3/classes/baseline
      equals: BELOW_MATERIAL_NOT_DETECTED
    - source: learning_strength
      pointer: decision/by_delay/delay_3/classes/interdisciplinary_seed_grants
      equals: BELOW_MATERIAL_DETECTED
    - source: learning_strength
      pointer: decision/by_delay/delay_3/loop_rows/interdisciplinary_seed_grants/mean_ci95/1
      less_than: 0.05
    - source: learning_strength
      pointer: decision/by_delay/delay_0/loop_rows/interdisciplinary_seed_grants/mean_ci95/1
      less_than: 0.05
    - source: learning_strength
      pointer: comparisons/imitative~10~1interdisciplinary_seed_grants~1delay_0~1failed_pivot_rate/mean
      equals: 0.2889
  - id: C96_the_data_allowed_rate_is_one_sixty_fourth_of_study2s_rate
    statement: The imitative arm's visible outcome gap falls with the learning rate in every scenario where it is
      defined, from +7.0 to +11.2 log-odds at the tracked rate 1.5. The largest grid rate that keeps it within the
      data's upper bound, 0.789, everywhere is 0.0234375 at both delays. One step up, the gap is +0.82 under grants
      at once and +1.18 under hype with the delay. With the data's point estimate, 0.228, as the bound, the delayed
      calibration allows no grid rate.
    evidence:
    - source: learning_strength
      pointer: calibration/primary/delay_0/rate
      equals: 0.0234375
    - source: learning_strength
      pointer: calibration/primary/delay_3/rate
      equals: 0.0234375
    - source: learning_strength
      pointer: decision/expectations/X1/held
      equals: true
    - source: learning_strength
      pointer: calibration/primary/delay_0/rows/2/gaps/interdisciplinary_seed_grants
      greater_than: 0.789381
    - source: learning_strength
      pointer: calibration/primary/delay_3/rows/2/gaps/hot_field_hype
      greater_than: 0.789381
    - source: learning_strength
      pointer: calibration/secondary/delay_3/rate
      equals: null
  - id: C97_delay_alone_halves_the_baseline_loop_and_leaves_the_grant_loop
    statement: At the tracked rate, a three-step outcome delay lowers the baseline loop from +0.281 to +0.138 [+0.110,
      +0.167], leaves the grant loop at +0.301 [+0.280, +0.320], and turns the hype difference positive, +0.0506
      [+0.0383, +0.0625].
    evidence:
    - source: learning_strength
      pointer: comparisons/imitative~10~1baseline~1delay_3~1failed_pivot_rate/mean_ci95/1
      less_than: 0.2
    - source: learning_strength
      pointer: comparisons/imitative~10~1interdisciplinary_seed_grants~1delay_3~1failed_pivot_rate/mean_ci95/0
      greater_than: 0.27
    - source: learning_strength
      pointer: comparisons/imitative~10~1hot_field_hype~1delay_3~1failed_pivot_rate/mean_ci95/0
      greater_than: 0.0
  - id: C98_failure_only_learning_shrinks_with_the_rate_and_the_delay
    statement: Failure-only learning's cut in hype failures (R6 of the case study), -0.1436 at the tracked rate,
      is -0.0583 with the delay, and at the data-allowed rate -0.0200 [-0.0247, -0.0153] at once and -0.0119
      [-0.0164, -0.0081] with the delay. Its cost in productive grant pivots (R7), -0.0694, is -0.0047 at that rate.
      The cautionary arm itself cannot be calibrated, because it never pivots after a visible failure (C89).
    evidence:
    - source: learning_strength
      pointer: comparisons/cautionary~10~1hot_field_hype~1delay_3~1failed_pivot_rate/mean
      equals: -0.0583
    - source: learning_strength
      pointer: comparisons/cautionary~16~1hot_field_hype~1delay_0~1failed_pivot_rate/mean_ci95/0
      greater_than: -0.05
    - source: learning_strength
      pointer: comparisons/cautionary~16~1hot_field_hype~1delay_3~1failed_pivot_rate/mean_ci95/1
      less_than: 0.0
    - source: learning_strength
      pointer: comparisons/cautionary~16~1interdisciplinary_seed_grants~1delay_0~1productive_pivot_rate/mean
      equals: -0.0047
  - id: C99_post_hoc_a_material_loop_needs_four_to_thirty_two_times_the_data_allowed_rate
    statement: 'Post hoc and descriptive. Counting down from the tracked rate, the loop stays material under grants
      to four times the data-allowed rate, and at baseline to 16 times (at once) and 32 times (with the delay). At the
      data-allowed rate learning adds more productive than failed grant pivots, +0.0217 against +0.0161 with the
      delay, where at the tracked rate it adds +0.289 failed against +0.156 productive. The imitative entry-order
      gradient there equals the frozen arm''s (-1.32 against -1.37 under grants), so the falling gradient is Study
      2''s structure, not its learning. The estimator still finds learning at that rate: the learning-attributable
      gap is +0.615 [+0.424, +0.837] under grants with the delay, because the simulation has hundreds of entries per
      state.'
    evidence:
    - source: learning_strength
      pointer: post_hoc/status
      equals: POST_HOC_DESCRIPTIVE_NOT_REGISTERED
    - source: learning_strength
      pointer: post_hoc/smallest_rate_from_the_top_with_a_material_loop/interdisciplinary_seed_grants~1delay_3/multiple_of_the_data_allowed_rate
      equals: 4.0
    - source: learning_strength
      pointer: post_hoc/smallest_rate_from_the_top_with_a_material_loop/baseline~1delay_3/multiple_of_the_data_allowed_rate
      equals: 32.0
    - source: learning_strength
      pointer: post_hoc/imitative_failed_and_productive_at_the_tracked_and_allowed_rates/interdisciplinary_seed_grants~1delay_3~1allowed/productive/mean
      greater_than: 0.0161
    - source: learning_strength
      pointer: post_hoc/estimator_at_the_allowed_rate/interdisciplinary_seed_grants~1delay_3/imitative_entry_order/mean
      greater_than: -1.371252
    - source: learning_strength
      pointer: post_hoc/estimator_at_the_allowed_rate/interdisciplinary_seed_grants~1delay_3/learning_attributable_outcome_gap_visible/low
      greater_than: 0.0
  - id: C100_the_study_reproduced_study2_and_experiment_4_and_read_no_empirical_row
    statement: The study reproduced byte for byte. At the tracked rate it reproduced all 270 tracked Study 2 runs, all
      12 tracked comparisons, and all 378 compared values of experiment 4's estimator rows exactly; every fit
      converged; and no empirical row was read.
    evidence:
    - source: learning_strength
      pointer: execution/byte_identical/o39_summary.json
      equals: true
    - source: learning_strength
      pointer: checks/study2_parity/tracked_runs_equal
      equals: 270
    - source: learning_strength
      pointer: checks/study2_parity/tracked_comparisons_equal
      equals: 12
    - source: learning_strength
      pointer: checks/e4_estimator_parity/largest_difference
      equals: 0.0
    - source: learning_strength
      pointer: checks/bootstrap_unconverged_fits
      equals: 0
    - source: learning_strength
      pointer: data_access/empirical_rows_read
      equals: 0
  rejected: []
  open:
  - id: O40_a_calibration_that_does_not_rest_on_one_log_odds_scale
    question: Does R5's narrowing hold under a calibration that does not take an agent step and a topic quarter to be
      one unit, for example one that also matches the exposure association or the follow-up rate, which Study 2 and
      the data both have?
    kind: SYNTHETIC
    priority: 3
    motivation: The data-allowed rate (C96) takes the data's bound on one log-odds scale for agent steps and topic
      quarters, which the study does not justify.
    evidence:
    - source: learning_strength
      pointer: calibration/primary/delay_3/rate
      equals: 0.0234375
narrowed_case_study_results:
- id: CASE_STUDY_R5_IMITATIVE_LEARNING_AMPLIFIES_BASELINE_AND_GRANT_PIVOTING
  source: docs/case-studies/researcher-pivot/README.md
  scope: Holds at Study 2's hand-set learning rate. At the largest rate whose outcome dependence the coauthor data do
    not exclude under experiment 4's estimator, the loop is below material in both scenarios (C95); a material loop
    needs 4 to 32 times that rate (C99).
- id: CASE_STUDY_R6_FAILURE_ONLY_LEARNING_REDUCES_HYPE_FAILURES
  source: docs/case-studies/researcher-pivot/README.md
  scope: Holds at the hand-set rate with immediate visibility. A three-step delay cuts it by about three fifths, and
    at the data-allowed rate it is -0.012 to -0.020 (C98).
