registered_author_membership:
  rule_id: EXACT_VERIFIED_AUTHOR_OPPORTUNITY_BASE_V1
  unit: CURRENT_SNAPSHOT_OPENALEX_AUTHOR_TOKEN_X_CERTIFIED_EPISODE
  rule: >-
    Retain every row in the independently verified exact-four author-opportunity
    base, whose upstream ABI already requires at least one eligible focal-field
    work in t-3 through t-1.
  upstream_structural_predicate:
    column: portfolio_window_focal_field_work_count_all
    operator: GREATER_THAN_OR_EQUAL_TO
    value: 1
  registered_measurement_member_for_every_retained_row: true
  single_minimum_history_threshold_selected: false
  threshold_specific_membership_flags_materialized: false
  continuous_history_counts_retained: true
  graph_team_cap_profiles_retained_nonranked: [10, 50, 100]
