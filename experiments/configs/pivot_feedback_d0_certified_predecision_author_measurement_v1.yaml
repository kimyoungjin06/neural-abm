claim_boundary: >-
  A pass registers the complete independently verified exact-four
  author-opportunity base as an outcome-blind measurement population and joins
  only already verified predecision, current-snapshot sensitivity, and
  work-time affiliation-proxy components. It selects no minimum-history
  threshold or graph cap, does not establish final candidate eligibility,
  natural persons, historical ORCID or affiliation truth, visible success,
  researcher pivots, entry or persistence outcomes, an association, a causal
  mechanism, G0, G4, or a scientific effect.
