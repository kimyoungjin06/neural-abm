claim_boundary: >-
  A full PASS may establish a deterministic normalized relational component for
  constructing annual cutoff views from the exact current-snapshot work,
  author-event, work-topic, and citation-proxy parents. It may establish exact
  projected work-metadata row conservation, strict work-modulo partitions, the
  absence of forbidden current outcome columns, explicit available_at
  predicates, and receipt-bound parent references. Current topic membership,
  author-token linkage, and bibliographic citation event time remain
  retrospective current-snapshot proxies and do not prove what a researcher or
  OpenAlex could observe historically. This component deliberately does not
  choose candidate eligibility, work-type inclusion, team caps, pivot or surge
  thresholds, same-day citation treatment, a fixed outcome horizon, sampling,
  or weights; those require a versioned G0 successor. It does not establish
  author-person validity, a final analytic risk set, G-1, G0, empirical G1, an
  NABM effect, or any scientific effect.
