claim_boundary: >-
  This operator-only successor may materialize the registered predecision
  author-history, attention, network, capacity, and bibliographic
  visible-success proxy features plus private target-topic author-work and
  byline source rows at t through t+3. Citation availability is a current-
  snapshot bibliographic event-time proxy, not historical OpenAlex observation
  or researcher visibility. Raw author and work tokens remain private. No entry
  or persistence label, descriptive outcome rate, association, model score,
  fitted model, transport result, causal mechanism, or scientific effect may
  be produced. Even after a passing materialization, a separate successor must
  bind the exact private root and complete file list before preflight; F and G0
  remain false and G4 remains unopened.
