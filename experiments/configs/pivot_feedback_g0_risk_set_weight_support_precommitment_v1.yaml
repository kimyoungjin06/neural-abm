claim_boundary: >-
  This outcome-blind contract precommits six risk-set, weighting, support,
  suppression, and collinearity choices plus a synthetic fixture interface.
  Ten controls per case, P01-P99 winsorization, the cohort and cell floors, and
  VIF five are explicit conservative design policies, not literature-mandated
  truths, power guarantees, or empirical effects. The one-through-ten
  suppression rule is used by analogy and does not assert that CMS policy
  governs OpenAlex. No discovery production input is opened, G0 v3 is not
  changed, the remaining seven quantitative choices and all required sections
  remain unresolved, and no holdout artifact, seal, model, G4 result,
  causality, or scientific effect is established.
