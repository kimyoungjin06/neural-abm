precommitment_choices:
  negative_sampling_ratio:
    resolution_status: FROZEN_OUTCOME_BLIND_POLICY_RULE
    rule_id: STRATIFIED_RISK_SET_TEN_CONTROLS_PER_CASE_V1
    ratio_controls_per_case: 10
    case_rule: RETAIN_EVERY_ELIGIBLE_ENTRY_CASE
    control_rule: SAMPLE_WITHOUT_REPLACEMENT_FROM_SAME_EXACT_RISK_SET
    exact_risk_set_stratum:
      - analysis_partition_id
      - primary_field_id
      - certified_episode_id
      - decision_year
    case_excluded_from_control_pool: true
    eligible_control_may_be_sampled_in_multiple_decision_years: true
    duplicate_control_within_exact_risk_set_allowed: false
    controls_when_pool_below_target: RETAIN_ALL_ELIGIBLE_CONTROLS
    target_control_count: MINIMUM_OF_ELIGIBLE_CONTROL_COUNT_AND_TEN_TIMES_CASE_COUNT
    deterministic_priority: SHA256_COMPONENT_SEED_STRATUM_ID_STABLE_OPPORTUNITY_ID_ASCENDING
    component_seed: 20260718
    stable_opportunity_id_required: true
    inclusion_probability: SELECTED_CONTROL_COUNT_DIVIDED_BY_ELIGIBLE_CONTROL_COUNT_WITHIN_EXACT_RISK_SET
    case_inclusion_probability: 1.0
    raw_sampling_weight: INVERSE_INCLUSION_PROBABILITY
    zero_case_stratum_action: EXCLUDE_FROM_CASE_CONTROL_ANALYSIS_AND_REPORT
    zero_control_stratum_action: FAIL_SUPPORT_GATE
    ratio_may_be_reduced_for_compute_after_freeze: false
    full_risk_set_sensitivity_required: true
    claim_role: COMPUTE_REDUCTION_POLICY_NOT_EFFICIENCY_OR_POWER_GUARANTEE

  inverse_probability_weight_truncation:
    resolution_status: FROZEN_OUTCOME_BLIND_POLICY_RULE
    rule_id: STABILIZED_IPW_NEAREST_RANK_P01_P99_WINSORIZATION_V1
    input_weight: POSITIVE_FINITE_COMBINED_STABILIZED_ANALYTIC_WEIGHT
    grouping_unit:
      - analysis_partition_id
      - primary_field_id
    lower_percentile: 0.01
    upper_percentile: 0.99
    percentile_algorithm: NEAREST_RANK_ONE_BASED_CEILING_P_TIMES_N
    lower_action: RAISE_TO_LOWER_PERCENTILE
    upper_action: LOWER_TO_UPPER_PERCENTILE
    post_winsorization_normalization: DIVIDE_BY_GROUP_ARITHMETIC_MEAN_TO_MEAN_ONE
    zero_negative_missing_or_nonfinite_weight_action: FAIL_CLOSED
    raw_untruncated_weight_sensitivity_required: true
    raw_and_truncated_weight_range_required: true
    raw_and_truncated_kish_effective_sample_size_required: true
    balance_diagnostics_required: true
    percentile_cutoffs_may_be_retuned_after_outcome_inspection: false
    estimand_change_due_to_truncation_must_be_acknowledged: true
    claim_role: BIAS_VARIANCE_STABILITY_POLICY_NOT_CAUSAL_IDENTIFICATION

  minimum_cohort_size:
    resolution_status: FROZEN_OUTCOME_BLIND_POLICY_FLOOR
    rule_id: FIELD_EPISODE_PARTITION_MINIMUM_500_WITH_100_PER_OUTCOME_CLASS_V1
    unit:
      - analysis_partition_id
      - primary_field_id
      - certified_episode_id
    evaluated_on: FULL_ELIGIBLE_RISK_SET_BEFORE_NEGATIVE_SAMPLING
    minimum_total_opportunity_rows: 500
    minimum_entry_events: 100
    minimum_non_entry_opportunities: 100
    all_three_conditions_required: true
    pooling_across_fields_to_rescue_failure_allowed: false
    pooling_across_partitions_to_rescue_failure_allowed: false
    pooling_across_certified_episodes_to_rescue_failure_allowed: false
    failed_unit_action: EXCLUDE_UNIT_AND_FAIL_REGISTERED_COVERAGE_REQUIREMENT
    model_specific_sample_size_calculation_still_required: true
    floor_substitutes_for_model_specific_calculation: false
    outcome_rate_tuning_allowed: false
    claim_role: MINIMUM_SCREEN_NOT_POWER_OR_PRECISION_GUARANTEE

  small_cell_suppression_threshold:
    resolution_status: FROZEN_PRIVACY_AND_STABILITY_POLICY
    rule_id: SUPPRESS_COUNTS_ONE_THROUGH_TEN_AND_DERIVABLE_COMPLEMENTS_V1
    count_unit: DISTINCT_ANALYSIS_OPPORTUNITY_OR_DISTINCT_AUTHOR_TOKEN_AS_LABELED
    suppressed_inclusive_lower: 1
    suppressed_inclusive_upper: 10
    minimum_directly_reportable_nonzero_count: 11
    exact_zero_reporting: ALLOWED_ONLY_WHEN_NOT_DERIVED_FROM_A_SUPPRESSED_COMPLEMENT
    percentage_or_rate_with_suppressed_denominator_or_numerator: SUPPRESS
    complementary_secondary_suppression_required: true
    differencing_that_recovers_suppressed_count_allowed: false
    internal_modeling_retention_based_on_reporting_rule_alone: ALLOWED_IF_SEPARATE_SUPPORT_GATES_PASS
    threshold_may_be_relaxed_for_table_completeness: false
    claim_role: CONSERVATIVE_ANALOGOUS_DISCLOSURE_POLICY_NOT_CMS_APPLICABILITY_CLAIM

  capacity_cell_support_threshold:
    resolution_status: FROZEN_OUTCOME_BLIND_POLICY_RULE
    rule_id: FOUR_SIGNAL_CAPACITY_CELLS_MIN_50_TOTAL_11_PER_OUTCOME_CLASS_V1
    cell_definition: PEER_VISIBLE_SUCCESS_PROXY_BINARY_X_CAPACITY_BRIDGE_BINARY
    required_cells: [NEITHER, PUBLIC_SUCCESS_ONLY, CAPACITY_BRIDGE_ONLY, BOTH]
    unit:
      - analysis_partition_id
      - primary_field_id
      - certified_episode_id
    evaluated_before_separate_channel_model: true
    minimum_total_opportunities_per_cell: 50
    minimum_entry_events_per_cell: 11
    minimum_non_entry_opportunities_per_cell: 11
    all_four_cells_must_pass_all_three_conditions: true
    small_cell_suppression_consistent: true
    pool_fields_to_rescue_cell_allowed: false
    pool_partitions_to_rescue_cell_allowed: false
    failed_action: COLLAPSE_TO_ANY_PEER_SIGNAL_OR_CAPACITY_AND_FORFEIT_SEPARATE_CHANNEL_CLAIM
    selective_variable_deletion_after_failure_allowed: false
    claim_role: CHANNEL_SEPARABILITY_FLOOR_NOT_EFFECT_OR_POWER_GUARANTEE

  collinearity_threshold:
    resolution_status: FROZEN_OUTCOME_BLIND_POLICY_RULE
    rule_id: CENTERED_WEIGHTED_EXPOSURE_BLOCK_VIF_STRICTLY_BELOW_FIVE_V1
    design_columns:
      - peer_visible_success_proxy
      - capacity_bridge
      - peer_visible_success_proxy_x_capacity_bridge
    intercept_in_auxiliary_regressions: true
    weights: FINAL_REGISTERED_ANALYTIC_WEIGHTS
    grouping_unit:
      - analysis_partition_id
      - primary_field_id
      - certified_episode_id
    diagnostic: CENTERED_WEIGHTED_VARIANCE_INFLATION_FACTOR
    vif_definition: ONE_DIVIDED_BY_ONE_MINUS_WEIGHTED_AUXILIARY_R_SQUARED
    pass_rule: EVERY_COLUMN_VIF_STRICTLY_LESS_THAN_5
    threshold: 5.0
    threshold_boundary_counts_as_pass: false
    exact_or_numerical_rank_deficiency_action: FAIL_SEPARATE_CHANNEL_GATE
    zero_weighted_variance_action: FAIL_SEPARATE_CHANNEL_GATE
    missing_or_nonfinite_vif_action: FAIL_SEPARATE_CHANNEL_GATE
    failed_action: COLLAPSE_TO_ANY_PEER_SIGNAL_OR_CAPACITY_AND_FORFEIT_SEPARATE_CHANNEL_CLAIM
    automatic_single_variable_deletion_allowed: false
    sample_size_and_interval_precision_must_also_be_considered: true
    claim_role: CONSERVATIVE_CHANNEL_STABILITY_POLICY_NOT_UNIVERSAL_VIF_TRUTH

