review_contract:
  request_seed: pivot-feedback-d0-t10151-rank5-cross-provider-v1
  target_topic_name: Hepatitis B Virus Infection
  target_definition: >-
    Substantive study of hepatitis B virus or hepatitis B infection, including
    its biology, transmission, prevention, diagnosis, treatment, complications,
    or clinical and population outcomes. Hepatitis without title-level evidence
    of type B or HBV remains ambiguous; another explicit disease or subject is
    off-topic.
  prompt_text: |-
    Classify each scholarly work using only the supplied target topic,
    definition, title, language, and work type. Do not infer or use authors,
    year, source, citation, identifiers outside the opaque item ID, episode,
    treatment assignment, outcomes, or downstream effects.

    Assign exactly one label and confidence to every item:
    ON_TOPIC: affirmative title-level evidence that the work substantively
    studies, applies, measures, or develops the target topic.
    AMBIGUOUS: a plausible relation exists, but title-only evidence is
    insufficient for ON_TOPIC or OFF_TOPIC.
    OFF_TOPIC: affirmative title-level evidence of a different subject or only
    coincidental lexical overlap.
    UNREVIEWABLE: missing, corrupted, opaque, or uninterpretable title.

    Be conservative: broad medical or infectious-disease proximity is not
    enough for ON_TOPIC. Return exactly one decision for each supplied opaque
    item_id, with no omissions or duplicates. Keep each rationale concise and
    grounded only in title text.
  labels: [ON_TOPIC, AMBIGUOUS, OFF_TOPIC, UNREVIEWABLE]
  confidence_levels: [HIGH, MEDIUM, LOW]
  exact_items: 25
  request_visible_fields:
    - item_id
    - target_topic_name
    - target_definition
    - title
    - language
    - work_type
  forbidden_request_fields:
    - openalex_id
    - work_numeric_id
    - publication_year
    - entry_year
    - field_id
    - topic_id
    - field_candidate_rank
    - window_code
    - source_id
    - source_name
    - source_file_index
    - source_row_group
    - primary_topic_score
    - selection_sha256
    - author
    - citation
    - entry_outcome
    - persistence_outcome
  response_fields: [item_id, label, confidence, rationale]
  maximum_rationale_characters: 240
  consensus_accept: BOTH_LABEL_ON_TOPIC_AND_CONFIDENCE_HIGH
  consensus_reject: BOTH_LABEL_OFF_TOPIC_AND_CONFIDENCE_HIGH
  all_other_results: REMAIN_UNRESOLVED
  local_recent_accept_rows: 27
  local_recent_reject_rows: 12
  local_recent_unresolved_rows: 25
  recent_denominator_rows: 64
  pass_lower_bound_rows: 32
  fail_lower_bound_rows: 32
  pass_rule: AUGMENTED_ACCEPT_ROWS_AT_LEAST_32
  fail_rule: AUGMENTED_REJECT_ROWS_AT_LEAST_32
  otherwise_rule: CONTENT_UNRESOLVED
  human_review: NOT_RUN_BY_DESIGN
  api_labels_are_ground_truth: false
  evidence_role: POST_DIAGNOSTIC_TITLE_ONLY_AUGMENTATION

