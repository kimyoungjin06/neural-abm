    - EVERY_EARLIER_NONSELECTED_ROW_HAS_CONTENT_FAIL_OR_STRUCTURAL_INCOMPATIBILITY
    - NO_NOT_EVALUATED_ROW_CAN_OUTRANK_OR_REPLACE_EITHER_SELECTED_ROW
