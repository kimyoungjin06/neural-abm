    - CONTENT_PASS
    - CONTENT_FAIL
    - CONTENT_UNRESOLVED
    - NOT_EVALUATED
  fail_closed_state: CONTENT_UNRESOLVED
  certificate_requirements:
    - FIRST_SELECTED_IS_HIGHEST_RANKED_CONTENT_PASS
