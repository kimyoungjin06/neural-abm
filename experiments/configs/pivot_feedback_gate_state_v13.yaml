claim_boundary: >-
  This additive scope correction binds an independently verified zero-cost
  expansion of 70,277 candidates into 421,662 six-year window rows. The
  candidate universe contains 994 topics and represents 22,437,851 distinct
  linked works; overlapping eager candidate copies would create 102,900,039
  memberships. The frozen four-card router covers only four topics and 236
  candidate rows, so it cannot screen the complete universe. A complete
  title-bearing copy is withdrawn as the immediate next step. Only an adaptive
  frontier contract, equivalence fixtures, and zero-cost structural frontier
  materialization are authorized. The frontier may replace eager evaluation
  only after independent proof that no unresolved or unevaluated candidate can
  alter the selected compatible pair. Raw title scanning, topic-card
  expansion, content dispositions, paid API submission, reselection, author
  panels, pivot classification, outcomes, fitting, G4, and scientific effects
  remain not run, unauthorized, incomplete, sealed, or not established.
