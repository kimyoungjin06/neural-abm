claim_boundary: >-
  The versioned metadata-only G0 v1 successor skeleton is independently valid
  and preserves the original prospective overlay while serializing only two
  D0-resolved, outcome-independent values. It is not a G0 freeze or seal.
  Seventeen quantitative choices, all fifteen required sections, the G-1
  receipt, and the holdout-seal receipt remain unresolved blockers. This gate
  authorizes only a metadata-only plan that separates those four closure
  workstreams. It does not authorize executing a closure, resolving another
  value, completing a section, opening confirmatory or holdout data, selecting
  by outcome, establishing final eligibility, sealing G0, fitting a model,
  opening G4, asserting causality, or establishing a scientific effect.
