schema_version: pivot_learning_strength.v1
label: pivot_learning_strength_v1
status: PRECOMMIT_DESIGN_NO_RESULT_INTERPRETATION
registered_on: '2026-10-30'
open_item: O39_study2_at_a_learning_strength_the_data_allow
purpose: >-
  Study 2's imitative arm raises failed pivots by +0.281 at baseline and
  +0.289 under seed grants against the frozen arm (R5 of the case study), a
  pattern the case study calls a self-reinforcing outcome-learning loop.
  Under the peer-outcome estimator of recommended experiment 4, that arm
  answers a neighbor's outcome far more strongly than the OpenAlex coauthor
  data allow: its visible outcome gap is at least 6.95 log-odds, and the
  data's upper bound is 0.79 (C93, post hoc). Does the loop survive when the
  learning rate is cut until the same estimator finds a gap the data allow,
  and when outcomes become visible only after a delay?

