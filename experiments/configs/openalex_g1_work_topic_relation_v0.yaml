relation_policy:
  raw_edge_key:
    - work_id
    - topic_id
  score_canonicalization: ieee754_float64_little_endian_normalize_negative_zero
  score_minimum_inclusive: 0.0
  score_maximum_inclusive: 1.0
  duplicate_policy: collapse_only_same_key_same_canonical_score
  score_conflict_policy: block_without_choosing_first_max_mean_or_other_value
  preserve_raw_duplicate_counts: true
  primary_child_denominator: retained_main_rows_with_non_null_primary_topic
  null_primary_is_not_missing_child: true
  structural_sensitivity_views:
    - grammar_valid_including_w0
    - positive_work_ids_only

