claim_boundary: >-
  A full component pass establishes exact current-snapshot multiplicity for the
  declared work-topic relation, promotes only a frozen set-semantics view whose
  duplicate rows have the same canonical score, verifies that every retained
  non-null main primary topic occurs among that work's child topic edges, and
  reports exact structural deltas between the grammar-valid W0-retaining and
  positive-work-ID views. Raw duplicate presence remains separately visible.
  It does not establish W0 entity validity, historical inventory-era byte
  identity, publication or cutoff-aware availability, author entity or
  candidate validity, G-1 or G0, empirical G1, final field selection, or a
  scientific effect. A max-files or hash-bucket run is pilot-only and can
  never receive the full component status.
