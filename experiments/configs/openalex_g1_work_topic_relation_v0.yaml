  topic_pattern: '^https://openalex[.]org/T([1-9][0-9]*)$'
  work_prefix: https://openalex.org/W
  topic_prefix: https://openalex.org/T
  topic_bits: 14
  null_primary_topic_code: 0
  encoding: '(work_numeric_uint64 << 14) | topic_numeric_uint14'
  require_runtime_shift_overflow_check: true

