claim_boundary: >-
  Six outcome-blind risk-set, weighting, support, suppression, and collinearity
  policies and their closed synthetic fixture are independently valid. The
  values are explicit conservative design policies, not literature-mandated
  truths, power guarantees, production measurements, or empirical effects.
  The one-through-ten suppression rule is analogous and does not assert CMS
  jurisdiction over OpenAlex. This gate authorizes only an additive G0 v4
  binding successor for the exact six choices. It does not run discovery
  production application, resolve the other seven choices, complete required
  sections, materialize or seal G4, read confirmatory rows, pass G0, fit a
  model, open G4, assert causality, or establish a scientific effect.
