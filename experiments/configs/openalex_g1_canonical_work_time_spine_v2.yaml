claim_boundary: >-
  This IMPLEMENTED_PRODUCTION_CAPABLE_PRODUCTION_NOT_RUN contract makes the
  standalone current-snapshot canonical work-time spine runnable with a
  bounded external-memory algorithm, but it records no production result.
  A full component pass may be emitted only after the exact current-content
  and temporal-v3 parents, all 493 source tasks, 492293207 raw rows,
  492293206 retained rows, 4096 partitions, 9185 receipt artifacts, streaming
  final validation, and receipt-last completion all pass. Parent validation
  opens control artifacts and live stat metadata only; it does not repeat the
  old five-column temporal payload scan. The component's own three-column
  source projection is scanned exactly once in a successful fresh full run.
  Pilot and closed-test schemas and statuses are distinct and nonpromotable.
  Even a production component pass establishes only a deterministic
  current-byte row-level spine commitment. It does not establish historical
  content identity, W0 entity validity, row-level identity to a temporal-v3
  artifact, citation chronology or observation time, author or candidate
  validity, G-1, G0, empirical G1, an NABM effect, or any scientific effect.
  Existing author-v1 and citation-v1 consumers require explicit versioned
  rebinding and are not promoted automatically. Production remains
  PRODUCTION_NOT_RUN until a valid local receipt exists. Real-HDD throughput
  remains unbenchmarked, and the one-file pilot, fresh source-drive health
  review, source quiet-window review, downstream-pipeline capacity review,
  independent read-only verifier, and new explicit full authorization remain
  NOT_RUN, PENDING, or NOT_GRANTED.
