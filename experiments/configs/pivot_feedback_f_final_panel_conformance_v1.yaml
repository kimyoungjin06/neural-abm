claim_boundary: >-
  This outcome-blind F component replays all aggregate-screen-eligible fields
  in each frozen primary/reserve order as author-token opportunities with exact predecision focal-author and
  preexisting-target-active-peer leaveouts, and checks only label-independent
  support. It does not compute entry or persistence labels, apply case-control
  sampling or outcome-conditioned support, inspect a confirmatory or G4 effect,
  emit raw identifiers, fit a model, pass F or G0, establish transport or
  causality, or establish a scientific effect. Outcome-conditioned support is
  a frozen G1 runtime prerequisite and is not used as a circular F gate.
