claim_boundary: >-
  This versioned metadata-only successor preserves the original prospective
  G0 overlay byte-for-byte through its immutable SHA-256 binding and copies
  its fixed design without change. It serializes only two D0-resolved,
  outcome-independent choices: no minimum author-history work count and the
  exact threshold-free four-state pivot classifier. Seventeen quantitative
  choices and all fifteen required sections remain not freeze-ready, while
  the G-1 and holdout-seal bindings remain pending and null. This skeleton
  cannot pass or seal G0, open confirmatory or holdout data, establish final
  eligibility, fit a model, open G4, support causality, or establish a
  scientific effect.
