adjudication_policy:
  duplicate_key: [work_id, topic_id]
  canonical_rule: >-
    For a conflicting duplicate edge, require exactly one main marker for the
    same packed work-topic key, read the frozen main source row located by that
    marker, and select its exact canonical primary_topic score only when that
    score is present among the child topic rows. Otherwise remain blocked.
  forbid_unconditional_first_max_mean_or_min: true
  require_every_parent_conflict_observed: true
  require_no_unexpected_conflict: true
  preserve_every_conflict_row_in_sidecar: true
  nonconflicting_duplicate_rule: collapse_same_key_same_exact_canonical_score
  unresolved_conflict_policy: block_without_publishing_deduplicated_relation

