claim_boundary: >-
  This successor does not rerun topic classification and does not alter raw
  OpenAlex rows. It derives one deterministic set-semantics relation from the
  exact blocked full-scope parent receipt. Same-score duplicates collapse
  unchanged. A score-conflicting duplicate is resolved only when the frozen
  main row's exact primary-topic ID and score identify a child score for the
  same edge; all raw conflicting rows and locators remain in a receipt-bound
  sidecar. The result establishes current-snapshot work-topic membership and
  canonical score selection under this narrow policy only. It does not
  establish raw source-ID validity, W0 entity validity, publication or
  temporal validity, author or candidate validity, G-1 or G0, empirical G1,
  a learned NABM parameter, or a scientific effect.
