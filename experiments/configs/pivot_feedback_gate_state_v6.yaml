claim_boundary: >-
  This additive ledger preserves the v5 author-foundation record and adds an
  independently replayed selected-work-to-author-token linkage audit. The
  severe and heterogeneous work-type/linkage gap means that the current
  all-work attention episodes and author-linked incumbent/network measurements
  do not share a stable observation universe. The current four episodes remain
  historical provisional D0-A selections but are not authorized for further
  leave-out, peer, or bridge construction. Only outcome-blind measurement-ABI
  redesign and a versioned deterministic episode-reselection successor are
  authorized. No eligible work type, linkage threshold, or episode exclusion
  has yet been selected. D0-B and D0 remain incomplete; entry and persistence
  outcomes, G0, final-panel materialization, model fitting, G4, empirical
  signatures, causal effects, and scientific effects remain not authorized,
  pending, paused, sealed, not run, or not established.
