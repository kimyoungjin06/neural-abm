  receipt_sha256: 86be1808a3272ba7a892d8aa90f4d3687f0d253474d1b4470dad1940e4ff5280
  required_receipt_schema_version: pivot_feedback_d0_content_indexing_audit_outputs.v1
  required_receipt_status: PASS_D0_CONTENT_INDEXING_EXTRACTION_HUMAN_REVIEW_REQUIRED
