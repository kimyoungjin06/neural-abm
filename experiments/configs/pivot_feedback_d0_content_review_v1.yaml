  template_sha256: 9fe7a70a7e7e839c3272a5d146b48674dd248932491595dc7bf8c124e9e2e6d9
  expected_rows: 384
  required_blank_columns:
    - reviewer_1_label
    - reviewer_2_label
    - adjudicated_label
    - review_notes

review_contract:
  unit: SAMPLED_WORK_TITLE
  reviewer_count: 2
  reviewers_must_be_distinct_humans: true
  artificial_agent_may_substitute_for_human_reviewer: false
  independent_completion_before_comparison: true
  reviewer_discussion_before_freeze_allowed: false
  complete_case_required: true
  labels: [ON_TOPIC, AMBIGUOUS, OFF_TOPIC, UNREVIEWABLE]
  label_definitions:
    ON_TOPIC: TITLE_DIRECTLY_SUPPORTS_THE_TARGET_TOPIC_OR_A_CLEAR_SYNONYM
    AMBIGUOUS: TITLE_IS_PLAUSIBLY_RELATED_BUT_INSUFFICIENT_FOR_A_CLEAR_DECISION
    OFF_TOPIC: TITLE_IS_CLEARLY_UNRELATED_OR_IS_AN_ARCHIVAL_OR_INVENTORY_OBJECT
    UNREVIEWABLE: TITLE_OR_LANGUAGE_DOES_NOT_SUPPORT_A_MEANINGFUL_ASSESSMENT
  notes_required_for: [AMBIGUOUS, OFF_TOPIC, UNREVIEWABLE]
  adjudicate_every_disagreement: true
  adjudicator_may_be_one_original_reviewer: false
  freeze_reviewer_files_before_adjudication: true
  report_exact_agreement: true
  report_cohen_kappa: true

blinding:
  item_id_algorithm: SHA256_HEX_OF_SEED_REVIEWER_AND_OPENALEX_ID
  item_id_seed: pivot-feedback-d0-content-review-item-v1
  reviewer_order_algorithm: SHA256_HEX_OF_SEED_REVIEWER_AND_OPENALEX_ID
  reviewer_order_seed: pivot-feedback-d0-content-review-order-v1
  separately_order_each_reviewer_packet: true
  visible_source_columns:
    - observed_primary_topic_name
    - title
    - language
    - observed_work_type
  reviewer_packet_columns:
    - review_item_id
    - target_topic_name
    - title
    - language
    - work_type
    - reviewer_label
    - reviewer_notes
  hidden_from_reviewers:
    - episode_index
    - field_id
    - topic_id
    - entry_year
    - window_code
    - work_numeric_id
    - openalex_id
    - expected_publication_year
    - observed_publication_year
    - expected_work_type_code
    - primary_topic_score
    - observed_primary_field_id
    - observed_primary_subfield_id
    - source_id
    - source_name
    - created_date
    - updated_date
    - source_file_index
    - source_row_group

