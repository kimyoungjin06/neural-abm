claim_boundary: >-
  This contract creates two separately ordered, title-only packets for two
  distinct human reviewers and a private adjudication key. Packet generation
  does not perform, simulate, or complete human review; does not classify any
  title; and does not promote or replace an episode. Entry, persistence,
  realized citation, prediction, G4, model fitting, leave-outs, network
  bridges, associations, causal mechanisms, and scientific effects remain
  unopened, unauthorized, not run, or not established.
