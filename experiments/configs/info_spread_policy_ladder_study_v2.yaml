world:
  degree: 6
  rewire: 0.1
  seeds_per_item: 3
  delay: 4
  visibility: 0.5
  epsilon: 0.02
  refit_every: 4
  base_rate: 0.4
  threshold_range:
  - 0.1
  - 0.4
  cost_levels_regime_b:
  - 0.5
  - 1.0
  - 2.0
  observability:
    label_mode: all
    one_row_per_agent_and_item: true
    meaning: 'public fact-checks: a learner trains on the outcome of every exposure it decided on, once per agent
      and item (its share, or else its last decline)'
learners:
  base_settings: pivot
  pooled_linear_l2: 0.0001
  agent_residual_l2: 0.01
  mlp: 'Pivot settings: 300 epochs, lr 0.02, weight decay 1e-4, hidden width 16; trained on a GPU with deterministic
    algorithms'
  linear: exact Newton ridge-logistic residual on the prior logit, fitted to convergence
arms:
- F0
- F1
- T0_1
- T0_4
- L0
design:
  regimes:
  - A
  - B
  families:
    A:
    - linear_exact
    - mlp
    B:
    - partial_linear_exact
    - partial_mlp
  geometries:
  - linear
  - smooth
  - axis
  - 'null'
  study_geometries:
  - linear
  - smooth
  - axis
  null_geometry: 'null'
  groups: 16
seeds:
  world_seed_offset: 7000
  donor_replicates:
  - 1000
  - 1001
  - 1002
  - 1003
  learner_tag: 9
  rule_tag: 9
measures:
  primary: unverified_share_precision
  primary_meaning: share precision over decided shares (the policy's and the exploration floor's) of items whose fact-check is not public at the decision step
  recorded: share_precision
  implementation: scripts/info_spread_unverified_measure_v1.py; every run checks its reconstruction against the simulator
  f0: probability form with identical decisions
rule:
  comparison: paired difference in the primary measure
  minimum_effect: 0.01
  bootstrap_resamples: 2000
  interval: 0.95
  resampling: cells, with replacement
  material: interval excludes zero and |mean cell delta| >= minimum_effect
dispositions:
  b_at_least: 4
  a_at_most: 1
  b_at_most_for_table_suffices: 1
  a_at_least_for_closed_loop_in_a: 4
  order:
  - AS_EXPECTED
  - TABLE_SUFFICES_EVEN_IN_B
  - CLOSED_LOOP_MATTERS_EVEN_IN_A
  - MIXED
  null_check: L0 - F1 on the primary measure material and positive in any null group is DESIGN_DEFECT_IN_NULL_WORLD
    and blocks reading the study groups
profiles:
  development:
    agents: 1000
    steps: 60
    items_per_step: 20
    replicates: 16
    cells: 20
  smoke:
    agents: 60
    steps: 20
    items_per_step: 4
    replicates: 2
    cells: 1
precommit:
  precommit_paths:
  - docs/research/info-spread-policy-ladder-study-v2.md
  - experiments/configs/info_spread_policy_ladder_study_v2.yaml
  - scripts/run_info_spread_policy_ladder_study_v2.py
  - tests/test_info_spread_policy_ladder_study_v2.py
runs:
  development: --profile development --precommit-sha <HEAD> on GPU-Server, CUDA_VISIBLE_DEVICES=2, 24 workers
  reproduction: the same command into a second output directory; cells.jsonl and summary.json must be byte identical
  pilot: --pilot-cells 2 under full load, for the time estimate only
outputs:
- cells.jsonl
- summary.json
- progress.jsonl
- receipt.json
boundaries:
  empirical_rows_read: 0
  llm_calls: 0
  generic_nabm_api_changed: false
  scientific_effect: NOT_ESTABLISHED
  synthetic_only: true
