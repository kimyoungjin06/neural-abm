claim_boundary: >-
  This amendment removes the logical G-1/G0 cycle by assigning primitive
  readiness, threshold-free structure, discovery calibration, measurement
  freeze, and final-panel conformance to distinct ordered gates. It preserves
  every v0 parent byte-for-byte and binds the completed cutoff source replay.
  Validation establishes only an acyclic prospective contract. It does not
  issue a G-1A receipt, run S0 or D0, pass G0 or G0.5, authorize model fitting,
  open G4, establish an empirical signature, or establish a scientific effect.
