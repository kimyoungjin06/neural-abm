claim_boundary: >-
  The metadata-only holdout-seal contract is independently valid and freezes
  the exact partition, future artifact schemas, atomic finalization, receipt-
  last rule, and fail-closed behavior. This gate authorizes only private
  creation of a seal over an explicit operator allowlist by hashing artifact
  bytes without parsing or analyzing rows, followed by a create-only receipt
  and independent read-only verification. It does not authorize seal opening,
  confirmatory or holdout row access, changing G0 v2, resolving values or
  sections, passing G0, fitting a model, opening G4, asserting causality, or
  establishing a scientific effect.
