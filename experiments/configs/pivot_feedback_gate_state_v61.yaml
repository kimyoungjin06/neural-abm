  G0 v4 independently preserves its immutable G0 v3 predecessor and binds only
  the six choices authorized by gate v60. Twelve choices are serialized in
  total, seven quantitative choices remain unresolved, and all fifteen required
  sections remain not freeze-ready. The values are outcome-blind conservative
  policies, have not been applied to production data, and do not establish
  efficiency, power, precision, causality, or empirical effects. This gate
  authorizes only a separate outcome-blind precommitment and closed synthetic
  fixture for the single G1 replication-tolerance choice. It does not authorize
  binding that value into G0, G1 access, G2 or G3 choices, production
  application, holdout access or sealing, model fitting, G0 passage, G4
  opening, causality, or a scientific effect.
