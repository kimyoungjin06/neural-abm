claims:
  confirmed:
  - id: C68_with_share_rates_matched_in_the_world_d5s_prior_costs_utility_through_its_calibration_in_regime_a
    statement: With each recalibrated prior's location matched to its source's share rate in the world, giving the
      learner P0's calibration still lowers utility along both routes in 6 and 6 of 6 Regime A groups, and P0's
      answers make no material difference at its own calibration (6 of 6 groups). Regime A stays CALIBRATION, as in
      O28.
    evidence:
    - source: o33_world_calibration
      pointer: dispositions/by_case/P0~1A/attribution
      equals: CALIBRATION
    - source: o33_world_calibration
      pointer: dispositions/by_case/P0~1A/o28_attribution
      equals: CALIBRATION
    - source: o33_world_calibration
      pointer: dispositions/by_case/P0~1A/counts/calibration_given_llm_answers/NEGATIVE
      equals: 6
    - source: o33_world_calibration
      pointer: dispositions/by_case/P0~1A/counts/calibration_given_hand_answers/NEGATIVE
      equals: 6
    - source: o33_world_calibration
      pointer: dispositions/by_case/P0~1A/counts/answers_given_llm_calibration/INDISTINGUISHABLE
      equals: 6
  - id: C69_in_regime_b_with_share_rates_matched_d5s_prior_costs_utility_through_its_calibration_and_the_models_answers
    statement: In Regime B, with the location matched in the world, P0's answers also lower utility along both
      routes (6 and 5 of 6 groups), and its calibration still does (4 and 4 of 6). The case is BOTH, where O28, with
      the cohort match, found CALIBRATION.
    evidence:
    - source: o33_world_calibration
      pointer: dispositions/by_case/P0~1B/attribution
      equals: BOTH
    - source: o33_world_calibration
      pointer: dispositions/by_case/P0~1B/o28_attribution
      equals: CALIBRATION
    - source: o33_world_calibration
      pointer: dispositions/by_case/P0~1B/counts/answers_given_hand_calibration/NEGATIVE
      equals: 6
    - source: o33_world_calibration
      pointer: dispositions/by_case/P0~1B/counts/answers_given_llm_calibration/NEGATIVE
      equals: 5
    - source: o33_world_calibration
      pointer: dispositions/by_case/P0~1B/counts/calibration_given_llm_answers/NEGATIVE
      equals: 4
    - source: o33_world_calibration
      pointer: dispositions/by_case/P0~1B/counts/calibration_given_hand_answers/NEGATIVE
      equals: 4
  - id: C70_in_regime_b_with_share_rates_matched_the_unclipped_priors_cost_is_the_models_answers
    statement: For the unclipped prior P0u in Regime B, with the location matched in the world, its answers lower
      utility along both routes (6 and 5 of 6 groups), including at its own calibration, where O28 found them
      raising it in 4 of 6. Its calibration lowers utility given its own answers (4 of 6) and is mixed given F1's.
      The case is ANSWERS, where O28 found NEITHER_CONSISTENTLY. In Regime A, where this prior carries no utility
      cost, its answers raise utility at its own calibration (5 of 6).
    evidence:
    - source: o33_world_calibration
      pointer: dispositions/by_case/P0u~1B/attribution
      equals: ANSWERS
    - source: o33_world_calibration
      pointer: dispositions/by_case/P0u~1B/o28_attribution
      equals: NEITHER_CONSISTENTLY
    - source: o33_world_calibration
      pointer: dispositions/by_case/P0u~1B/counts/answers_given_hand_calibration/NEGATIVE
      equals: 6
    - source: o33_world_calibration
      pointer: dispositions/by_case/P0u~1B/counts/answers_given_llm_calibration/NEGATIVE
      equals: 5
    - source: o33_world_calibration
      pointer: dispositions/by_case/P0u~1B/by_comparison/calibration_given_llm_answers
      equals: MOSTLY_NEGATIVE
    - source: o33_world_calibration
      pointer: dispositions/by_case/P0u~1B/by_comparison/calibration_given_hand_answers
      equals: MIXED_OR_NONE
    - source: o33_world_calibration
      pointer: dispositions/by_case/P0u~1A/counts/answers_given_llm_calibration/POSITIVE
      equals: 5
  - id: C71_with_world_matched_calibration_no_llm_informed_start_beats_the_hand_rules_start_under_utility
    statement: Against the learner started from F1 (L0), each LLM-informed start in O33 is MOSTLY_NEGATIVE under
      utility in 5 of the 8 prior and regime cases and MIXED_OR_NONE in 3. None is MOSTLY_POSITIVE. The closest is
      F1's answers at the unclipped prior's Regime B calibration, positive in 3 of 6 groups.
    evidence:
    - source: o33_world_calibration
      pointer: dispositions/by_case/P0~1A/by_comparison/calibration_given_hand_answers
      equals: MOSTLY_NEGATIVE
    - source: o33_world_calibration
      pointer: dispositions/by_case/P0~1A/by_comparison/answers_given_hand_calibration
      equals: MOSTLY_NEGATIVE
    - source: o33_world_calibration
      pointer: dispositions/by_case/P0~1B/by_comparison/calibration_given_hand_answers
      equals: MOSTLY_NEGATIVE
    - source: o33_world_calibration
      pointer: dispositions/by_case/P0~1B/by_comparison/answers_given_hand_calibration
      equals: MOSTLY_NEGATIVE
    - source: o33_world_calibration
      pointer: dispositions/by_case/P0u~1A/by_comparison/calibration_given_hand_answers
      equals: MIXED_OR_NONE
    - source: o33_world_calibration
      pointer: dispositions/by_case/P0u~1A/by_comparison/answers_given_hand_calibration
      equals: MIXED_OR_NONE
    - source: o33_world_calibration
      pointer: dispositions/by_case/P0u~1B/by_comparison/answers_given_hand_calibration
      equals: MOSTLY_NEGATIVE
    - source: o33_world_calibration
      pointer: dispositions/by_case/P0u~1B/counts/calibration_given_hand_answers/POSITIVE
      equals: 3
  - id: C72_a_location_set_on_calibration_worlds_matches_the_share_rates_out_of_sample
    statement: Setting each recalibrated prior's intercept on 24 calibration runs per regime, at world seeds disjoint
      from the study cells, matched its source's mean unverified share count on those runs within 0.02%. F1 at P0's
      Regime A calibration kept O28's intercept and the other seven were bisected. On the study cells each
      world-calibrated fixed prior shared 0.984 to 1.001 times as many unverified items as its source, against 0.20
      to 1.48 under O28's cohort match. Only the location was set this way; the steepness stayed O28's.
    evidence:
    - source: o33_world_calibration
      pointer: world_calibration/A/F1_pcalw/method
      equals: KEPT_COHORT_LOCATION
    - source: o33_world_calibration
      pointer: world_calibration/B/F1_pcalw/method
      equals: BISECTED
    - source: o33_world_calibration
      pointer: world_match_check/F1_pcalw~1B/matches
      equals: true
    - source: o33_world_calibration
      pointer: world_match_check/F1_pcalw~1B/ratio_to_calibration_source
      greater_than: 0.98
    - source: o33_world_calibration
      pointer: world_match_check/P0u_hcalw~1A/matches
      equals: true
    - source: o33_world_calibration
      pointer: world_match_check/P0u_hcalw~1A/ratio_to_calibration_source
      less_than: 1.002
  - id: C73_o33_reproduced_byte_for_byte_with_parity_and_consistency
    statement: O33 reproduced its cells and summary byte for byte in a second run on GPU-Server, world calibration
      included. L0 recomputed in all 240 learner tasks equalled its record, and every group's L1 - L0 and L1u - L0
      equalled O25's recorded value.
    evidence:
    - source: o33_world_calibration
      pointer: reproduction/byte_identical/cells.jsonl
      equals: true
    - source: o33_world_calibration
      pointer: reproduction/byte_identical/summary.json
      equals: true
    - source: o33_world_calibration
      pointer: parity_failures
      equals: []
    - source: o33_world_calibration
      pointer: consistency_failures
      equals: []
  rejected:
  - id: R21_c63_holds_with_share_rates_matched_in_the_world
    statement: The O33 expectation stated before the run, that C63 holds (CALIBRATION for P0/A and P0/B) when each
      recalibrated prior's location is matched to its source's share rate in the world.
    reason: It holds in Regime A. In Regime B, D5's prior is BOTH.
    evidence:
    - source: o33_world_calibration
      pointer: dispositions/holds/C63
      equals: false
    - source: o33_world_calibration
      pointer: dispositions/overall
      equals: O33_NEITHER_HOLDS
  open:
  - id: O34_steepness_matched_in_the_world
    question: Do the Regime B attributions (C69, C70) hold when a recalibrated prior's steepness, and not only its
      location, is matched to its source in the world?
    kind: SYNTHETIC
    priority: 1
    motivation: O33 matched only the location in the world. The steepness stayed O28's, matched on the cohort.
