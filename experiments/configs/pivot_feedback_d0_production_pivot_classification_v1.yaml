claim_boundary: >-
  This build deterministically applies the frozen threshold-free four-state
  observable-history definition to the independently verified three-count
  source without changing or filtering any of its 3,256,271 rows. A
  NEW_TOPIC_ENTRY is zero prior observed target-topic work plus at least one
  focal-year work under the current-snapshot ABI; it is not true lifetime-first
  entry. The build may not read raw work or author-event partitions, open
  post-entry persistence or impact, create API requests, establish final
  eligibility, freeze G0, fit a model, open G4, or establish an association,
  causal mechanism, or scientific effect.
