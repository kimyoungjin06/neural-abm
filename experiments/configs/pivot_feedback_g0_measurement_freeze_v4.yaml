claim_boundary: >-
  This versioned G0 v4 successor preserves G0 v3 and makes only the
  v60-authorized six-choice binding change. It serializes ten controls per
  case, nearest-rank P01-P99 stabilized-weight winsorization, the
  500/100/100 cohort floor, suppression of counts one through ten, the
  50/11/11 four-cell capacity floor, and a strict VIF-below-five rule without
  applying them to production data. The values are outcome-blind conservative
  design policies, not literature-mandated truths, power guarantees, or
  effects, and the CMS threshold is used only by analogy. The holdout receipt
  remains absent, seven quantitative choices remain unresolved, all fifteen
  required sections remain not freeze-ready, and G0 remains unsealed. No
  operator row data, confirmatory or holdout data, API request, model, G4
  result, causality, or scientific effect is established.

