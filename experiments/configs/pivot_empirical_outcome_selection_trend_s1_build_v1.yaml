  - DATE_YEAR_DIFFERS_FROM_PUBLICATION_YEAR
  any_failure: STOP_SOURCE_INVALID
  dispositions:
    0: BOTH_NULL_EXCLUDED
    1: VALID_PRE_1900_EXCLUDED
    2: USABLE_1900_BEFORE_SNAPSHOT_YEAR
    3: USABLE_SNAPSHOT_YEAR_ON_OR_BEFORE_SNAPSHOT
    4: VALID_SNAPSHOT_YEAR_AFTER_SNAPSHOT_EXCLUDED
    5: VALID_POST_SNAPSHOT_YEAR_EXCLUDED
  allowed: [2, 3]

extract:
  rows: ELIGIBLE_WORKS_WHOSE_PRIMARY_FIELD_IS_REGISTERED_AND_YEAR_AT_MOST_2017
  fields: [16, 32, 11]
  latest_year: 2017
  type_names: [article, book, book-chapter, book-section, dissertation, preprint, report, review]
  type_codes_from_abi: [1, 2, 3, 4, 7, 16, 18, 21]
  paratext_true: EXCLUDE
  paratext_null: RETAIN_AND_COUNT
  retracted_true: EXCLUDE
  retracted_null: RETAIN_AND_COUNT
  is_xpac: RETAINED_UNDER_THE_INHERITED_RULES_FLAG_KEPT_SHARE_REPORTED
  authorships: DISTINCT_WORK_AUTHOR_PAIRS
  work_columns: [work_id, year, date, topic, subfield, field, score, source, is_xpac, retracted_null]
  topic_hierarchy_check: EVERY_TOPIC_HAS_ONE_SUBFIELD_AND_ONE_FIELD_IN_THE_EXTRACT
  ordering: WORK_ID_THEN_AUTHOR_ID

build:
  first_topic_year: MINIMUM_ELIGIBLE_YEAR_PER_AUTHOR_AND_TOPIC_OVER_THE_WHOLE_EXTRACT
  attention:
    work_universe: EXTRACT_WORKS_WITH_AT_LEAST_ONE_LINKED_AUTHOR
    incumbent_only_work: THE_LATEST_FIRST_TOPIC_YEAR_AMONG_ITS_AUTHORS_IS_AT_MOST_T_MINUS_7
    counts: PER_FIELD_TOPIC_DECISION_YEAR_AND_OFFSET_MINUS_6_TO_MINUS_1
    decision_years: [2000, 2012]
  surge: N10_V1_SURGE_FLAGS_FUNCTION_THRESHOLD_3_0
  episodes: N10_V1_SELECT_EPISODES_FUNCTION_SPACING_3
  indexing_screen:
    windows: ALL_EXTRACT_WORKS_OF_THE_TOPIC_IN_THE_REFERENCE_AND_RECENT_OFFSETS
    score_drop: MEDIAN_REFERENCE_SCORE_MINUS_MEDIAN_RECENT_SCORE_AT_LEAST_0_15
    source_rise: RECENT_DOMINANT_SOURCE_SHARE_MINUS_REFERENCE_DOMINANT_SOURCE_SHARE_AT_LEAST_0_25
    dominant_source_share: LARGEST_SINGLE_SOURCE_SHARE_AMONG_WORKS_WITH_A_SOURCE
    exclude_when: BOTH_HOLD
    undefined_window: NOT_EXCLUDED_AND_COUNTED
  exclusions_by_construction:
  - REGISTERED_FIELDS_EXCLUDE_17_AND_27_SO_NO_D0_EPISODE_CAN_APPEAR
  - DECISION_YEARS_2000_2012_SO_NO_F_PARTITION_EPISODE_CAN_APPEAR
  partition: N10_V1_PARTITION_FAMILIES_FUNCTION
  entrants:
    rule: FIRST_TOPIC_YEAR_IN_DECISION_YEAR_TO_PLUS_2
    entry_date: EARLIEST_DATE_AMONG_THE_AUTHOR_TOPIC_WORKS_IN_THE_ENTRY_YEAR
    clock: N10_V2_ENTRY_CLOCK_FUNCTION
    pivot_eligibility: AT_LEAST_ONE_EXTRACT_WORK_IN_THE_EPISODE_FIELD_IN_ENTRY_YEAR_MINUS_3_TO_MINUS_1
  g4_guard:
    path: /ssd/pivot-feedback-f-g4-private-membership-v1-20260804/private/g4_author_cold_guard.parquet
    sha256: 90f79d46dd16e83088a258aeafd795541d918e4afb1915feadd5648523b5ca3a
    rows: 8174698
    column: author_numeric_id
    rule: ANTI_JOIN_ENTRANTS_ON_THE_EXACT_NUMERIC_AUTHOR_ID_BEFORE_ANY_FLOOR_OR_PARTITION_COUNT
    reads: THE_AUTHOR_ID_COLUMN_ONLY
    reported: REMOVED_ENTRANT_COUNT_ONLY
  discovery_exclusion: CONFIRMATORY_ENTRANTS_WHO_ENTER_ANY_DISCOVERY_EPISODE_ARE_REMOVED_AFTER_THE_G4_GUARD
  floors: N10_V2_EPISODE_VALIDITY_ON_ENTRANTS_WITHOUT_PERSISTENCE
  persistence_labels_computed: 0

