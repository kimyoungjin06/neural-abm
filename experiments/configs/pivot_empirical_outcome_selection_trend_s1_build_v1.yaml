  the structural build. It reads column-limited Works rows of the complete
  2026-06-26 snapshot and writes the eligible work extract, the episodes, the
  discovery and confirmatory partition, and the entrants of every episode. It
  computes no persistence label. A run needs a committed user authorization
  file in addition to this precommit.
