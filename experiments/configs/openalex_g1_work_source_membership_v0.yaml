claim_boundary: >-
  A successful run establishes exact row accounting for the frozen 23-table
  source-ID scope, exact membership of every retained child source work ID in
  the 492,293,206-ID grammar-valid main-work set, measured open-world coverage
  for the declared referenced-work and related-work target columns, and a
  descriptive authorship author-ID/work profile with year, primary-field, and
  authors-count strata. The untouched raw source remains blocked on ID validity
  because it contains W-1. W0 remains retained with unresolved entity validity.
  A target absent from the main snapshot is a coverage observation, not a
  source orphan. This contract does not validate non-work entity identifiers,
  materialize a filtered child dataset, establish inventory-era byte identity,
  establish author or field entity validity, establish temporal or leakage
  safety, select candidate researchers, establish G-1 data readiness, run
  empirical G1, or establish any scientific effect.
