  human reviewers. The APIs agree on 306 rows and identify 197 dual-HIGH
  ON_TOPIC candidates, but API agreement cannot substitute for the frozen
  human calibration. Neither human packet has been completed. Episode 3
  remains quarantined, the other episodes are not promoted, and the prior
  author panel remains superseded. D0, complete-candidate-universe screening,
  downstream measurement, outcomes, G0, model fitting, G4, and scientific
  effects remain incomplete, unauthorized, sealed, not run, or not established.
