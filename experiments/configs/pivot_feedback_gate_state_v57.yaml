claim_boundary: >-
  The production-input resolver independently confirms from bound repository
  metadata that the G4 partition is logically reserved but no selected G4
  domain, selected field, or materialized artifact set exists. The available
  D0 entry source ends in 2012 and is not a substitute for the 2020-2022
  domain- and author-cold package. No operator directory was listed or scanned,
  no holdout path or byte was enumerated or hashed, and no production preflight,
  byte seal, receipt, or independent receipt verification was run. This gate
  does not open a holdout, pass G0, fit a model, open G4, assert causality, or
  establish a scientific effect.
