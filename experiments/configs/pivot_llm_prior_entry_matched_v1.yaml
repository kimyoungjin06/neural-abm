  sha256: db4a910caa35153aea8608a7386b4b0f14f45743b65cae65a2103e2fb73ffa2b
  prior_used: llm_base_rate

priors:
  direction: >-
    THE_FEATURE_WEIGHTS_OF_A_PRIOR_KEPT_EXACTLY_HAND_FROM_THE_HAND_INITIAL_POLICY_LLM_FROM_THE_V2_BASE_RATE_PRIOR
  selectivity: >-
    THE_MEAN_FIXED_RULE_CUMULATIVE_ENTRY_RATE_THE_PRIOR_PRODUCES_IN_THE_WORLD
  matched_level: >-
    ONLY_THE_INTERCEPT_IS_SHIFTED_UNTIL_THE_FIXED_RULE_ENTRY_IN_THE_WORLD_EQUALS_THE_OTHER_DIRECTIONS_NATIVE_ENTRY
  hand_through_the_slot: >-
    THE_HAND_PRIOR_IS_PASSED_THROUGH_THE_PRIOR_SLOT_AS_ITS_FLOAT64_WEIGHTS_AND_BIAS_AND_MUST_REPRODUCE_THE_HAND_RULE_EXACTLY_AT_ZERO_SHIFT

entry_calibration:
  method: BISECTION_ON_THE_INTERCEPT_SHIFT_PER_WORLD_AND_MATCHED_LEVEL
  arm: fixed_rule
  exploration: NONE
  base_seed: 20261203
  probe_base_seed: 20261204
  replicates: 16
  target: MEAN_FIXED_RULE_ENTRY_OF_THE_SOURCE_DIRECTION_AT_ITS_NATIVE_LEVEL_ON_THE_SAME_CALIBRATION_REPLICATES
  bracket: [-12.0, 12.0]
  bisection_iterations: 40
  chosen_shift: THE_EVALUATED_MIDPOINT_WITH_THE_SMALLEST_ABSOLUTE_ENTRY_GAP_FIRST_ON_TIES
  in_sample_relative_tolerance: 0.01
  out_of_sample_ratio_bounds: [0.95, 1.05]
  out_of_sample_check: >-
    IN_THE_STUDY_REPLICATES_THE_FIXED_RULE_ENTRY_OF_EACH_MATCHED_CONDITION_WITHOUT_EXPLORATION_OVER_ITS_SOURCE_IS_WITHIN_THE_BOUNDS_IN_EVERY_WORLD
  failure_action: ENTRY_MATCH_FAILED_STOP_NO_DECISION_INTERPRETED

exploration_floor:
  rule: V3_EXPLORATION_ADAPTER_UNCHANGED
  exploratory_share: 0.2
  epsilon_from_share: ONE_MINUS_ONE_MINUS_SHARE_TO_THE_POWER_ONE_OVER_OPEN_STEPS
  open_steps: 16

conditions:
  - {id: hand, direction: hand, level: native, exploratory_share: 0.0, role: INCUMBENT_RULE}
  - {id: llm_selective, direction: llm, level: native, exploratory_share: 0.0, role: LLM_PRIOR_AT_ITS_OWN_SELECTIVITY}
  - {id: hybrid_20, direction: llm, level: native, exploratory_share: 0.2, role: C22_HYBRID}
  - {id: hand_at_llm_entry, direction: hand, level: llm_entry, exploratory_share: 0.0, role: HAND_DIRECTION_AT_LLM_SELECTIVITY}
  - {id: hand_at_llm_entry_20, direction: hand, level: llm_entry, exploratory_share: 0.2, role: ENTRY_MATCHED_CONTROL_FOR_C22}
  - {id: llm_at_hand_entry, direction: llm, level: hand_entry, exploratory_share: 0.0, role: LLM_DIRECTION_AT_HAND_SELECTIVITY}

common_environment:
  scenario: hot_field_hype
  state_model: persistence_exit_v1
  learning_mode: imitative
  transition:
    failed_minimum_active_steps: 2
    failed_continuation_score:
      productive_fit_weight: 0.5
      current_policy_output_weight: 0.5
      exit_below: 0.4
    reentry_after_exit: false

inherited_learning_parameters:
  neighbor_count: 4
  within_stage_probability: 0.6
  learning_rate: 1.5
  prior_anchor: 0.25
  local_alpha: 0.45
  local_noise_scale: 0.02
  social_alpha: 0.40
  peer_similarity_threshold: 0.68
  pivot_threshold: 0.34
  productive_threshold: 0.40

visibility_regimes:
  - id: immediate
    success_delay_steps: 0
    failure_delay_steps: 0
    success_visibility_probability: 1.0
    failure_visibility_probability: 1.0

fit_worlds:
