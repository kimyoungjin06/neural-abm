  - id: field_public
    cross_fit_folds: 4
    includes_own_public_outcome: false

abm_arms:
  - [fixed_rule, none]
  - [linear_batch, field_public]
  - [tree_batch, field_public]
  - [mlp_batch, field_public]

batch_learners:
  source: EXACT_V2_BATCH_LEARNER_SETTINGS_UNCHANGED
  scalar_batch:
    epochs: 80
    eta: 0.5
    prior_anchor: 0.25
  linear_batch:
    optimizer: ADAM
    epochs: 300
    learning_rate: 0.02
    weight_decay: 0.0001
  mlp_batch:
    hidden_width: 16
    optimizer: ADAM
    epochs: 300
    learning_rate: 0.02
    weight_decay: 0.0001
  tree_batch:
    initial_margin: FROZEN_PRIOR_LOGIT
    rounds: 300
    learning_rate: 0.1
    max_depth: 3
    min_samples_leaf: 5
    leaf_l2: 1.0

probe_cohort:
  base_seed: 20261202
  agent_count: 256
  per_replicate: true

profiles:
  smoke:
    agent_count: 24
    steps: 12
    burn_in_steps: 2
    replicates: 2
    base_seed: 20261201
  development:
    agent_count: 256
    steps: 18
    burn_in_steps: 2
    replicates: 16
    base_seed: 20261201

decision_contract:
  improvement_rule: >-
    MEAN_PAIRED_IMPROVEMENT_AT_LEAST_THRESHOLD_AND_STRICTLY_POSITIVE_IN_AT_LEAST_REQUIRED_REPLICATES
  precision:
    metric: PRODUCTIVE_SHARE_OF_ENTRANTS
    improvement_at_least: 0.02
    improved_replicates_at_least: 12
    outcomes:
      FIRST_BETTER: THE_RULE_PASSES_FOR_FIRST_MINUS_SECOND
      SECOND_BETTER: THE_RULE_PASSES_FOR_SECOND_MINUS_FIRST
      NO_CLEAR_DIFFERENCE: NEITHER_PASSES
    reported: PAIRED_MEAN_AND_95_PERCENT_T_INTERVAL
  learning_noninferiority:
    metric: FIELD_ARM_PROBE_BRIER
    margin: -0.005
    rule: LOWER_BOUND_OF_THE_95_PERCENT_T_INTERVAL_OF_REFERENCE_MINUS_CONDITION_AT_LEAST_THE_MARGIN
    mean_only_rule: REPORTED_FOR_CONTINUITY_WITH_C22_NOT_DECISIVE
  comparisons:
    ranking_at_llm_selectivity_fixed_rule:
      first: llm_selective
      second: hand_at_llm_entry
      arms: [fixed_rule]
      role: PRIMARY_TEST_OF_LLM_RANKING_WITHOUT_LEARNING
    ranking_at_llm_selectivity_learners:
      first: llm_selective
      second: hand_at_llm_entry
      arms: [linear_batch, tree_batch, mlp_batch]
    ranking_at_hand_selectivity:
      first: llm_at_hand_entry
      second: hand
      arms: [fixed_rule, linear_batch, tree_batch, mlp_batch]
    c22_against_entry_matched_hand:
      condition: hybrid_20
      reference: hand_at_llm_entry_20
      arms: [linear_batch, tree_batch, mlp_batch]
      cell_dispositions:
        LLM_DOMINATES: PRECISION_FIRST_BETTER_AND_LEARNING_NONINFERIOR
        SELECTION_ONLY: PRECISION_FIRST_BETTER_ONLY
        LEARNING_ONLY: LEARNING_NONINFERIOR_ONLY
        NEITHER: NEITHER
      study_status:
        C22_PRECISION_SURVIVES_ENTRY_MATCHING: PRECISION_FIRST_BETTER_IN_5_TO_9_OF_9_CELLS
        C22_PRECISION_SURVIVES_IN_MINORITY: PRECISION_FIRST_BETTER_IN_1_TO_4_OF_9_CELLS
        C22_PRECISION_IS_SELECTIVITY: PRECISION_FIRST_BETTER_IN_NO_CELL
    c22_replication_against_hand:
      condition: hybrid_20
      reference: hand
      arms: [linear_batch, tree_batch, mlp_batch]
      role: THIRD_SEED_SET_FOR_C22_UNDER_BOTH_NONINFERIORITY_RULES
  count_labels:
    ALL_CELLS: EVERY_CELL
    MAJORITY: MORE_THAN_HALF
    MINORITY: AT_LEAST_ONE_AND_AT_MOST_HALF
    NO_CELL: ZERO
  nesting_checks:
    required: true
    conditions:
      - UNDER_THE_HAND_CONDITION_THE_FIXED_ARM_EQUALS_THE_PERSISTENCE_PREDECESSOR_IN_THE_LINEAR_WORLD
      - THE_HAND_PRIOR_THROUGH_THE_SLOT_AT_ZERO_SHIFT_EQUALS_THE_HAND_RULE_ON_EVERY_CALIBRATION_REPLICATE
      - THE_PRIOR_AND_ADAPTER_SLOTS_ARE_RESTORED_AFTER_EVERY_TASK
      - THE_LLM_PRIOR_EQUALS_THE_V2_LLM_BASE_RATE_PRIOR_EXACTLY
      - MATCHED_PRIORS_KEEP_THEIR_DIRECTIONS_WEIGHTS_EXACTLY
    failure_action: INVALID_IMPLEMENTATION_STOP
  model_selection: FORBIDDEN

expectations_before_the_run:
  basis: >-
    V4_DESIGN_COHORT_AUC_OF_THE_V3_REFERENCE_PRIOR_AGAINST_THE_HAND_RULE_LINEAR_0.707_VS_0.647_SMOOTH_0.632_VS_0.622_AXIS_0.644_VS_0.643
  E1: RANKING_AT_LLM_SELECTIVITY_FIXED_RULE_IS_FIRST_BETTER_IN_THE_LINEAR_WORLD
  E2: RANKING_AT_LLM_SELECTIVITY_FIXED_RULE_IS_NO_CLEAR_DIFFERENCE_IN_BOTH_INTERACTION_WORLDS
  E3: C22_AGAINST_ENTRY_MATCHED_HAND_IS_C22_PRECISION_SURVIVES_IN_MINORITY_WITH_EVERY_PRECISION_BETTER_CELL_IN_THE_LINEAR_WORLD
  recording: EACH_EXPECTATION_IS_RECORDED_AS_HELD_OR_FAILED_A_FAILED_EXPECTATION_IS_A_REJECTED_CLAIM

