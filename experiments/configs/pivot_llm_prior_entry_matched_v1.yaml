schema_version: pivot_llm_prior_entry_matched.v1
label: pivot_llm_prior_entry_matched_v1
status: PRECOMMIT_DESIGN_NO_RESULT_INTERPRETATION

purpose:
  primary_goal: >-
    TEST_WHETHER_THE_CALIBRATED_LLM_PRIOR_SELECTS_BETTER_ENTRANTS_THAN_THE_HAND_RULE_AT_EQUAL_SELECTIVITY
  question: >-
    C22 found that the calibrated LLM prior with a 20% exploration floor raised
    entrant precision over the hand rule. The LLM prior also admits fewer agents
    (fixed-rule entry about 0.34 against 0.80), and its design-cohort AUC
    matches the hand rule's in both interaction worlds. Does its precision gain
    survive when the hand rule is made equally selective in the world, keeping
    its own feature weights?
  result_informed_successor: true
  informed_by:
    - V2_HAND_LEVEL_CONTROL_MATCHED_THE_MEAN_BUT_NOT_ENTRY_0.465_AGAINST_0.823
    - V3_C22_PRECISION_GAIN_MIXES_RANKING_WITH_SELECTIVITY
    - V4_DESIGN_COHORT_AUC_OF_THE_V3_PRIOR_MATCHES_THE_HAND_RULE_IN_INTERACTION_WORLDS
    - O33_CALIBRATION_MATCHED_IN_THE_WORLD_NOT_ON_A_DESIGN_COHORT
  new_llm_calls: 0
  reuses: V2_HASH_BOUND_CALIBRATED_PRIORS

