claim_boundary: >-
  The metadata-only G0 readiness inventory is independently valid and confirms
  that G0 is not ready. It opens no Parquet or row-level data. Only the
  threshold-free history and primary-pivot choices have D0-resolved successor
  values; seventeen quantitative choices remain unresolved, none of fifteen
  required sections is freeze-ready, and the G-1 and holdout-seal receipts are
  absent. This successor authorizes only a new versioned G0 skeleton that
  copies the fixed prospective design, serializes those two D0-resolved values,
  and preserves every remaining gap. It does not authorize resolving another
  value, opening confirmatory or holdout data, selecting by outcome, final
  eligibility, a G0 seal, model fitting, G4, causality, or a scientific effect.
