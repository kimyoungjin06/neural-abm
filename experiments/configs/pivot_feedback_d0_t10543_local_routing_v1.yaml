  precedence:
    - INDEXING_ANOMALY
    - SEMANTIC_OFF_TOPIC
    - CONTENT_PASS
    - CONTENT_UNRESOLVED
  recent_window_codes: [1, 2]
  recent_title_rows: 64
  minimum_recent_rule_accept_lower_bound_fraction: 0.50
  minimum_recent_rule_reject_lower_bound_fraction_for_semantic_fail: 0.50
  unresolved_and_quarantine_count_as_accept: false
  unresolved_and_quarantine_count_as_reject: false
  indexing_anomaly:
    require_all_signals: true
    minimum_baseline_to_signal_median_primary_topic_score_drop: 0.15
    minimum_baseline_to_signal_dominant_source_share_increase: 0.25
    opaque_signal_title_fraction_is_corroboration_only: true
  sensitivity_accept_thresholds: [0.50, 0.60, 0.70]
  dry_run_state_is_production_disposition: false

post_diagnostic_indexing_evidence:
