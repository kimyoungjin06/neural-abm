routing_contract:
  states:
    - NO_API_RULE_ACCEPT
    - NO_API_RULE_REJECT
    - API_REQUIRED_AMBIGUOUS
    - QUARANTINE_UNRESOLVED
  precedence:
    - QUARANTINE_IF_OPAQUE_OR_UNINFORMATIVE
    - ACCEPT_IF_POSITIVE_AND_NOT_NEGATIVE
    - REJECT_IF_NEGATIVE_AND_NOT_POSITIVE
    - API_REQUIRED_OTHERWISE
  title_normalization:
    strip_html: true
    unicode_nfkd_ascii_fold: true
    lowercase: true
    alphanumeric_tokens_only: true
    collapse_whitespace: true
  minimum_informative_token_count: 2
  global_opaque_title_patterns:
    - '^(?:pvn|psb) (?:lot|rdo) [a-z0-9 ]+$'
  primary_topic_score_used_for_semantic_acceptance: false
  source_name_used_for_semantic_acceptance: false
  api_labels_used_for_rule_execution: false
  unresolved_may_be_forced_to_decisive_label: false
  default_state: API_REQUIRED_AMBIGUOUS

topic_card:
  topic_id: 10543
  display_name: Prostate Cancer Treatment and Research
  reference_id: https://openalex.org/T10543
  positive_patterns:
    - '\bprostat(?:e|ic)\b.*\b(?:cancer|carcinoma|adenocarcinoma|tumou?r)\b'
    - '\b(?:cancer|carcinoma|adenocarcinoma|tumou?r)\b.*\bprostat'
    - 'prostatakarzinom'
    - '\bprostatectomy\b'
    - '\bprostatovesikulektomie\b'
  negative_patterns:
    - '\bbladder tumou?r'
    - '\btrophoblast'
    - '\bandrogen secreting tumou?r'
    - '\bplatelets?\b.*\bmetastasis\b'
  boundary_note: >-
    Explicit prostate-cancer or prostate-carcinoma anchors and named radical
    prostate procedures are accepted. Generic prostate biology, endocrine
    treatment, hormone language, tumor language without a prostate anchor, and
    other organ tumors remain ambiguous or rejected only when an explicit
    negative pattern applies. Opaque archival identifiers are quarantined
    before semantic routing.

candidate_rule_v1:
  provenance:
    relative_path: experiments/configs/pivot_feedback_d0_candidate_content_dry_run_v1.yaml
    sha256: 409c982bc53d06a7608c588efdbe05acf59c8a76d32abc18936da74abcf7f4e4
