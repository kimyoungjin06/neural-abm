claim_boundary: >-
  This contract applies a conservative local topic card and the unchanged
  candidate-rule-v1 thresholds to the independently verified current-snapshot
  T10543 sample. Opaque archival identifiers are quarantined and never sent to
  an API. Post-diagnostic source and score summaries explain indexing quality;
  they do not alter the frozen v1 candidate state. The dry-run result is not a
  production disposition, semantic truth, historical topic validation,
  selection certificate, pivot classification, outcome result, model fit, G4
  opening, or scientific claim.
