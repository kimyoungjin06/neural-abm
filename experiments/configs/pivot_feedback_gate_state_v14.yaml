claim_boundary: >-
  This additive successor freezes the independently replayed adaptive-frontier
  state machine, bounded exhaustive fixture evidence, and initial 51-row
  structural frontier. The bounded fixture result is not claimed as a general
  formal proof. Forty-seven rows are structurally irrelevant under the rank-1
  pass branches, while four rows require content dispositions and all four
  remain unresolved. Only outcome-blind content-rule design, title-sampling
  design, and a zero-cost dry-run on the already frozen 384 titles are
  authorized. A dry-run cannot create production dispositions. Raw title
  scans, new API requests, paid submission, selection certificates,
  reselection, author-panel rebuilding, pivot classification, outcomes,
  fitting, G4, and scientific effects remain not run, unauthorized,
  incomplete, sealed, or not established.
