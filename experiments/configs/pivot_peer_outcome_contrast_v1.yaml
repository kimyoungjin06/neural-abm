schema_version: pivot_peer_outcome_contrast.v1
label: pivot_peer_outcome_contrast_v1
status: PRECOMMIT_DESIGN_NO_RESULT_INTERPRETATION
registered_on: '2026-10-30'
experiment: RECOMMENDED_EXPERIMENT_4_STUDY_2_AGAINST_OPENALEX
purpose: >-
  Study 2 postulates that researchers learn from the visible pivot outcomes
  of their network neighbors, and that the direction of that learning,
  imitative or failure-only, decides whether failed pivots grow. This study
  puts one observable of that mechanism to the OpenAlex discovery partition.
  When a coauthor enters a surge topic, does an author's own entry depend on
  the coauthor's outcome there once it becomes visible, beyond the
  association it already has before it is visible? The same estimator is
  first run on Study 2's own arms, so the data can be read against what each
  learning rule produces, including the arm that does not learn.

