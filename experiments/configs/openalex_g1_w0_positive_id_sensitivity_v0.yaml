claim_boundary: >-
  A pass quantifies the predeclared positive-work-ID sensitivity for the single
  retained W0 record and propagates its one-row removal through the already
  frozen cross-field profile margins. It does not decide whether W0 denotes a
  real or invalid entity, establish historical or current full-root byte
  identity, validate publication dates or authors, select fields or candidate
  researchers, pass G-1 or G0, run empirical G1, or establish an effect.
