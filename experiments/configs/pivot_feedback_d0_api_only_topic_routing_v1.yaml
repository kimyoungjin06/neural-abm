routing_contract:
  states:
    - NO_API_RULE_ACCEPT
    - NO_API_RULE_REJECT
    - API_REQUIRED_AMBIGUOUS
    - QUARANTINE_UNRESOLVED
  precedence:
    - QUARANTINE_IF_OPAQUE_OR_UNINFORMATIVE
    - ACCEPT_IF_POSITIVE_AND_NOT_NEGATIVE
    - REJECT_IF_NEGATIVE_AND_NOT_POSITIVE
    - API_REQUIRED_OTHERWISE
  title_normalization:
    strip_html: true
    unicode_nfkd_ascii_fold: true
    lowercase: true
    alphanumeric_tokens_only: true
    collapse_whitespace: true
  minimum_informative_token_count: 2
  global_opaque_title_patterns:
    - '^(?:pvn|psb) lot [a-z0-9 ]+$'
    - '^fy[0-9]{2}$'
  primary_topic_score_used_for_acceptance: false
  source_name_used_for_acceptance: false
  api_labels_used_for_rule_execution: false
  unresolved_may_be_forced_to_decisive_label: false
  default_state: API_REQUIRED_AMBIGUOUS

topic_cards:
  10579:
    display_name: Cognitive Radio Networks and Spectrum Sensing
    reference_id: https://openalex.org/T10579
    positive_patterns:
      - '\bcognitive radio\b'
      - '\bcognitive network'
      - '\bspectrum sensing\b'
      - '\bcooperative sensing\b'
      - '\bdynamic spectrum access\b'
      - '\bopportunistic spectrum access\b'
      - '\bopportunistic spectral reuse\b'
      - '\bspectrum sharing\b'
      - '\bspectrum pooling\b'
      - '\bspectral reuse\b'
      - '\bprimary user emulation\b'
      - '\bspectrum etiquette'
      - '\bspectrum management\b'
    negative_patterns:
      - '\bcompton effect\b'
      - '\bdisplay cells?\b'
      - '\bsource routing in the internet\b'
      - '\bnoncentral chi square\b'
      - '\bnetview trap\b'
      - '\bradio station\b'
      - '\blearning by doing\b'
    boundary_note: >-
      Generic radio, wireless, detection, allocation, or signal-processing
      language without an explicit spectrum-access or cognitive-radio anchor
      remains API_REQUIRED_AMBIGUOUS.
  12421:
    display_name: Adrenal Hormones and Disorders
    reference_id: https://openalex.org/T12421
    positive_patterns:
      - 'adrenal'
      - 'adreno'
      - 'suprarenal'
      - 'nebennieren'
      - 'addison'
      - 'cortisol'
      - 'corticotrop'
      - '\bacth\b'
      - 'desoxycortic'
      - 'deoxycortic'
      - '17 ketosteroid'
      - 'hypernephroma'
    negative_patterns:
      - '\bpenicillin\b'
      - '\bperitonitis\b'
      - '\berysipel'
      - '\bteropterin\b'
    boundary_note: >-
      Cortisone, hydrocortisone, corticosteroid, or glucocorticoid therapy
      without an adrenal, HPA-axis, cortisol, ACTH, or adrenal-disorder anchor
      remains API_REQUIRED_AMBIGUOUS.
  12505:
    display_name: Peptidase Inhibition and Analysis
    reference_id: https://openalex.org/T12505
    positive_patterns:
      - 'peptidase'
      - 'protease'
      - 'proteinase'
      - 'endopeptid'
      - 'aminopeptid'
      - 'carboxypeptid'
      - 'dipeptidyl'
      - 'peptidolyt'
      - 'proteolyt'
      - '\bcathepsin\b'
      - '\bthermolysin\b'
      - '\btrypsin\b'
      - '\bchymotrypsin\b'
      - '\belastase\b'
      - 'fibroblast activation protein'
      - 'protease inhibitor'
      - 'n terminal acetylation'
    negative_patterns:
      - '\bamylase\b'
      - '\bglycosidase\b'
      - '\bphosphorylases?\b'
      - '\bfibronectin\b'
      - '\bsarcoidosis\b'
      - '\bmelanoma\b'
      - '\bbreast cancer\b'
      - '\bcytolytic t lymphocyte\b'
      - '\btransferrin receptor\b'
      - '\bchromosomes?\b'
      - '\bstreptokinase\b'
    boundary_note: >-
      Peptide or protein sequence analysis alone is not peptidase analysis.
      Non-peptidase enzymes are rejected only when no positive peptidase,
      protease, or proteolysis anchor is present. The current OpenAlex
      description emphasizes fibroblast activation protein and oncology, while
      the historical sample also contains foundational peptidase biochemistry;
      mixed cases remain API_REQUIRED_AMBIGUOUS.
  14430:
    display_name: Higher Education and Teaching Methods
    reference_id: https://openalex.org/T14430
    positive_patterns:
      - '\bhigher education\b'
      - '\bhigh education\b'
      - '\buniversity\b'
      - '\buniversities\b'
      - '\bcollege\b'
      - '\bcolleges\b'
      - '\bundergraduate\b'
      - '\bgraduate education\b'
      - '\bvocational\b'
      - '\bteacher'
      - '\bteaching\b'
      - '\binstruction(?:al)?\b'
      - '\bcurricul'
      - '\bclassroom\b'
      - '\bpedagog'
      - '\be learning\b'
      - '\belearning\b'
      - '\beducation(?:al)?\b'
      - '\bschools?\b'
      - '\bstudents?\b'
    negative_patterns:
      - '\bcountryside information system\b'
      - '\bcomputer progress\b'
      - '\bprimary school\b'
      - '\belementary school\b'
      - '\bkindergarten\b'
    boundary_note: >-
      Generic computing, information systems, construction, or administration
      without an education or teaching anchor remains API_REQUIRED_AMBIGUOUS.
      Primary and elementary education without a higher, vocational, teacher,
      or educational-technology context is not auto-accepted.

