claim_boundary: >-
  This contract freezes current-snapshot topic cards and authorizes only a
  zero-cost routing dry-run on the frozen 384-title diagnostic sample. The
  lexical rules are conservative routing rules, not a semantic gold standard.
  Current OpenAlex topic descriptions, prior API labels, rule/API agreement,
  and request avoidance do not establish accuracy. No API request, production
  disposition, full candidate-work manifest, episode reselection, author-panel
  rebuild, pivot classification, outcome read, model fit, G4 opening, or
  scientific effect is authorized.
