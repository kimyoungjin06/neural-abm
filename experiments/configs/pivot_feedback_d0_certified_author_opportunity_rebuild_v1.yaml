claim_boundary: >-
  A pass establishes only an outcome-blind, exact four-episode predecision
  selected-work manifest and author-opportunity measurement base under the
  frozen scholarly-work ABI. All-field author counts apply that same
  work-level ABI across the complete 26-field taxonomy; fields 17 and 27
  remain the only focal episode fields. It does not establish natural-person
  identity, historical topic observability, final candidate eligibility,
  leave-out or peer exposure, collaboration or affiliation bridges, entry or
  persistence outcomes, an association, a causal mechanism, D0 completion,
  model fitting, G4, or a scientific effect. Leave-out, network, and bridge
  construction remain paused until independent verification passes.
