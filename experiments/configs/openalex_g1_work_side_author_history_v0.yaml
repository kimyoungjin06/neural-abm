claim_boundary: >-
  This DESIGN_ONLY contract freezes a future exact current-snapshot
  token-linked retrospective publication-accounting component and a separate
  synthetic-only implementation ABI. OpenAlex author IDs remain tokens, not
  verified persons. The canonical work-time spine is the only row-level time
  parent; work-topic relation is a parallel sibling. Neither token assignments,
  names, ORCIDs, positions, nor primary-field annotations are established as
  historically observable, and full-snapshot summaries are audit-only rather
  than past-cutoff features. No executable or result exists in this tranche.
  The contract cannot establish author entities, split/merge truth, candidate
  eligibility, citation availability, outcome maturation, G-1, G0, empirical
  G1, field selection, an NABM effect, or any scientific effect.
