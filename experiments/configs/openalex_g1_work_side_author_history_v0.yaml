orcid_policy:
  categories:
    - "null"
    - strict_canonical_url_valid_checksum
    - recoverable_alternate_lexical_form_valid_checksum
    - malformed_or_checksum_invalid
  ascii_only: true
  null_means_json_or_arrow_null_only: true
  empty_string_is_malformed: true
  outer_whitespace_trimming_allowed: false
  percent_decoding_allowed: false
  strict_canonical_url_regex: '^https://orcid[.]org/[0-9]{4}-[0-9]{4}-[0-9]{4}-[0-9]{3}[0-9X]$'
  recoverable_alternate_lexical_forms_in_order:
    - '^http://orcid[.]org/[0-9]{4}-[0-9]{4}-[0-9]{4}-[0-9]{3}[0-9Xx]$'
    - '^https://www[.]orcid[.]org/[0-9]{4}-[0-9]{4}-[0-9]{4}-[0-9]{3}[0-9Xx]$'
    - '^http://www[.]orcid[.]org/[0-9]{4}-[0-9]{4}-[0-9]{4}-[0-9]{3}[0-9Xx]$'
    - '^[0-9]{4}-[0-9]{4}-[0-9]{4}-[0-9]{3}[0-9Xx]$'
    - '^[0-9]{15}[0-9Xx]$'
  canonical_output_regex: '^https://orcid[.]org/[0-9]{4}-[0-9]{4}-[0-9]{4}-[0-9]{3}[0-9X]$'
  canonicalization_steps:
    - match_exactly_one_declared_lexical_form_without_trimming
    - remove_only_the_matched_declared_prefix
    - remove_hyphens
    - uppercase_terminal_x
    - require_exactly_16_ascii_characters
    - insert_hyphens_4_4_4_4
    - prepend_https_orcid_org
    - validate_checksum
  checksum:
    resolution: ISO_7064_MOD_11_2
    input: first_15_ascii_digits
    recurrence: total = (total + digit) * 2
    remainder: total % 11
    check_value: (12 - remainder) % 11
    check_character: decimal_digit_unless_10_then_uppercase_X
  invalid_checksum_category: malformed_or_checksum_invalid
  cross_cardinality_diagnostics:
    - author_token_to_distinct_canonical_orcid
    - canonical_orcid_to_distinct_author_token
    - author_work_pair_to_distinct_canonical_orcid
  split_merge_semantics: anomaly_proxy_not_ground_truth
  past_observable_model_feature_allowed: false

name_policy:
