  - retained_authorship_rows = null_orcid_rows + non_null_orcid_rows
  - retained_main_rows = complete_works + partial_works + none_usable_works + zero_authorship_row_works
  - every_retained_authorship_row_joins_exactly_one_retained_main_work
  - every_retained_main_authors_count_equals_observed_raw_authorship_slots
