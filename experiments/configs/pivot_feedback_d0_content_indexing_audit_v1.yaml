    - updated_date

sampling:
  algorithm: SHA256_LOWEST_BY_EPISODE_AND_WINDOW
  seed: pivot-feedback-d0-content-indexing-v1
  per_episode_window: 32
  window_codes:
    0: EARLIER_PRE_SIGNAL
    1: BASELINE
    2: SIGNAL

automated_checks:
  require_every_sampled_work_found_once: true
  require_publication_year_match: true
  require_primary_topic_match: true
  require_work_type_match: true
  maximum_missing_title_fraction_per_episode_window: 0.05
  maximum_missing_topic_score_fraction_per_episode_window: 0.05
  indexing_review_flags:
    absolute_baseline_signal_link_rate_shift: 0.10
    absolute_baseline_signal_median_topic_score_shift: 0.15
    absolute_baseline_signal_dominant_source_share_shift: 0.25
    single_year_attention_ratio_with_minimum_previous_count:
      ratio: 4.0
      minimum_previous_count: 25

human_review:
  required: true
  unit: SAMPLED_WORK_TITLE
  labels: [ON_TOPIC, AMBIGUOUS, OFF_TOPIC, UNREVIEWABLE]
  minimum_two_reviewers: true
  adjudicate_disagreements: true
  freeze_completed_review_before_leaveout_or_network_construction: true

forbidden_inputs_and_outputs:
  entry_rows_read: false
  persistence_rows_read: false
  realized_citation_rows_read: false
  effect_sizes_read: false
  prediction_rows_read: false
  g4_rows_read: false
  model_fitting: false
  episode_reselection: false

output_contract:
  automated_pass_status: PASS_D0_CONTENT_INDEXING_EXTRACTION_HUMAN_REVIEW_REQUIRED
  blocked_status: BLOCKED_D0_CONTENT_INDEXING_AUDIT
  report_schema_version: pivot_feedback_d0_content_indexing_audit_report.v1
  receipt_schema_version: pivot_feedback_d0_content_indexing_audit_outputs.v1
  sample_schema_version: pivot_feedback_d0_content_review_sample.v1
  annual_profile_schema_version: pivot_feedback_d0_episode_annual_indexing_profile.v1
  output_directory_must_be_new: true
  output_directory_mode: "0700"
  output_file_mode: "0600"
  receipt_written_last: true
  d0_complete_after_automated_pass: false
  leaveout_network_bridge_authorized_after_automated_pass: false
  discovery_outcome_opening_authorized: false
  model_fitting_authorized: false
  g4_open: false
  gpu_used: false

claim_boundary: >-
  This outcome-blind audit extracts a deterministic title-and-metadata sample
  and profiles pre-decision annual attention for the four measurement-ABI
  episodes. Automated agreement with the current OpenAlex primary-topic
  snapshot cannot establish historical topic truth or semantic coherence.
  Human double review and indexing-discontinuity adjudication remain required.
  Entry, persistence, citations, predictions, G4, model fitting, leave-outs,
  network bridges, associations, causal mechanisms, and scientific effects
  remain unopened, unauthorized, not run, or not established.
