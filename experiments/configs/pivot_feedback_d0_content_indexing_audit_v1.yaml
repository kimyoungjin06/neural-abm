current_snapshot_source:
  root_env: OPENALEX_DERIVED_ROOT
  root_id: openalex_works_20260330_repairreplay_20260410_190630
  main_table_directory: openalex_works_20260330
  source_inventory_manifest_sha256: 6b5929a0155c033e818a816aad57095380a3907ab558c8d2cd58a89055f22b46
  expected_main_file_count: 493
  expected_main_footer_rows: 492293207
  required_columns:
    - id
    - title
    - display_name
    - publication_year
    - language
    - type
    - authors_count
    - is_paratext
    - is_retracted
    - primary_topic__id
    - primary_topic__display_name
    - primary_topic__score
    - primary_topic__field__id
    - primary_topic__subfield__id
    - primary_location__source__id
    - primary_location__source__display_name
