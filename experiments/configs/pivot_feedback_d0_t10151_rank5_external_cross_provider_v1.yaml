review_contract:
  target_topic_name: Hepatitis C virus research
  target_definition: >-
    A work is on topic when its supplied evidence shows that the objective,
    population, exposure, intervention, diagnostic test, analysis, or primary
    findings substantively concern hepatitis C, HCV, hepacivirus, or
    historically specific non-A/non-B hepatitis. HCV may be one of several
    explicitly measured primary infections. A work is off topic when the
    evidence affirmatively concerns another condition and contains no such
    hepatitis-C role, or mentions it only incidentally or as background.
  prompt_text: |-
    Classify each scholarly work using only the supplied target definition and
    evidence packet. Controlled subjects are external bibliographic evidence:
    their presence may support a label, but their absence must never be treated
    as proof that a topic is absent. A corrected external title may repair a
    corrupted local title. "Non-A, non-B hepatitis" is the historically specific
    target alias explicitly included by the definition.

    Assign exactly one label and confidence:
    ON_TOPIC: evidence affirmatively shows a substantive target role.
    AMBIGUOUS: a plausible relation exists but evidence is insufficient.
    OFF_TOPIC: evidence affirmatively concerns another subject with no
    substantive target role, or only an incidental mention.
    UNREVIEWABLE: evidence is corrupted, uninterpretable, or incompatible.

    Do not infer authors, identifiers, year, source prestige, citations,
    candidate rank, treatment, outcomes, or downstream effects. Be conservative.
    Return one concise evidence-grounded decision for every opaque item_id.
  labels: [ON_TOPIC, AMBIGUOUS, OFF_TOPIC, UNREVIEWABLE]
  confidence_levels: [HIGH, MEDIUM, LOW]
  exact_items: 11
  maximum_rationale_characters: 180
  rationale_transport:
    raw_response_preserved: true
    maximum_accepted_raw_characters: 720
    persisted_normalization: DETERMINISTIC_UNICODE_PREFIX_TO_MAXIMUM_RATIONALE_CHARACTERS
    semantic_fields_unchanged: [item_id, label, confidence]
  consensus_accept: BOTH_LABEL_ON_TOPIC_AND_CONFIDENCE_HIGH
  consensus_reject: BOTH_LABEL_OFF_TOPIC_AND_CONFIDENCE_HIGH
  all_other_results: REMAIN_UNRESOLVED
  current_accept_rows: 28
  current_reject_rows: 22
  current_unresolved_rows: 14
  holdout_rows: 3
  recent_denominator_rows: 64
  pass_lower_bound_rows: 32
  fail_lower_bound_rows: 32
  human_review: NOT_RUN_BY_DESIGN
  provider_labels_are_ground_truth: false

