claim_boundary: >-
  The frozen threshold-free observable-history classifier partitions all
  3,256,271 registered author-episode rows into exactly four states and an
  independent PyArrow/NumPy engine reproduces all source columns, states, and
  primary booleans with zero mismatch. The 4,301 NEW_TOPIC_ENTRY rows are
  observed-history entries under the current-snapshot ABI, not true
  lifetime-first entries. This successor authorizes only a versioned
  persistence-outcome source/definition contract and synthetic fixtures. It
  does not authorize reading any production classification or post-entry row,
  building production persistence labels, opening discovery outcomes, changing
  confirmatory periods, selecting fields by effect, creating API requests,
  establishing final eligibility, freezing G0, fitting a model, opening G4,
  or claiming an association, causal mechanism, or scientific effect.
