claim_boundary: >-
  This ABI fixes, without entry or persistence outcomes, an authored
  content-bearing scholarly-communication attention universe shared by field
  attention and future author/network measurements. It excludes ineligible,
  paratext, retraction-notice, currently marked retracted, and zero-valid-author
  token works from primary attention while retaining explicit missingness
  accounting. It does not establish historical topic truth, natural-person
  identity, content coherence, absence of indexing discontinuities, valid
  leave-outs, entry, persistence, an association, a causal mechanism, D0
  completion, G0, model fitting, G4, or a scientific effect.
