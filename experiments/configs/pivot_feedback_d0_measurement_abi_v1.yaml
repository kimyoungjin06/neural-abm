    denominator: BASELINE_PLUS_ONE
    compare_by: INTEGER_CROSS_MULTIPLICATION
  candidate_ranking:
    - standardized_gain_exact_desc
    - minimum_baseline_recent_count_desc
    - absolute_gain_desc
    - numeric_topic_id_asc
    - entry_year_asc
  pair_selection:
    algorithm: BEST_CANDIDATE_THEN_BEST_COMPATIBLE_CANDIDATE
    episodes_per_field: 2
    require_distinct_subfield_ids: true
    require_disjoint_baseline_signal_and_reserved_response_windows: true
    minimum_entry_year_separation: 9
  historical_episode_ids_are_not_selection_inputs: true
  fail_if_two_field_four_episode_coverage_not_met: true

