claim_boundary: >-
  This successor changes only the provider custom-ID representation from a
  provider prefix plus a 64-character digest to the unique 64-character digest
  itself. It preserves the v3 failed partial-submission evidence and does not
  relabel the canceled OpenAI attempt or rejected Claude request as completed
  review. Source rows, visible fields, prompt, schemas, models, human
  calibration, and cost authorization are unchanged. Cross-provider execution
  remains pending until both v4 batches are accepted. D0, candidate-universe
  screening, outcomes, G0, model fitting, G4, and scientific effects remain
  closed or unestablished.
