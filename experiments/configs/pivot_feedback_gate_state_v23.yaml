frozen_topic_card:
  freeze_timing: BEFORE_T10151_TITLE_SAMPLE_READ
  semantic_role: CONSERVATIVE_CURRENT_SNAPSHOT_ROUTING_HEURISTIC_NOT_GROUND_TRUTH
  title_normalization:
    strip_html: true
    unicode_nfkd_ascii_fold: true
    lowercase: true
    alphanumeric_tokens_only: true
    collapse_whitespace: true
  minimum_informative_token_count: 2
  global_opaque_title_patterns:
    - '^(?:pvn|psb) (?:lot|rdo) [a-z0-9 ]+$'
  positive_patterns:
    - '\bhepatitis c\b'
    - '\bhcv\b'
    - '\bhepacivirus\b'
    - '\bnon a non b hepatitis\b'
  negative_patterns:
    - '\bhepatitis a\b'
    - '\bhepatitis b\b'
    - '\bhepatitis d\b'
    - '\bhepatitis e\b'
    - '\bhepatitis delta\b'
    - '\bhav\b'
    - '\bhbv\b'
    - '\bhdv\b'
    - '\bhev\b'
  precedence:
    - QUARANTINE_IF_OPAQUE_OR_UNINFORMATIVE
    - ACCEPT_IF_POSITIVE_AND_NOT_NEGATIVE
    - REJECT_IF_NEGATIVE_AND_NOT_POSITIVE
    - API_REQUIRED_OTHERWISE
  boundary_note: >-
    Accept only an explicit hepatitis-C, HCV, hepacivirus, or historically
    specific non-A/non-B-hepatitis anchor. Explicit other-hepatitis anchors
    reject only when no positive anchor is present; mixed or generic hepatitis
    titles remain ambiguous. The card is frozen before reading the target
    sample and is not semantic ground truth.

