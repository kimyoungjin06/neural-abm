  This additive successor binds the independently verified frontier-v5 state,
  freezes a conservative T10151 title-routing card before target-title access,
  and authorizes only the exact normalized scan, deterministic 96-ID sample,
  and selected-ID title lookup needed for Medicine rank 5. It does not
