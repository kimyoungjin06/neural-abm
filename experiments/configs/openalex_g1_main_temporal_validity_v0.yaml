temporal_policy:
  resolution: FROZEN_MAIN_TEMPORAL_POLICY_V1
  strict_date_format: YYYY-MM-DD
  calendar: proleptic_gregorian
  snapshot_date: "2026-03-30"
  publication_date_year:
    require_pairwise_null_concordance: true
    require_finite_integral_year: true
    require_date_derived_year_equality: true
    both_null_disposition: exclude_from_temporal_analysis
    pre_1900_disposition: exclude_from_temporal_analysis
    valid_window_start_inclusive: "1900-01-01"
    snapshot_year_on_or_before_snapshot_disposition: retain_for_later_policy
    snapshot_year_after_snapshot_disposition: exclude_from_temporal_analysis
    post_snapshot_year_disposition: exclude_from_temporal_analysis
    invalid_parse_or_mismatch_disposition: block_component_pass
    aggregate_regression_scope: grammar_valid_w_minus_1_quarantined_w0_retained
    required_aggregate_regression:
      publication_year_null_rows: 27565532
      publication_year_pre_1900_rows: 6692869
