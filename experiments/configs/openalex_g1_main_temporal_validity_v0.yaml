      publication_year_post_snapshot_year_rows: 4010
      publication_year_min: 1000
      publication_year_max: 2050
  created_updated:
    relation: created_date_lte_updated_date
    null_policy: reject_any_null
    parse_error_policy: block_component_pass
    reversal_policy: exact_row_allowlist_only
    exception_policy_resolution: FROZEN_EMPTY_EXACT_ALLOWLIST_V1
    exception_key_fields:
      - id
      - created_date
      - updated_date
      - relative_path
      - row_group
      - file_row
    exceptions: []
    require_every_exception_observed_exactly_once: true
    require_created_not_after_snapshot: true
    require_updated_not_after_snapshot: true
    future_metadata_policy: exact_row_allowlist_only
    future_exception_policy_resolution: FROZEN_EMPTY_EXACT_ALLOWLIST_V1
    future_exception_key_fields:
