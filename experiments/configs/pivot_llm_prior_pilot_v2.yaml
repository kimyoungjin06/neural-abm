schema_version: pivot_llm_prior_pilot.v2
label: pivot_llm_prior_pilot_v2
status: PRECOMMIT_DESIGN_NO_RESULT_INTERPRETATION

purpose:
  primary_goal: >-
    TEST_WHETHER_AGGREGATE_ONLY_CALIBRATION_MAKES_THE_ONCE_ELICITED_LOCAL_LLM_PRIOR_USEFUL_IN_THE_NABM_PRIOR_SLOT
  question: >-
    Once the v1 Qwen prior is put on the decision scale using aggregate
    information only, is it a better starting policy than the hand rule? Does
    it help neighbor-scale learning, persist under pooling, or select better
    entrants? How much entry and evidence does each prior generate?
  result_informed_successor: true
  informed_by: >-
    V1_PRIOR_RANKED_LIKE_THE_HAND_RULE_BUT_ITS_LEVEL_WAS_FAR_TOO_LOW_SO_NO_AGENT_ENTERED_AND_NO_EVIDENCE_WAS_EVER_PRODUCED
  new_llm_calls: 0
  reuses: V1_HASH_BOUND_ELICITATION_ARTIFACTS

