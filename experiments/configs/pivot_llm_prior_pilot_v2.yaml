    role: UNCHANGED_GENERIC_LIFECYCLE_CORE

v1_elicitation:
  directory: /ssd/pivot_llm_prior_pilot_v1_75fbbf7_elicitation
  artifact_sha256:
    elicitation.jsonl: 08724f54e6f564b7a12fe0b3c462e1140be8746538ae3a85ad9e3297313317b9
    llm_prior.json: c891bbfc16bcd5407e6c891d078f5d948748ed67a6c37ac3d23d008f8dc11dbe
    elicitation_receipt.json: 1d9686d4e50b31c000f1397282c745ddcbcfb2f59ced9af18e13c015e52b4018
  design_cohort_features: THE_FEATURES_STORED_IN_ELICITATION_JSONL

calibration:
  information_used: AGGREGATE_ONLY_NO_INDIVIDUAL_LABELS
  method: >-
    KEEP_THE_DISTILLED_WEIGHTS_AND_SHIFT_THE_INTERCEPT_BY_BISECTION_UNTIL_THE_MEAN_PRIOR_PROBABILITY_OVER_THE_DESIGN_COHORT_EQUALS_THE_TARGET
  bisection_interval: [-40.0, 40.0]
  tolerance: 1.0e-10
  stated_population_base_rate: 0.30
  stated_base_rate_source: >-
    THE_DESIGNER_DOCUMENTED_ROUGHLY_THIRTY_PERCENT_OF_HOT_FIELD_PIVOTS_AS_PRODUCTIVE_A_ROUND_AGGREGATE_NOT_THE_MEASURED_DESIGN_COHORT_RATE
  hand_level_target: MEAN_HAND_PRIOR_PROBABILITY_OVER_THE_DESIGN_COHORT

priors:
  - id: hand
    source: EXACT_STUDY2_INITIAL_POLICY
    role: NESTED_PREDECESSOR_AND_DECISION_REFERENCE
  - id: llm_uncalibrated
    source: EXACT_V1_DISTILLED_PRIOR
    role: V1_REFERENCE
  - id: llm_base_rate
    source: V1_DISTILLED_WEIGHTS_WITH_INTERCEPT_CALIBRATED_TO_THE_STATED_BASE_RATE
    role: PRIMARY_CALIBRATED_LLM_PRIOR
  - id: llm_hand_level
    source: V1_DISTILLED_WEIGHTS_WITH_INTERCEPT_CALIBRATED_TO_THE_HAND_PRIOR_MEAN
    role: CONTROLLED_RANKING_COMPARISON_AT_EQUAL_LEVEL
  - id: llm_verbalized
    source: RIDGE_DISTILLATION_OF_THE_V1_VERBALIZED_READOUT_LOG_ODDS
    ridge_lambda_per_profile: 0.001
    role: ALTERNATIVE_READOUT_ON_A_MODERATE_SCALE
  - id: oracle_linear
    source: >-
      PER_WORLD_LOGISTIC_REGRESSION_ON_STRUCTURAL_LABELS_OF_A_FRESH_ORACLE_COHORT
    oracle_cohort_base_seed: 20261022
    oracle_cohort_replicates: 16
    logistic_c: 1.0
    role: BEST_LINEAR_PRIOR_REFERENCE
  - id: flat
    source: ZERO_WEIGHTS_ZERO_BIAS
    role: NO_KNOWLEDGE_REFERENCE
prior_slot: STUDY2_INITIAL_POLICY_REPLACED_FOR_ALL_AGENTS_AND_LEARNERS_WITHIN_A_TASK

common_environment:
  scenario: hot_field_hype
  state_model: persistence_exit_v1
  learning_mode: imitative
  transition:
    failed_minimum_active_steps: 2
    failed_continuation_score:
      productive_fit_weight: 0.5
      current_policy_output_weight: 0.5
      exit_below: 0.4
    reentry_after_exit: false

inherited_learning_parameters:
  neighbor_count: 4
  within_stage_probability: 0.6
  learning_rate: 1.5
  prior_anchor: 0.25
  local_alpha: 0.45
  local_noise_scale: 0.02
  social_alpha: 0.40
  peer_similarity_threshold: 0.68
  pivot_threshold: 0.34
  productive_threshold: 0.40

visibility_regimes:
  - id: immediate
    success_delay_steps: 0
    failure_delay_steps: 0
    success_visibility_probability: 1.0
    failure_visibility_probability: 1.0

fit_worlds:
  worlds:
    - id: linear_fit
    - id: smooth_interaction_fit
    - id: axis_interaction_fit
  implementation: V1_APPLY_FIT_WORLD

evidence_regimes:
  - id: neighbor_local
  - id: field_public
    cross_fit_folds: 4
    includes_own_public_outcome: false

abm_arms:
  - [fixed_rule, none]
  - [online_logistic, neighbor_local]
  - [linear_batch, field_public]
  - [tree_batch, field_public]
  - [mlp_batch, field_public]

batch_learners:
  source: EXACT_V2_BATCH_LEARNER_SETTINGS_UNCHANGED
  scalar_batch:
    epochs: 80
    eta: 0.5
    prior_anchor: 0.25
  linear_batch:
    optimizer: ADAM
    epochs: 300
    learning_rate: 0.02
    weight_decay: 0.0001
  mlp_batch:
    hidden_width: 16
    optimizer: ADAM
    epochs: 300
    learning_rate: 0.02
    weight_decay: 0.0001
  tree_batch:
    initial_margin: FROZEN_PRIOR_LOGIT
    rounds: 300
    learning_rate: 0.1
    max_depth: 3
    min_samples_leaf: 5
    leaf_l2: 1.0

probe_cohort:
  base_seed: 20261021
  agent_count: 256
  per_replicate: true

profiles:
  smoke:
    agent_count: 24
    steps: 12
    burn_in_steps: 2
    replicates: 2
    base_seed: 20261020
  development:
    agent_count: 256
    steps: 18
    burn_in_steps: 2
    replicates: 16
    base_seed: 20261020

decision_contract:
  improvement_rule: >-
    MEAN_PAIRED_IMPROVEMENT_AT_LEAST_THRESHOLD_AND_STRICTLY_POSITIVE_IN_AT_LEAST_REQUIRED_REPLICATES
  improved_replicates_at_least: 12
  evaluated_per_world: true
  reference_prior: hand
  primary_variant: llm_base_rate
  secondary_variants: [llm_hand_level, llm_verbalized, llm_uncalibrated]
  nesting_checks:
    required: true
    conditions:
      - UNDER_THE_HAND_PRIOR_FIXED_AND_ONLINE_ARMS_EQUAL_THE_PERSISTENCE_PREDECESSOR_IN_THE_LINEAR_WORLD
      - THE_PRIOR_SLOT_IS_RESTORED_AFTER_EVERY_TASK
      - LLM_UNCALIBRATED_EQUALS_THE_V1_DISTILLED_PRIOR_EXACTLY
      - CALIBRATED_VARIANTS_KEEP_THE_V1_WEIGHTS_EXACTLY_AND_HIT_THEIR_TARGET_MEAN
    failure_action: INVALID_IMPLEMENTATION_STOP
  prior_quality:
    metric: FIXED_RULE_PROBE_BRIER
    improvement_at_least: 0.01
  local_rescue:
    metric: ONLINE_LOGISTIC_PROBE_BRIER
    improvement_at_least: 0.01
  pooled_washout:
    metric: FIELD_ARM_PROBE_BRIER_BOTH_DIRECTIONS
    improvement_at_least: 0.01
    arms: [linear_batch, tree_batch, mlp_batch]
  entry_precision:
    metric: FIXED_RULE_PRODUCTIVE_SHARE_OF_ENTRANTS
    improvement_at_least: 0.02
  dispositions:
    per_decision: [VARIANT_BETTER, HAND_BETTER, NO_CLEAR_DIFFERENCE]
    pooled: [PRIOR_WASHES_OUT_UNDER_POOLING, PRIOR_PERSISTS_UNDER_POOLING]
  self_sealing:
    condition: FIXED_RULE_FINAL_ENTRY_BELOW_0.05_IN_AT_LEAST_12_REPLICATES
    disposition: SELF_SEALING_PRIOR
  reported_for_every_prior:
    - FIXED_RULE_ENTRY_RATE
    - FIELD_EVIDENCE_EVENTS_PER_LEARNER
    - PROBE_BRIER_AND_AUC_BY_ARM
  model_selection: FORBIDDEN

precommit:
  run_requires_full_commit_sha: true
  run_requires_clean_bound_paths: true
  precommit_paths:
    - docs/research/pivot-llm-prior-pilot-v2.md
    - docs/package-release-boundary.md
    - experiments/configs/pivot_llm_prior_pilot_v2.yaml
    - scripts/prototype_pivot_llm_prior_pilot_v2.py
    - scripts/inspect_release_artifacts.py
    - tests/test_pivot_llm_prior_pilot_v2.py
    - tests/test_release_artifact_inspection.py
  interpretation_before_frozen_execution: FORBIDDEN

outputs:
  - calibrated_priors.json
  - runs.jsonl
  - scorecard.json
  - scorecard.md
  - receipt.json

boundaries:
  repository_only: true
  generic_nabm_api_changed: false
  empirical_rows_read: 0
  paid_api_calls: 0
  new_llm_calls: 0
  model_selected: "NO"
  neural_necessity: NOT_ESTABLISHED
  llm_knowledge_of_real_pivots: NOT_ESTABLISHED_THE_WORLDS_ARE_SYNTHETIC
  scientific_effect: NOT_ESTABLISHED
  package_promotion: NOT_AUTHORIZED
