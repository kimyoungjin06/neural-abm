precommitment_choices:
  g1_replication_tolerance:
    resolution_status: FROZEN_OUTCOME_BLIND_POLICY_RULE
    rule_id: G1_FIELD_VERSUS_OTHER_FIELDS_ONE_COHORT_YEAR_NONINFERIORITY_V1
    value: 1.0
    unit: COHORT_YEAR
    value_interpretation: MAXIMUM_TOLERATED_DOWNWARD_FIELD_VERSUS_OTHER_FIELDS_DEGRADATION
    value_basis: ONE_ANNUAL_COHORT_STEP_ON_THE_FROZEN_H3_TIMING_GRID
    estimand:
      episode_value: ENTRY_HAZARD_EARLIEST_PEAK_K_MINUS_THREE_YEAR_PERSISTENCE_EARLIEST_PEAK_K
      episode_value_symbol: delta_j
      episode_value_grid_cohort_years: [-2, -1, 0, 1, 2]
      field_value: EQUAL_WEIGHTED_MEAN_DELTA_J_WITHIN_G1_FIELD
      other_fields_reference: EQUAL_WEIGHTED_MEAN_OF_FIELD_VALUES_ACROSS_THE_OTHER_TWO_G1_FIELDS
      replication_contrast: FIELD_VALUE_MINUS_OTHER_FIELDS_REFERENCE
      replication_contrast_symbol: rho_f
      scale: ADDITIVE_COHORT_YEARS
      favorable_direction: LARGER_IS_MORE_POSITIVE_TIMING_GAP
      target_field_count: 3
      minimum_independent_episodes_per_field: 3
    interval_rule:
      interval: ONE_SIDED_95_PERCENT_LOWER_CONFIDENCE_BOUND
      one_sided_alpha: 0.05
      uncertainty_label: FIELD_BALANCED_EPISODE_CLUSTERED_REGISTERED_G0_PROCEDURE
      lower_noninferiority_margin_cohort_years: -1.0
      pass_rule: EVERY_FIELD_RHO_F_LOWER_BOUND_STRICTLY_GREATER_THAN_MINUS_ONE
      interval_boundary_counts_as_pass: false
      interval_construction_owned_by_future_g0_section: estimators_and_uncertainty
      this_contract_selects_interval_estimator: false
    direction_rule:
      every_field_point_estimate_strictly_positive: true
      every_leave_one_field_out_point_estimate_strictly_positive: true
      every_alternative_pivot_field_point_estimate_strictly_positive: true
      zero_counts_as_positive: false
    primary_branch_guard:
      field_balanced_point_estimate_minimum_cohort_years: 1.0
      point_boundary_counts_as_pass: true
      primary_one_sided_95_percent_lower_bound_strictly_greater_than_zero: true
      replication_rule_may_rescue_failed_primary: false
      primary_rule_may_rescue_failed_replication: false
    failure_rule:
      any_field_missing: FAIL_G1_REPLICATION
      fewer_than_three_independent_episodes_in_any_field: FAIL_G1_REPLICATION
      nonpositive_field_direction: FAIL_G1_REPLICATION
      nonpositive_leave_one_field_out_direction: FAIL_G1_REPLICATION
      nonpositive_alternative_pivot_direction: FAIL_G1_REPLICATION
      lower_bound_at_or_below_minus_one: FAIL_G1_REPLICATION
      missing_or_nonfinite_value: FAIL_G1_REPLICATION
      primary_branch_failure: FAIL_G1_PRIMARY_AND_REPLICATION_PACKAGE
      post_access_margin_relaxation_allowed: false
    claim_role: FIELD_TRANSPORT_NONINFERIORITY_POLICY_NOT_REPLICATION_PROBABILITY_OR_EFFECT_TRUTH

