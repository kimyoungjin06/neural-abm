claim_boundary: >-
  This outcome-blind contract precommits only a one-cohort-year, field-versus-
  other-G1-fields noninferiority tolerance for the H3 timing-gap estimand and a
  closed synthetic decision fixture. The value is a conservative annual-grid
  policy, not a literature-mandated constant, replication probability, power
  or precision guarantee, exact-effect equality result, cross-domain transport
  result, causal claim, or empirical effect. The contract consumes a future
  registered one-sided interval but does not select its estimator or complete
  the estimators-and-uncertainty section. G0 v4 remains byte-identical and
  unresolved, no discovery, G1, production, confirmatory, or holdout row is
  read, no G0 successor is created, no model is fitted, and G4 remains unopened.
