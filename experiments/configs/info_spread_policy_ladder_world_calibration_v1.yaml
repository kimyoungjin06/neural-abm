purpose: 'O28 attributed the utility cost of D5''s prior inside the learner to its calibration (C63) and found the
  unclipped prior''s answers and calibration interacting (C64), but its recalibration was matched on the design cohort
  and overshot in the world (C66). This study repeats O28''s 2 x 2 with each recalibrated prior''s location matched in
  the world, on separate calibration worlds, to its source''s share rate, and asks whether C63 and C64 hold.'
