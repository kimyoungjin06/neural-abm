    read: REGIME B UTILITY OF F1, P0, P0u, L0, L1, AND L1u FROM O25'S DEVELOPMENT CELLS; THE MINIMUM EFFECTS AND THE
      COSTED CASES FROM ITS RECORD
  prior_calibration:
    contract: experiments/configs/info_spread_policy_ladder_prior_calibration_v1.yaml
    record: experiments/evidence/results/info_spread_policy_ladder_prior_calibration_v1_20261023.summary.json
    read: O28'S RECALIBRATED WEIGHTS (REBUILT BY ITS RUNNER) AND ITS ATTRIBUTIONS, FOR COMPARISON
  elicitation: D5'S FIRST REGISTERED ELICITATION, CHECKED AGAINST THE D5 RECORD, TO REBUILD P0 AND P0u EXACTLY
profile_for_counts: development
world_calibration:
  weights: O28'S RECALIBRATED WEIGHTS, THE DIRECTION PRIOR'S WEIGHTS AT THE CALIBRATION SOURCE'S LOGIT SD OVER D3B'S
    COHORT; ONLY THE INTERCEPT IS SET HERE
  statistic: MEAN UNVERIFIED SHARES PER RUN OF THE FIXED PRIOR (DECIDED SHARES, POLICY AND EXPLORATION FLOOR, OF ITEMS
    WHOSE FACT-CHECK IS NOT PUBLIC AT THE DECISION)
  target: THE CALIBRATION SOURCE'S (F1, P0, OR P0u) MEAN UNVERIFIED SHARES PER RUN ON THE SAME CALIBRATION RUNS
  world_seed_offset: 15000
  worlds_per_geometry: 4
  replicates: [0, 1]
  calibration_runs: STUDY V2'S GENERATOR AND PROFILE AT WORLD SEEDS 15000-15011 (FOUR PER STUDY GEOMETRY, LINEAR,
    SMOOTH, AXIS), TWO STREAM REPLICATES EACH, 24 RUNS PER REGIME; NO REGISTERED STUDY USES THESE SEEDS
  keep_tolerance: 0.02
  keep_rule: KEEP O28'S COHORT-MATCHED INTERCEPT IF ITS SHARE COUNT IS WITHIN 2% OF THE TARGET
  bisection_rule: OTHERWISE THE LARGEST INTERCEPT IN THE INTERVAL WHOSE SHARE COUNT DOES NOT EXCEED THE TARGET
  bisection_interval: [-40.0, 40.0]
  bisection_steps: 32
  reported: EVERY TARGET, METHOD, INTERCEPT, AND ACHIEVED SHARE COUNT
priors:
  P0_hcalw: P0_hcal
  F1_pcalw: F1_pcal
  P0u_hcalw: P0u_hcal
  F1_ucalw: F1_ucal
learner_arms:
  L1_hcalw: P0_hcalw
  L0_pcalw: F1_pcalw
  L1u_hcalw: P0u_hcalw
  L0_ucalw: F1_ucalw
comparisons:
  P0/calibration_given_llm_answers: [L1, L1_hcalw]
  P0/calibration_given_hand_answers: [L0_pcalw, L0]
  P0/answers_given_hand_calibration: [L1_hcalw, L0]
  P0/answers_given_llm_calibration: [L1, L0_pcalw]
  P0u/calibration_given_llm_answers: [L1u, L1u_hcalw]
  P0u/calibration_given_hand_answers: [L0_ucalw, L0]
  P0u/answers_given_hand_calibration: [L1u_hcalw, L0]
  P0u/answers_given_llm_calibration: [L1u, L0_ucalw]
consistency: EACH GROUP'S MEAN CELL DIFFERENCE L1 - L0 AND L1u - L0 MUST EQUAL O25'S RECORDED VALUE; ANY FAILURE BLOCKS
  READING
parity: L0 RECOMPUTED AT REPLICATE 0 OF EVERY LEARNER TASK MUST EQUAL ITS RECORDED COUNTS, PRECISIONS, REACH, DECISIONS,
  AND UTILITY EXACTLY; ANY FAILURE BLOCKS READING
measure:
  primary: unverified_utility_per_agent (O25's measure)
  reported_not_judged: unverified shares and unverified share precision of every learner arm
design:
  groups: STUDY V2'S 12 STUDY GROUPS (2 REGIMES x 2 FAMILIES x THE LINEAR, SMOOTH, AND AXIS WORLDS); THE NULL WORLD IS
    NOT RUN
  cells_and_replicates: STUDY V2'S, 20 CELLS PER GROUP AND 16 REPLICATES PER CELL
seeds:
  learner_seeds: STUDY V2'S, AS FOR L0, L1, AND L1u
  rule_tag: 33
rule:
  comparison: paired difference in utility per agent per run
  bootstrap_resamples: 2000
  interval: 0.95
  resampling: cells, with replacement
  minimum_effect: O25'S RECORDED MINIMUM EFFECT PER REGIME (1% OF F1'S MEAN ABSOLUTE UTILITY), NOT RECOMPUTED
  material: interval excludes zero and |mean cell delta| >= the regime's minimum effect
dispositions:
  per_comparison_and_regime: MOSTLY_POSITIVE if POSITIVE in at least 4 of the 6 study groups, MOSTLY_NEGATIVE if NEGATIVE
    in at least 4 of 6, otherwise MIXED_OR_NONE
  mostly_at_least: 4
  world_match_tolerance: 0.1
  world_match_check: 'Out of sample, on the study cells: each world-calibrated fixed prior''s mean unverified share
    count must lie within 10% of its calibration source''s. If either world-calibrated prior of an LLM prior fails in
    a regime, that case is WORLD_MATCH_FAILED.'
  attribution_per_prior_and_regime: O28'S RULE. CALIBRATION if both calibration comparisons are MOSTLY_NEGATIVE and the
    two answers comparisons are not both MOSTLY_NEGATIVE; ANSWERS in the reverse case; BOTH if all four are;
    NEITHER_CONSISTENTLY otherwise
  costed_cases: [P0/A, P0/B, P0u/B]
  claims_tested: C63 HOLDS if P0/A AND P0/B ARE BOTH CALIBRATION; C64 HOLDS if P0u/B IS NEITHER_CONSISTENTLY
  overall: O33_WORLD_MATCH_FAILED if any costed case failed the world-match check; otherwise O33_C63_AND_C64_HOLD,
    O33_ONLY_C63_HOLDS, O33_ONLY_C64_HOLDS, or O33_NEITHER_HOLDS
  expected_before_the_run: 'C63 holds, stated so it can be rejected: in Regime A, O28''s P0-calibrated prior already
    shared exactly like P0, so one of the two calibration routes is unchanged there. Whether C64 holds is not
    predicted, because its strongest part (the answers lowering utility at F1''s calibration) is the comparison the
    overshoot affected most.'
precommit:
  precommit_paths:
  - docs/research/info-spread-policy-ladder-world-calibration-v1.md
  - experiments/configs/info_spread_policy_ladder_world_calibration_v1.yaml
  - scripts/run_info_spread_policy_ladder_world_calibration_v1.py
  - tests/test_info_spread_policy_ladder_world_calibration_v1.py
runs:
  pilot: --pilot-cells 2 under full load, for the time estimate only (its world calibration runs in full); its summary
    is not opened
  development: --profile development --precommit-sha <HEAD> --elicitation-dir <D5 first elicitation> --v2-cells --d5-cells
    --o24-cells --o25-cells <the four development cells.jsonl> on GPU-Server, CUDA_VISIBLE_DEVICES=2, 24 workers
  reproduction: the same command into a second output directory; cells.jsonl and summary.json must be byte identical
outputs: [cells.jsonl, summary.json, progress.jsonl, receipt.json]
boundaries:
  empirical_rows_read: 0
  llm_calls: 0
  paid_api_calls: 0
  generic_nabm_api_changed: false
  location_only: ONLY THE LOCATION IS MATCHED IN THE WORLD; THE STEEPNESS STAYS O28'S, MATCHED ON THE COHORT
  one_statistic: THE MATCH IS ON UNVERIFIED SHARE COUNTS, NOT ON WHICH ITEMS ARE SHARED
  synthetic_only: true
