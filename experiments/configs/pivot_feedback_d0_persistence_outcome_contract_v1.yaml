  last_complete_calendar_year: 2025
  matured_rule: entry_year + 3 <= 2025
  exact_four_all_matured: true
  exact_four_latest_required_outcome_year: 2015
  right_censored_state: RIGHT_CENSORED
  partial_positive_work_may_override_right_censoring: false
  right_censored_count_columns: null
  right_censored_boolean: null
  matured_positive_state: MATURED_PERSISTENCE
  matured_zero_state: MATURED_NO_PERSISTENCE
