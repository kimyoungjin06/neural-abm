persistence_definition:
  label: THREE_YEAR_TARGET_TOPIC_PERSISTENCE
  unit: AUTHOR_TOKEN_X_CERTIFIED_PRIMARY_TOPIC_X_ENTRY_YEAR
  primary_pivot_state: NEW_TOPIC_ENTRY
  outcome_window_offsets: [1, 2, 3]
  window_inclusive: true
  qualifying_rule: >-
    A matured observable-history NEW_TOPIC_ENTRY persists when its current
    OpenAlex author token is linked to at least one distinct eligible work in
    t+1, t+2, or t+3 whose current-snapshot primary topic and field exactly
    match the certified episode topic and field.
  qualifying_count_threshold: 1
  aggregation: COUNT_DISTINCT_AUTHOR_WORK_PAIR
  distinct_work_counts_by_offset_required: true
  total_count_equals_sum_of_offset_counts: true
  team_cap: NONE
  future_outcome_does_not_redefine_primary_pivot: true
  true_researcher_topic_persistence_claim_allowed: false
  current_snapshot_annotated_persistence_claim_only: true

maturation_and_censoring:
