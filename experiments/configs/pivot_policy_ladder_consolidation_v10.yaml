claims:
  confirmed:
  - id: C74_at_equal_selectivity_the_llm_prior_ranks_better_only_in_the_linear_world
    statement: With the hand rule's intercept shifted so that its fixed-rule entry in the world equals the LLM
      prior's, the LLM direction picks more productive entrants under the fixed rule only in the linear world
      (+0.059, 95% interval +0.035 to +0.082). In the smooth and axis interaction worlds there is no clear
      difference (+0.015 and -0.001), as the design-cohort AUC predicted.
    evidence:
    - source: entry_matched_control
      pointer: decisions/ranking_at_llm_selectivity_fixed_rule/cells/linear_fit~1fixed_rule/outcome
      equals: FIRST_BETTER
    - source: entry_matched_control
      pointer: decisions/ranking_at_llm_selectivity_fixed_rule/cells/linear_fit~1fixed_rule/interval_95/low
      greater_than: 0.03
    - source: entry_matched_control
      pointer: decisions/ranking_at_llm_selectivity_fixed_rule/cells/smooth_interaction_fit~1fixed_rule/outcome
      equals: NO_CLEAR_DIFFERENCE
    - source: entry_matched_control
      pointer: decisions/ranking_at_llm_selectivity_fixed_rule/cells/axis_interaction_fit~1fixed_rule/outcome
      equals: NO_CLEAR_DIFFERENCE
  - id: C75_c22s_precision_gain_is_selectivity
    statement: Against a hand rule made equally selective by one intercept shift and given the same 20% exploration
      floor, the calibrated LLM hybrid selects better entrants in none of the 9 world-and-learner cells and worse in
      one (linear world, MLP learner). No cell is dominated.
    evidence:
    - source: entry_matched_control
      pointer: decisions/c22_against_entry_matched_hand/status
      equals: C22_PRECISION_IS_SELECTIVITY
    - source: entry_matched_control
      pointer: decisions/c22_against_entry_matched_hand/precision_better_cells
      equals: []
    - source: entry_matched_control
      pointer: decisions/c22_against_entry_matched_hand/precision_worse_cells
      equals: [linear_fit/mlp_batch]
    - source: entry_matched_control
      pointer: decisions/c22_against_entry_matched_hand/dominance
      equals: NO_CELL
  - id: C76_inside_pooled_learners_the_llm_direction_adds_nothing_at_either_selectivity
    statement: Inside the pooled learners, at the LLM prior's selectivity the LLM direction is better in 1 of 9
      cells and worse in 1. At the hand rule's selectivity it is better in none of 12 cells and worse in 7, all of
      them learner cells.
    evidence:
    - source: entry_matched_control
      pointer: decisions/ranking_at_llm_selectivity_learners/counts/FIRST_BETTER
      equals: 1
    - source: entry_matched_control
      pointer: decisions/ranking_at_llm_selectivity_learners/counts/SECOND_BETTER
      equals: 1
    - source: entry_matched_control
      pointer: decisions/ranking_at_hand_selectivity/counts/FIRST_BETTER
      equals: 0
    - source: entry_matched_control
      pointer: decisions/ranking_at_hand_selectivity/counts/SECOND_BETTER
      equals: 7
  - id: C77_c22s_dominance_count_depends_on_the_seed_set_and_the_noninferiority_rule
    statement: On a third seed set the hybrid still picks more productive entrants than the native hand rule in 9
      of 9 cells, but it dominates in 4 of 9 by C22's mean-only non-inferiority rule and in 2 of 9 by an
      interval rule. Recomputed from v3's record, C22's own cells pass the interval rule in 2 of 9.
    evidence:
    - source: entry_matched_control
      pointer: c22_across_seed_sets/this_study_precision_better_than_native_hand
      equals: 9 of 9
    - source: entry_matched_control
      pointer: c22_across_seed_sets/this_study_mean_only_rule
      equals: 4 of 9
    - source: entry_matched_control
      pointer: c22_across_seed_sets/this_study_interval_rule
      equals: 2 of 9
    - source: entry_matched_control
      pointer: c22_across_seed_sets/v3_interval_rule_recomputed_post_hoc
      equals: 2 of 9
  - id: C78_one_intercept_shift_matches_selectivity_in_the_world_and_the_control_reproduced
    statement: Fixed-rule entry does not depend on the world. Shifting the hand rule's intercept by -0.28 matched
      the LLM prior's entry (0.323) on 16 calibration replicates; on the study replicates the matched hand rule
      admitted 0.959 times as many agents, inside the registered [0.95, 1.05], a gap worth at most +0.003 of
      precision to the hand rule. Every artifact reproduced byte for byte.
    evidence:
    - source: entry_matched_control
      pointer: calibration/records/0/intercept_shift
      less_than: -0.27
    - source: entry_matched_control
      pointer: calibration/records/0/intercept_shift
      greater_than: -0.29
    - source: entry_matched_control
      pointer: post_hoc_descriptive/entry_is_world_independent_under_the_fixed_rule
      equals: true
    - source: entry_matched_control
      pointer: decisions/entry_match_check/status
      equals: PASS
    - source: entry_matched_control
      pointer: decisions/entry_match_check/records/0/fixed_rule_entry_ratio
      greater_than: 0.95
    - source: entry_matched_control
      pointer: post_hoc_descriptive/residual_entry_gap/axis_interaction_fit/implied_precision_advantage_to_the_matched_hand
      less_than: 0.005
    - source: entry_matched_control
      pointer: reproduction/byte_identical/runs.jsonl
      equals: true
    - source: entry_matched_control
      pointer: reproduction/byte_identical/scorecard.json
      equals: true
  rejected:
  - id: R22_c22s_precision_survives_in_linear_world_cells
    statement: The entry-matched control's expectation stated before the run (E3), that C22's precision gain
      survives against the entry-matched hand rule in a minority of cells, all in the linear world.
    reason: It survives in no cell. The LLM direction's fixed-rule advantage in the linear world (C74) does not
      carry into the learners once the exploration floor is added.
    evidence:
    - source: entry_matched_control
      pointer: expectations/E3/held
      equals: false
    - source: entry_matched_control
      pointer: expectations/E1/held
      equals: true
    - source: entry_matched_control
      pointer: expectations/E2/held
      equals: true
  open:
  - id: O35_why_the_linear_learner_loses_in_the_linear_world
    question: Why does the pooled linear learner forecast worse than the MLP in the linear world, where a linear
      policy is correctly specified? This reopens O12 (v2), which was not carried after v2.
    kind: SYNTHETIC
    priority: 1
    motivation: Under the hand rule in this study's linear world, the linear learner's probe Brier is 0.060 against
      the MLP's 0.013. A correctly specified policy class losing in its own world points at the learner's fit or at
      the evidence it sees, and any capacity comparison depends on the answer.
    evidence:
    - source: entry_matched_control
      pointer: cells/1/arm_id
      equals: linear_batch
    - source: entry_matched_control
      pointer: cells/1/means/probe_brier
      greater_than: 0.05
    - source: entry_matched_control
      pointer: cells/3/arm_id
      equals: mlp_batch
    - source: entry_matched_control
      pointer: cells/3/means/probe_brier
      less_than: 0.02
