claim_boundary: >-
  This successor changes the planned execution path from two humans reviewing
  every sampled title to two pinned API model judges screening every sampled
  title plus a deterministic, blinded human calibration and escalation set.
  API judges never count as human reviewers. Request preparation is not API
  execution; API execution is not human calibration; and a calibrated
  384-title result is not a complete-candidate-universe contamination pass.
  Episode 3 remains quarantined, the other episodes are not promoted, the old
  author panel remains superseded, and no outcome, G0, model, G4, or scientific
  effect is opened or established.
