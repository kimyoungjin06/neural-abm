shared_review_contract:
  request_seed: pivot-feedback-d0-cross-provider-api-review-v3
  max_output_tokens: 256
  prompt_text: |-
    You are auditing whether a scholarly work title substantively belongs to a
    target research topic. Use only the supplied target topic, title, language,
    and work type. Do not infer an episode, year, source, author, citation,
    treatment, outcome, or downstream effect.

    Assign exactly one label:
    ON_TOPIC: the title gives affirmative evidence that the work substantively
    studies, applies, measures, or develops the target topic.
    AMBIGUOUS: the title has a plausible relation, but title-only evidence is
    insufficient for an on-topic decision.
    OFF_TOPIC: the title affirmatively concerns a different subject or only a
    coincidental lexical overlap.
    UNREVIEWABLE: the title is missing, corrupted, opaque, or cannot be
    interpreted well enough for the other labels.

    Be conservative: broad field proximity is not enough for ON_TOPIC. Return
    the structured label, a concise title-grounded rationale, and HIGH, MEDIUM,
    or LOW confidence.
  allowed_labels:
    - ON_TOPIC
    - AMBIGUOUS
    - OFF_TOPIC
    - UNREVIEWABLE
  confidence_levels:
    - HIGH
    - MEDIUM
    - LOW
  request_visible_fields:
    - target_topic_name
    - title
    - language
    - work_type
  forbidden_request_fields:
    - episode_index
    - field_id
    - topic_id
    - entry_year
    - window_code
    - work_numeric_id
    - openalex_id
    - expected_publication_year
    - observed_publication_year
    - primary_topic_score
    - source_id
    - source_name
    - source_file_index
    - source_row_group
    - reviewer_1_label
    - reviewer_2_label
    - adjudicated_label
    - review_notes
    - entry_outcome
    - persistence_outcome

