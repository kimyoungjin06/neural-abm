claim_boundary: >-
  This successor replaces the unsubmitted OpenAI-only v2 execution path with
  one pinned OpenAI judge and one dated Claude judge. The same outcome-blind
  384-title surface and deterministic 96-title two-human calibration remain in
  force. Cross-provider agreement is not human evidence and cannot complete D0.
  Request preparation is not API execution; API execution is not human
  calibration; and a calibrated 384-title result is not a complete-candidate-
  universe contamination pass. Episode 3 remains quarantined, the other
  episodes are not promoted, the old author panel remains superseded, and no
  outcome, G0, model, G4, or scientific effect is opened or established.
