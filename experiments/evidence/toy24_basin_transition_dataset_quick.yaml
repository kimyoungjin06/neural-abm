label: toy24_basin_transition_dataset_quick
seeds: [1, 2, 3]
epochs: 50
config_dir: experiments/configs/generated/evidence_matrix
runs_dir: experiments/runs
success_criteria:
  main_group: nabm
  require_without_teacher_bootstrap_replay: true
  cases:
    toy2_basin_dataset:
      final_ceiling_min_hits: 3
      mean_time_to_ceiling_lt: 10
    toy4_basin_dataset:
      final_ceiling_min_hits: 2
      mean_time_to_ceiling_lt: 12

toy2_neural_objective: &toy2_neural_objective
  model.policy.rule: neural_policy
  model.policy.neural_update_backend: loop
  model.policy.domain.local_update_rule: counterfactual_advantage
  model.policy.domain.objective.profile: linear_welfare_heavy
  model.policy.domain.objective.clip_abs: null
  model.coordination.mixer: output_average
  model.coordination.peer_rule: output_similarity
  model.coordination.alpha: 0.25
  model.coordination.threshold: 0.0
toy2_objective_basin: &toy2_objective_basin
  <<: *toy2_neural_objective
  model.policy.domain.basin_credit.enabled: true
  model.policy.domain.basin_credit.critic: prototype_phase
  model.policy.domain.basin_credit.credit_method: one_step_ablation
  model.policy.domain.basin_credit.objective_weight: 0.5
  model.policy.domain.basin_credit.individual_weight: 0.0
  model.policy.domain.basin_credit.local_social_weight: 0.0
  model.policy.domain.basin_credit.basin_weight: 0.5
  model.policy.domain.basin_credit.horizon: 1
  model.policy.domain.basin_credit.target_basin: ceiling

toy4_neural_objective: &toy4_neural_objective
  model.policy.rule: neural_policy
  model.policy.neural_update_backend: loop
  model.policy.domain.objective.profile: linear_welfare_heavy
  model.policy.domain.objective.clip_abs: null
  model.coordination.mixer: output_average
  model.coordination.peer_rule: output_similarity
  model.coordination.alpha: 0.25
  model.coordination.threshold: 0.0
  domain.environment.resource_enabled: false
toy4_objective_basin: &toy4_objective_basin
  <<: *toy4_neural_objective
  model.policy.domain.basin_credit.enabled: true
  model.policy.domain.basin_credit.critic: prototype_phase
  model.policy.domain.basin_credit.credit_method: one_step_ablation
  model.policy.domain.basin_credit.objective_weight: 0.5
  model.policy.domain.basin_credit.individual_weight: 0.0
  model.policy.domain.basin_credit.local_social_weight: 0.0
  model.policy.domain.basin_credit.basin_weight: 0.5
  model.policy.domain.basin_credit.horizon: 1
  model.policy.domain.basin_credit.target_basin: ceiling

cases:
  - toy: toy2
    name: toy2_basin_dataset
    base_config: experiments/configs/toy2_spatial_pd_baseline.yaml
    primary_metric: final_mean_payoff
    direction: maximize
    ceiling_metric: mean_payoff
    ceiling_value: 3.0
    ceiling_tolerance: 0.001
    variants:
      - name: linear_welfare_heavy
        group: baseline
        updates:
          <<: *toy2_neural_objective
      - name: mixed_objective_basin_escalate_credit_p3_min2_h1
        group: nabm
        updates:
          <<: *toy2_objective_basin
          model.policy.domain.basin_credit.training_scope: all
          model.policy.domain.basin_credit.training_passes: 3
          model.policy.domain.basin_credit.training_pass_schedule: credit_signal_escalation
          model.policy.domain.basin_credit.min_training_passes: 2
          model.policy.domain.basin_credit.training_pass_credit_positive_threshold: 0.6
          model.policy.domain.basin_credit.training_pass_credit_delta_threshold: 0.0
  - toy: toy4
    name: toy4_basin_dataset
    base_config: experiments/configs/toy4_public_goods_baseline.yaml
    primary_metric: final_mean_payoff
    direction: maximize
    ceiling_metric: mean_payoff
    ceiling_value: 0.6
    ceiling_tolerance: 0.005
    variants:
      - name: linear_welfare_heavy
        group: baseline
        updates:
          <<: *toy4_neural_objective
      - name: mixed_objective_basin_escalate_credit_p3_min2_h1
        group: nabm
        updates:
          <<: *toy4_objective_basin
          model.policy.domain.basin_credit.training_scope: all
          model.policy.domain.basin_credit.training_passes: 3
          model.policy.domain.basin_credit.training_pass_schedule: credit_signal_escalation
          model.policy.domain.basin_credit.min_training_passes: 2
          model.policy.domain.basin_credit.training_pass_credit_positive_threshold: 0.6
          model.policy.domain.basin_credit.training_pass_credit_delta_threshold: 0.0
