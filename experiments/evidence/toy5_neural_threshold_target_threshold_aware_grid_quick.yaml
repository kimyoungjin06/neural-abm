          domain.graph.rewire_probability: 0.0
      - name: neural_threshold_aware_grid_lattice_k4_h0p85_threshold_anchor
        group: directional_threshold_target_threshold_aware_grid
        updates:
          <<:
            [
              *toy5_neural_threshold_target_common,
